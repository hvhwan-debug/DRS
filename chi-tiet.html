  <script>
    const vietnameseImagePool = [
      "images/uploads/2-onl-16997056815001293662280.jpg",

      "images/uploads/Ban-Sao-Luong-Giao-V.jpg",

    ];

    // Kho lưu trữ chính xác toàn bộ 20 bài viết khớp 100% với file nhận vào
    const articlesDB = {
      "bai-1.md": { title: "Sắp diễn ra chương trình thiện nguyện vì trẻ em đến trường tại Hà Giang", date: "Tháng 11 / 2026", content: "Một chương trình thiện nguyện hướng tới trẻ em vùng cao Hà Giang dự kiến sẽ được tổ chức trong thời gian tới, với mục tiêu hỗ trợ các em có thêm điều kiện học tập và đến trường.<br><br>Chương trình được triển khai với sự chung tay của các cá nhân, đơn vị và những người quan tâm đến công tác hỗ trợ trẻ em vùng khó khăn. Các hoạt động dự kiến tập trung vào việc trao tặng những phần quà, vật dụng cần thiết phục vụ học tập và sinh hoạt cho trẻ em tại khu vực còn nhiều khó khăn.<br><br>Thông qua chương trình, ban tổ chức mong muốn góp phần chia sẻ khó khăn với các em nhỏ, đồng thời lan tỏa tinh thần tương thân tương ái." },
      "bai-2.md": { title: "Chương trình Gieo Mầm Tri Thức Mùa Hè", date: "Tháng 07 / 2026", content: "Trao tặng hơn 500 đầu sách và học liệu cho các em học sinh vùng cao, mở ra cơ hội tiếp cận tri thức công bằng.<br><br>Chương trình mùa hè năm nay tập trung vào việc xây dựng các góc đọc sách tại lớp học, tổ chức các hoạt động sinh hoạt ngoại khóa giúp học sinh rèn luyện kỹ năng sống và khơi dậy niềm đam mê đọc sách.<br><br>Sự đồng hành của các thầy cô giáo và tình nguyện viên là nguồn động lực to lớn giúp lan tỏa văn hóa đọc đến từng bản làng." },
      "bai-3.md": { title: "Khánh thành Tủ Sách Vùng Cao Đợt 1", date: "Tháng 05 / 2026", content: "Hoàn thành lắp đặt và bàn giao 5 tủ sách cộng đồng tại các điểm trường tiểu học khó khăn.<br><br>Mỗi tủ sách đi kèm hàng trăm cuốn sách thiếu nhi, sách khoa học thường thức mang lại không gian giải trí và học tập bổ ích sau giờ lên lớp cho các em nhỏ.<br><br>Đây là bước khởi đầu trong chuỗi hoạt động dài hạn nhằm phát triển văn hóa đọc và nâng cao dân trí tại các khu vực vùng sâu vùng xa." },
      "bai-4.md": { title: "Chuỗi lớp học kỹ năng mềm và tư duy", date: "Tháng 03 / 2026", content: "Tổ chức các buổi sinh hoạt ngoại khóa giúp thanh thiếu niên rèn luyện sự tự tin và kỹ năng tự học.<br><br>Thông qua các trò chơi tương tác và bài học thực tế, học sinh được trang bị thêm tư duy phản biện, kỹ năng làm việc nhóm và phương pháp quản lý thời gian hiệu quả.<br><br>Chương trình nhận được sự hưởng ứng nhiệt tình từ phía nhà trường và phụ huynh học sinh." },
      "bai-5.md": { title: "Hành trình Tiếp Sức Đến Trường", date: "Tháng 02 / 2026", content: "Hỗ trợ học phí và dụng cụ học tập cho học sinh nghèo vượt khó vươn lên trong học tập.<br><br>Những phần quà đầu năm mới đã kịp thời động viên tinh thần, giúp các em vững bước đến trường và tiếp tục theo đuổi ước mơ tri thức.<br><br>Chúng tôi cam kết tiếp tục đồng hành cùng các em trong suốt chặng đường học tập phía trước." },
      "bai-6.md": { title: "Ký kết hợp tác mở rộng mạng lưới giáo dục", date: "Tháng 01 / 2026", content: "Hợp tác cùng các tổ chức xã hội để đẩy mạnh phong trào quyên góp sách toàn quốc.<br><br>Sự kiện đánh dấu bước ngoặt quan trọng trong việc mở rộng quy mô hoạt động, đưa tri thức đến gần hơn với hàng ngàn học sinh vùng sâu vùng xa.<br><br>Mạng lưới đối tác ngày càng lớn mạnh sẽ là nền tảng vững chắc cho các dự án cộng đồng tiếp theo." },
      "bai-7.md": { title: "Tổng kết chiến dịch Tết Chia Sẻ", date: "Tháng 12 / 2025", content: "Nhìn lại những cột mốc ý nghĩa và các phần quà ấm áp gửi đến đồng bào khó khăn cuối năm.<br><br>Hàng trăm suất quà Tết đã được trao tận tay các hộ gia đình chính sách và học sinh nghèo hiếu học.<br><br>Sự ấm áp từ tình người đã sưởi ấm mùa đông giá rét nơi vùng cao." },
      "bai-8.md": { title: "Hội thảo giáo dục cộng đồng toàn quốc", date: "Tháng 11 / 2025", content: "Quy tụ các chuyên gia giáo dục thảo luận về mô hình trường học thân thiện và phi lợi nhuận.<br><br>Hội thảo đưa ra nhiều giải pháp thiết thực nhằm nâng cao chất lượng giáo dục tại các vùng đặc biệt khó khăn.<br><br>Các tham luận chất lượng cao đã mở ra nhiều hướng đi mới cho công tác phát triển giáo dục cộng đồng." },
      "bai-9.md": { title: "Trao học bổng Thắp Sáng Ước Mơ", date: "Tháng 10 / 2025", content: "Nâng bước hàng trăm học sinh nghèo hiếu học vững bước trên con đường chinh phục tri thức.<br><br>Chương trình trao học bổng định kỳ hỗ trợ chi phí sinh hoạt và học tập cho các em có hoàn cảnh đặc biệt khó khăn.<br><br>Nụ cười rạng rỡ của các em chính là phần thưởng quý giá nhất cho ban tổ chức." },
      "bai-10.md": { title: "Phát động chiến dịch mùa đông ấm cho em", date: "Tháng 09 / 2025", content: "Kêu gọi cộng đồng chung tay đóng góp áo ấm và chăn bông chuẩn bị cho mùa đông vùng cao.<br><br>Chương trình mong muốn đem lại sự ấm áp, xua tan cái lạnh giá nơi miền núi cao.<br><br>Mọi sự đóng góp của quý mạnh thường quân đều được tiếp nhận và công khai minh bạch." },
      "bai-11.md": { title: "Ngày hội đọc sách và tri thức buôn làng", date: "Tháng 08 / 2025", content: "Đưa hàng ngàn đầu sách hay về với các em nhỏ vùng sâu vùng xa trong dịp hè.<br><br>Sự kiện thu hút đông đảo thanh thiếu niên tham gia các hoạt động giao lưu văn hóa đọc và đố vui có thưởng.<br><br>Không gian văn hóa đọc rộn rã tiếng cười đã để lại ấn tượng sâu sắc trong lòng người dân địa phương." },
      "bai-12.md": { title: "Tọa đàm đổi mới phương pháp giảng dạy", date: "Tháng 06 / 2025", content: "Chia sẻ kinh nghiệm giảng dạy ứng dụng công nghệ hiện đại cho giáo viên các điểm trường.<br><br>Nâng cao năng lực chuyên môn và phương pháp sư phạm cho đội ngũ nhà giáo vùng cao.<br><br>Đổi mới tư duy giáo dục là chìa khóa để rút ngắn khoảng cách tri thức giữa các vùng miền." },
      "bai-13.md": { title: "Hành trình xe buýt tri thức lăn bánh", date: "Tháng 04 / 2025", content: "Mô hình thư viện lưu động mang niềm vui đọc sách đến từng thôn bản.<br><br>Giúp các em học sinh tiếp cận hàng trăm đầu sách phong phú mỗi tuần mà không cần đi xa.<br><br>Chuyến xe mang theo tri thức và niềm tin về một tương lai tươi sáng hơn cho thế hệ trẻ." },
      "bai-14.md": { title: "Trao tặng thiết bị tin học cho điểm trường", date: "Tháng 03 / 2025", content: "Trang bị phòng máy tính kết nối internet giúp học sinh tiếp cận tri thức số.<br><br>Mở rộng tầm nhìn và cơ hội học tập công nghệ cho thế hệ trẻ vùng cao trong kỷ nguyên số.<br><br>Các em đã có cơ hội thực hành những bài học tin học đầu tiên vô cùng hào hứng." },
      "bai-15.md": { title: "Hỗ trợ bữa ăn dinh dưỡng học đường", date: "Tháng 02 / 2025", content: "Góp phần cải thiện thể chất và điều kiện ăn ở nội trú cho các em nhỏ vùng cao.<br><br>Chung tay chăm lo sức khỏe và sự phát triển toàn diện cho học sinh tại các điểm trường bán trú.<br><br>Bữa ăn đầy đủ dinh dưỡng giúp các em thêm phần vững tâm bám lớp bám trường." },
      "bai-16.md": { title: "Khởi động dự án Xây trường vùng cao", date: "Tháng 01 / 2025", content: "Khảo sát và đặt nền móng xây dựng các điểm trường kiên cố thay thế nhà tạm.<br><br>Kiến tạo không gian học tập an toàn, khang trang cho thầy và trò vượt qua mùa mưa lũ.<br><br>Dự án nhận được sự chung sức đồng lòng của toàn thể cộng đồng xã hội." },
      "bai-17.md": { title: "Báo cáo minh bạch tài chính quý IV", date: "Tháng 12 / 2024", content: "Công khai chi tiết các khoản thu chi và sao kê dòng tiền hoạt động của quỹ.<br><br>Cam kết thực hiện nghiêm túc nguyên tắc minh bạch và trách nhiệm giải trình trước cộng đồng và các mạnh thường quân.<br><br>Mọi thắc mắc và đối soát đều được hỗ trợ công khai 24/7 qua cổng thông tin." },
      "bai-18.md": { title: "Giải bóng đá thiện nguyện kết nối thanh niên", date: "Tháng 10 / 2024", content: "Gây quỹ hỗ trợ học bổng thường niên cho học sinh nghèo vượt khó.<br><br>Thắt chặt tình đoàn kết và lan tỏa lối sống đẹp trong cộng đồng trẻ qua tinh thần thể thao cao thượng.<br><br>Giải đấu thành công tốt đẹp với tổng số tiền gây quỹ đạt mốc kỷ lục trong năm." },
      "bai-19.md": { title: "Lớp học tình thương cuối tuần", date: "Tháng 08 / 2024", content: "Duy trì các lớp phụ đạo văn hóa và sinh hoạt ngoại khóa miễn phí cho trẻ em lao động.<br><br>Bồi dưỡng kiến thức cơ bản và thắp sáng niềm tin vào tương lai cho các em nhỏ có hoàn cảnh thiệt thòi.<br><br>Tình cảm gắn bó giữa giáo viên tình nguyện và các em học sinh là nguồn năng lượng tích cực lan tỏa." },
      "bai-20.md": { title: "Thành lập mạng lưới tình nguyện viên toàn quốc", date: "Tháng 05 / 2024", content: "Kết nối những trái tim nhiệt huyết cùng chung tay vì sự nghiệp giáo dục cộng đồng.<br><br>Xây dựng đội ngũ tình nguyện viên chuyên nghiệp, sẵn sàng hỗ trợ các dự án lớn trên khắp cả nước.<br><br>Mạng lưới không ngừng mở rộng quy mô và nâng cao hiệu quả hoạt động qua từng năm." }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post') || 'bai-1.md';
    const article = articlesDB[postId] || articlesDB['bai-1.md'];
    const randomImg = vietnameseImagePool[Math.floor(Math.random() * vietnameseImagePool.length)];

    document.getElementById('articleContent').innerHTML = `
      <div class="article-date"><i class="fa-regular fa-calendar"></i> ${article.date}</div>
      <h1 class="article-title">${article.title}</h1>
      <img src="${randomImg}" alt="${article.title}" class="article-thumb">
      <div class="article-body">
        <p>${article.content}</p>
      </div>
    `;
  </script>
