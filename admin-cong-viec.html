    const box = document.getElementById('cList'); if (!box) return;
    const list = comments[state.openId];
    box.innerHTML = !list ? '<div class="empty" style="padding:0.3rem 0">Đang tải…</div>' : list.length ? list.map(c => `<div class="comment"><span class="av">${esc(initials(c.by))}</span><div class="bubble"><div class="who"><b>${esc(c.by)}</b>${esc(rel(c.at))}</div><p>${mentionHtml(c.text)}</p></div></div>`).join('') : '<div class="empty" style="padding:0.3rem 0">Chưa có trao đổi nào.</div>';
  }
  function dueOptions(t) {
    const today = todayStr();
    const presets = [[today, 'Hôm nay'], [addDays(today, 1), 'Ngày mai'], [addDays(mondayOf(today), 7), 'Thứ Hai tới'], [addDays(today, 7), '+1 tuần']];
    const inPreset = presets.some(p => p[0] === t.dueDate);
    return `<div class="opts">${presets.map(([v, l]) => `<button class="opt" data-set="dueDate" data-v="${v}" aria-pressed="${t.dueDate === v}">${l}</button>`).join('')}
      <button class="opt" data-set="dueDate" data-v="" aria-pressed="${!t.dueDate}">Không hạn</button>
      <input type="date" class="opt-date" data-input="dueDate" value="${esc(inPreset ? '' : t.dueDate)}" aria-label="Chọn ngày khác">
      <input type="time" class="opt-date" data-input="dueTime" value="${esc(t.dueTime)}" aria-label="Giờ"></div>`;
  }
  function renderDrawer() {
    const t = findTask(state.openId); if (!t) return closeDrawer();
    const done = t.checklist.filter(i => i.done).length;
    $('drawer').innerHTML = `
      <div class="d-head">
        <button class="check ${t.status === 'done' ? 'on' : ''}" data-toggle="${esc(t.id)}" aria-label="${t.status === 'done' ? 'Mở lại' : 'Hoàn thành'}"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
        <textarea class="d-title" id="dTitle" rows="1" maxlength="200" aria-label="Tên công việc">${esc(t.title)}</textarea>
        <button class="d-close" data-act="close" aria-label="Đóng"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      </div>
      <div class="d-body">
        ${t.link && t.link.href ? `<a class="link-card" href="${esc(t.link.href)}"><i class="fa-solid fa-link" aria-hidden="true"></i><span>${esc(t.link.label || 'Mở nơi xử lý')}</span><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true" style="margin-left:auto;color:var(--muted)"></i></a>` : ''}
        <div class="props">
        <div class="row"><label><i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>Trạng thái</label><div class="opts">${STATUS.map(([k, l]) => `<button class="opt st-${k}" data-set="status" data-v="${k}" aria-pressed="${t.status === k}">${l}</button>`).join('')}</div></div>
        <div class="row"><label><i class="fa-solid fa-user-group" aria-hidden="true"></i>Người làm</label><div class="opts">${D.staff.map(s => `<button class="opt" data-assignee="${esc(s.email)}" aria-pressed="${t.assignees.includes(s.email)}"><span class="av" style="width:20px;height:20px;font-size:0.56rem;border:none">${esc(initials(s.name))}</span>${esc(s.email === D.me.email ? 'Tôi' : s.name)}</button>`).join('')}</div></div>
        <div class="row"><label><i class="fa-solid fa-calendar-day" aria-hidden="true"></i>Hạn chót</label>${dueOptions(t)}</div>
        <div class="row"><label><i class="fa-solid fa-flag" aria-hidden="true"></i>Ưu tiên</label><div class="opts">${PRIO.map(([k, l]) => `<button class="opt p-${k}" data-set="priority" data-v="${k}" aria-pressed="${t.priority === k}">${l}</button>`).join('')}</div></div>
        <div class="row"><label><i class="fa-solid fa-folder" aria-hidden="true"></i>Dự án</label><div class="opts">${D.projects.filter(p => !p.archived || p.id === t.projectId).map(p => `<button class="opt" data-set="projectId" data-v="${esc(p.id)}" aria-pressed="${t.projectId === p.id}"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}</button>`).join('')}<button class="opt" data-set="projectId" data-v="" aria-pressed="${!t.projectId}">Không</button><button class="opt" data-act="new-project" style="border-style:dashed;color:var(--muted)"><i class="fa-solid fa-plus" aria-hidden="true"></i> Dự án mới</button></div></div>
        <div class="row"><label><i class="fa-solid fa-tag" aria-hidden="true"></i>Nhãn</label><div class="opts">${(t.labels || []).map(l => `<button class="opt lbl-opt" data-label-rm="${esc(l)}" style="--h:${labelHue(l)}" aria-label="Bỏ nhãn ${esc(l)}">${esc(l)} <i class="fa-solid fa-xmark" aria-hidden="true"></i></button>`).join('')}${allLabels().filter(l => !(t.labels || []).includes(l)).slice(0, 6).map(l => `<button class="opt" data-label-add="${esc(l)}">+ ${esc(l)}</button>`).join('')}<input class="lbl-input" id="lblAdd" type="text" maxlength="30" placeholder="Nhãn mới…" aria-label="Thêm nhãn mới"></div></div>
        <div class="row"><label><i class="fa-solid fa-repeat" aria-hidden="true"></i>Lặp lại</label><div class="opts">${RECUR.map(([k, l]) => `<button class="opt" data-set="recurrence" data-v="${k}" aria-pressed="${t.recurrence === k}">${l}</button>`).join('')}</div></div>
        </div>

        <div class="d-section"><h5><i class="fa-solid fa-align-left" aria-hidden="true"></i>Mô tả</h5><textarea class="desc" id="dDesc" placeholder="Ghi chú, đường dẫn tài liệu, yêu cầu cụ thể…" maxlength="5000">${esc(t.description)}</textarea></div>

        <div class="d-section"><h5><i class="fa-solid fa-list-check" aria-hidden="true"></i>Các bước <span>${t.checklist.length ? done + '/' + t.checklist.length : ''}</span></h5>
          ${t.checklist.length ? `<div class="bar"><i style="width:${Math.round(done / t.checklist.length * 100)}%"></i></div>` : ''}
          ${t.checklist.map(i => `<div class="cl-item ${i.done ? 'done' : ''}"><button class="check ${i.done ? 'on' : ''}" data-cl-toggle="${esc(i.id)}" aria-label="${i.done ? 'Bỏ đánh dấu' : 'Xong bước này'}"><i class="fa-solid fa-check" aria-hidden="true"></i></button><span>${esc(i.text)}</span><button class="x" data-cl-del="${esc(i.id)}" aria-label="Xoá bước"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>`).join('')}
          <input class="cl-add" id="clAdd" placeholder="+ Thêm bước, nhấn Enter" maxlength="200"></div>

        <div class="d-section" id="attSection"><h5><i class="fa-solid fa-paperclip" aria-hidden="true"></i>Tệp đính kèm <span>${(t.attachments || []).length || ''}</span></h5>
          <div id="attList"></div>
          <label class="att-drop" id="attDrop"><input type="file" id="attInput" multiple hidden><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i><span>Kéo thả hoặc <u>chọn tệp</u> (ảnh, PDF, Word, Excel · tối đa 8MB/tệp)</span></label></div>

        <div class="d-section"><h5><i class="fa-solid fa-comments" aria-hidden="true"></i>Trao đổi</h5><div id="cList"></div>
          <form class="c-form" id="cForm"><label class="sr-only" for="cText">Viết bình luận</label><textarea id="cText" rows="1" placeholder="Viết trao đổi… gõ @ để nhắc tên (Enter để gửi)" maxlength="2000"></textarea><button class="btn primary" type="submit" aria-label="Gửi"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></form></div>

        <div class="d-section"><h5><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>Lịch sử</h5><ul class="hist">${t.history.slice().reverse().slice(0, 12).map(h => `<li><b>${esc(h.by)}</b> ${esc(h.text.charAt(0).toLowerCase() + h.text.slice(1))} · ${esc(rel(h.at))}</li>`).join('') || '<li>—</li>'}</ul></div>
      </div>
      <div class="d-foot"><span>Tạo bởi ${esc(t.createdByName || staffBy(t.createdBy).name)} · ${esc(rel(t.createdAt))}</span>${t.createdBy === D.me.email || D.me.role === 'super' ? `<button class="btn ghost danger" data-del="${esc(t.id)}"><i class="fa-regular fa-trash-can" aria-hidden="true"></i> Xoá</button>` : ''}</div>`;
    renderComments(); renderAttachments(); autosize($('dTitle'));
  }
  function autosize(el) { if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

  // ---------- Dự án ----------
  let editingProject = null, pickedColor = COLORS[0];
  function openProjectModal(id) {
    editingProject = id ? projectBy(id) : null;
    pickedColor = editingProject ? editingProject.color : COLORS[D.projects.length % COLORS.length];
    $('pmTitle').textContent = editingProject ? 'Sửa dự án' : 'Dự án mới';
    $('pmName').value = editingProject ? editingProject.name : '';
    $('pmSave').textContent = editingProject ? 'Lưu' : 'Tạo dự án';
    $('pmArchive').hidden = !editingProject;
    $('pmColors').innerHTML = COLORS.map(c => `<button style="background:${c}" data-color="${c}" aria-pressed="${c === pickedColor}" aria-label="Màu ${c}"></button>`).join('');
    $('projectModal').classList.add('open'); setTimeout(() => $('pmName').focus(), 30);
  }
  async function saveProject(archive) {
    const name = $('pmName').value.trim(); if (!name && !archive) { $('pmName').focus(); return; }
    const body = editingProject ? { id: editingProject.id, name, color: pickedColor } : { name, color: pickedColor };
    if (archive) body.archived = true;
    try {
      const r = await post('/api/portal-work-save-project', body);
      const i = D.projects.findIndex(p => p.id === r.project.id); if (i >= 0) D.projects[i] = r.project; else D.projects.push(r.project);
      $('projectModal').classList.remove('open');
      if (archive) { toast('Đã lưu trữ dự án'); setView('board', { project: '' }); }
      else if (!editingProject) { toast(`Đã tạo dự án "${r.project.name}"`); if (state.openId) update(state.openId, { projectId: r.project.id }); else setView('board', { project: r.project.id }); }
      else renderAll();
    } catch (e) { toast(e.message, { error: true }); }
  }

  // ---------- Sự kiện ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const tg = t.closest('[data-toggle]'); if (tg) { e.stopPropagation(); return toggleDone(tg.dataset.toggle); }
    const del = t.closest('[data-del]'); if (del) return deleteTask(del.dataset.del);
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'focus-quick') return focusQuick();
      if (a === 'close') return closeDrawer();
      if (a === 'new-project') return openProjectModal();
      if (a === 'close-modal') return $('projectModal').classList.remove('open');
    }
    const la = t.closest('[data-label-add]'); if (la && state.openId) { const tk = findTask(state.openId); return update(tk.id, { labels: Array.from(new Set((tk.labels || []).concat(la.dataset.labelAdd))).slice(0, 10) }); }
    const lr = t.closest('[data-label-rm]'); if (lr && state.openId) { const tk = findTask(state.openId); return update(tk.id, { labels: (tk.labels || []).filter(x => x !== lr.dataset.labelRm) }); }
    if (t.closest('#openSearch')) return openSearch();
    const arm = t.closest('[data-att-rm]'); if (arm) return removeAttachment(arm.dataset.attRm);
    const mn = t.closest('[data-mention]'); if (mn) return pickMention(mn);
    if (t.closest('#digestTest')) return (async () => { try { const r = await post('/api/work-daily-digest', {}); toast(`Đã gửi ${r.sent} email tổng hợp (bỏ qua ${r.skipped} người không có việc hoặc đã nhận hôm nay)`); } catch (e) { toast(e.message, { error: true }); } })();
    const tw = t.closest('[data-team-who]'); if (tw) return setView('board', { boardWho: tw.dataset.teamWho, project: '' });
    const set = t.closest('[data-set]'); if (set && state.openId) { const k = set.dataset.set; const v = set.dataset.v; return update(state.openId, { [k]: v }); }
    const asg = t.closest('[data-assignee]');
    if (asg && state.openId) { const tk = findTask(state.openId); const em = asg.dataset.assignee; const next = tk.assignees.includes(em) ? tk.assignees.filter(x => x !== em) : tk.assignees.concat(em); return update(state.openId, { assignees: next }); }
    const clt = t.closest('[data-cl-toggle]'); if (clt) { const tk = findTask(state.openId); return update(tk.id, { checklist: tk.checklist.map(i => i.id === clt.dataset.clToggle ? { ...i, done: !i.done } : i) }); }
    const cld = t.closest('[data-cl-del]'); if (cld) { const tk = findTask(state.openId); return update(tk.id, { checklist: tk.checklist.filter(i => i.id !== cld.dataset.clDel) }); }
    const sc = t.closest('[data-scope]'); if (sc) { state.scope = sc.dataset.scope; return renderAll(); }
    const wk = t.closest('[data-week]'); if (wk) { state.weekStart = +wk.dataset.week === 0 ? mondayOf(todayStr()) : addDays(state.weekStart, +wk.dataset.week); return renderCalendar(); }
    const ad = t.closest('[data-add-day]'); if (ad) return focusQuick({ dueDate: ad.dataset.addDay });
    const as = t.closest('[data-add-status]'); if (as) return focusQuick({ status: as.dataset.addStatus, projectId: state.project });
    const pj = t.closest('[data-project]'); if (pj) return setView('board', { project: pj.dataset.project });
    const ep = t.closest('[data-edit-project]'); if (ep) return openProjectModal(ep.dataset.editProject);
    const col = t.closest('[data-color]'); if (col) { pickedColor = col.dataset.color; document.querySelectorAll('#pmColors button').forEach(b => b.setAttribute('aria-pressed', b === col)); return; }
    const ai = t.closest('[data-assign-inbox]');
    if (ai) {
      const item = D.inbox.find(i => i.key === ai.dataset.assignInbox); if (!item) return;
      return focusQuick({ link: { type: item.key, id: item.key, label: item.title, href: item.href }, dueDate: todayStr() }, item.title.replace(/^\d+\s/, 'Xử lý ') + ' ');
    }
    const v = t.closest('[data-view]'); if (v) return setView(v.dataset.view, { project: '' });
    const op = t.closest('[data-open]'); if (op) return openDrawer(op.dataset.open);
  });
  $('scrim').addEventListener('click', closeDrawer);
  $('pmSave').addEventListener('click', () => saveProject(false));
  $('pmArchive').addEventListener('click', () => { if (confirm('Lưu trữ dự án này? Các công việc vẫn được giữ nguyên.')) saveProject(true); });
  $('projectModal').addEventListener('click', e => { if (e.target.id === 'projectModal') $('projectModal').classList.remove('open'); });
  $('pmName').addEventListener('keydown', e => { if (e.key === 'Enter') saveProject(false); });

  $('quickInput').addEventListener('input', renderParsed);
  $('quickInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); quickAdd(); } if (e.key === 'Escape') { e.target.value = ''; quickPreset = {}; renderParsed(); e.target.blur(); } });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.input && state.openId) update(state.openId, { [el.dataset.input]: el.value });
    if (el.id === 'fProj') { state.project = el.value; renderAll(); }
    if (el.id === 'fWho') { state.boardWho = el.value; renderAll(); }
  });
  document.addEventListener('focusout', e => {
    if (!state.openId) return;
    const t = findTask(state.openId); if (!t) return;
    if (e.target.id === 'dTitle') { const v = e.target.value.trim(); if (v && v !== t.title) update(t.id, { title: v }, { silentRender: true }); else if (!v) e.target.value = t.title; }
    if (e.target.id === 'dDesc') { const v = e.target.value; if (v !== t.description) update(t.id, { description: v }, { silentRender: true, msg: 'Đã lưu mô tả' }); }
  });
  document.addEventListener('input', e => { if (e.target.id === 'dTitle') autosize(e.target); });
  document.addEventListener('keydown', e => {
    const typing = e.target.matches('input, textarea, select');
    if (e.target.id === 'dTitle' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); return; }
    if (e.target.id === 'clAdd' && e.key === 'Enter') {
      e.preventDefault(); const v = e.target.value.trim(); if (!v) return; const tk = findTask(state.openId);
      update(tk.id, { checklist: tk.checklist.concat({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text: v, done: false }) });
      setTimeout(() => { const n = $('clAdd'); if (n) n.focus(); }, 60); return;
    }
    if (e.target.id === 'lblAdd' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim().slice(0, 30); if (!v) return; const tk = findTask(state.openId); update(tk.id, { labels: Array.from(new Set((tk.labels || []).concat(v))).slice(0, 10) }); setTimeout(() => { const n = $('lblAdd'); if (n) n.focus(); }, 60); return; }
    if (e.target.id === 'cText' && $('mentionMenu') && ['ArrowDown', 'ArrowUp', 'Enter', 'Tab', 'Escape'].includes(e.key)) {
      const items = [...$('mentionMenu').querySelectorAll('button')]; let i = items.findIndex(b => b.classList.contains('on'));
      if (e.key === 'Escape') { $('mentionMenu').remove(); e.preventDefault(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pickMention(items[Math.max(0, i)]); }
      e.preventDefault(); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items.forEach((b, k) => b.classList.toggle('on', k === i)); return;
    }
    if (e.target.id === 'cText' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('cForm').requestSubmit(); return; }
    if (e.key === 'Escape') { if ($('projectModal').classList.contains('open')) return $('projectModal').classList.remove('open'); if (state.openId) return closeDrawer(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openSearch(); }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); return openSearch(); }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); focusQuick(); }
    const views = { '1': 'today', '2': 'inbox', '3': 'mine', '4': 'board', '5': 'calendar' }; if (views[e.key]) setView(views[e.key], { project: '' });
    if (e.key === 'Enter' && e.target.matches('.task[data-open]')) openDrawer(e.target.dataset.open);
  });
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'cForm') return; e.preventDefault();
    const ta = $('cText'); const text = ta.value.trim(); const id = state.openId; if (!text || !id) return;
    ta.value = ''; const temp = { id: 'tmp', text, by: D.me.name || D.me.email, at: new Date().toISOString() };
    comments[id] = (comments[id] || []).concat(temp); renderComments();
    const mentions = [...mentionPicked].filter(em => { const p = D.staff.find(x => x.email === em); return p && text.includes('@' + p.name); }); mentionPicked.clear();
    try { const r = await post('/api/portal-work-comment', { taskId: id, text, mentions }); comments[id] = comments[id].map(c => c === temp ? r.comment : c); const t = findTask(id); if (t) t.commentCount = r.commentCount; renderComments(); renderSide(); if (r.mentioned && r.mentioned.length) toast('Đã báo email cho ' + r.mentioned.join(', ')); }
    catch (err) { comments[id] = comments[id].filter(c => c !== temp); renderComments(); ta.value = text; toast(err.message, { error: true }); }
  });
  window.addEventListener('scroll', () => $('topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

  // Kéo thả: đổi trạng thái (bảng) hoặc đổi ngày (lịch)
  let dragId = null;
  document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card[data-id]'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  document.addEventListener('dragend', e => { document.querySelectorAll('.dragging,.drop').forEach(x => x.classList.remove('dragging', 'drop')); });
  document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-col],[data-day]'); if (!z || !dragId) return; e.preventDefault(); document.querySelectorAll('.drop').forEach(x => x !== z && x.classList.remove('drop')); z.classList.add('drop'); });
  document.addEventListener('drop', e => {
    const z = e.target.closest && e.target.closest('[data-col],[data-day]'); if (!z || !dragId) return; e.preventDefault();
    const id = dragId; dragId = null; const t = findTask(id); if (!t) return;
    if (z.dataset.col && z.dataset.col !== t.status) update(id, { status: z.dataset.col }, { msg: `Đã chuyển sang "${STATUS_L[z.dataset.col]}"` });
    if (z.dataset.day && z.dataset.day !== t.dueDate) update(id, { dueDate: z.dataset.day }, { msg: `Đã dời sang ${fmtDue(z.dataset.day)}` });
  });

  // ---------- Khởi động ----------
  async function load() {
    try {
      const r = await api('/api/portal-work-data');
      D = { me: r.me, tasks: r.tasks, projects: r.projects, staff: r.staff.length ? r.staff : [{ email: r.me.email, name: r.me.name }], inbox: r.inbox };
      $('loading').remove();
      const h = location.hash.slice(1); const [viewPart, taskPart] = h.split('&task=');
      const [v, pid] = (viewPart || 'today').split('=');
      setView(['today', 'inbox', 'mine', 'board', 'calendar', 'team'].includes(v) ? v : 'today', { project: pid || '' });
      if (taskPart) openDrawer(taskPart);
    } catch (e) {
      $('loading').innerHTML = `<div style="color:var(--red)">${esc(e.message)}</div><button class="btn" style="margin-top:1rem" onclick="location.reload()">Tải lại</button>`;
    }
  }
  // Tự làm mới khi quay lại tab (để thấy việc đồng nghiệp vừa giao, và hộp việc hệ thống mới nhất)
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !D.me.email) return;
    try { const r = await api('/api/portal-work-data'); D.tasks = r.tasks; D.projects = r.projects; D.inbox = r.inbox; D.staff = r.staff.length ? r.staff : D.staff; renderAll(); } catch (e) {}
  });
  load();
})();
</script>
<script src="/admin-alerts.js?v=20260930c" defer data-mobile-bottom="calc(4.6rem + 66px)"></script>
</body>
