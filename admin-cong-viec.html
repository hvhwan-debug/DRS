/* Danh sách việc: mỗi dòng là 1 thẻ RIÊNG có khoảng cách, không còn dính liền thành 1 khối —
   nhờ vậy tô màu theo trạng thái (bên dưới) chỉ làm rõ từng thẻ chứ không nhoè vào nhau. */
.tasks { background: transparent; border: none; border-radius: 0; overflow: visible; box-shadow: none; display: flex; flex-direction: column; gap: 0.5rem; }
/* Dạng bảng, cột thẳng hàng giữa các dòng (kiểu Monday): chọn | tick | nội dung | Hạn | Ưu tiên | người phụ trách */
.task { display: grid; grid-template-columns: 24px 24px minmax(0,1fr) 128px 128px auto; align-items: center; column-gap: 1rem; padding: 0.85rem 1.3rem; border: 1px solid var(--hair); border-radius: 14px; cursor: pointer; position: relative; transition: background .12s, box-shadow .15s; background: var(--surface); box-shadow: 0 1px 0 rgba(12,19,48,0.03); }

@media (max-width: 900px) {
  /* Màn hẹp: bỏ bố cục cột cứng — tiêu đề chiếm hết dòng đầu (flex:1), Hạn/Ưu tiên/người phụ trách

}
.task:hover { box-shadow: 0 6px 16px -8px rgba(12,19,48,0.25); }

.check:hover { border-color: var(--green); background: var(--green-soft); }

    <div class="acts"><span style="flex:1"></span><button class="btn" data-act="close-modal">Huỷ</button><button class="btn primary" id="tmApply">Tạo dự án từ mẫu</button></div>

<script>
(function () {
  'use strict';
  const token = localStorage.getItem('wvn_admin_token');
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
  const DAY = 864e5;
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => ymd(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
  const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const WDs = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const fmtDue = (d, t) => {
    if (!d) return '';
    const n = Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / DAY);
    let s = n === 0 ? 'Hôm nay' : n === 1 ? 'Ngày mai' : n === -1 ? 'Hôm qua' : (n > 1 && n < 7) ? WD[new Date(d + 'T00:00:00').getDay()] : d.slice(8) + '/' + d.slice(5, 7);
    return t ? `${s} ${t}` : s;
  };
  const initials = n => { const p = String(n || '?').trim().split(/\s+/); return ((p.length > 1 ? p[p.length - 2][0] : '') + p[p.length - 1][0]).toUpperCase(); };
  function gcalUrl(t) {
    const d = t.dueDate.replace(/-/g, '');
    const start = t.dueTime ? `${d}T${t.dueTime.replace(':', '')}00` : d;
    const end = t.dueTime ? (() => { const [h, m] = t.dueTime.split(':').map(Number); const e = new Date(); e.setHours(h + 1, m, 0, 0); return `${d}T${pad(e.getHours())}${pad(e.getMinutes())}00`; })() : addDays(t.dueDate, 1).replace(/-/g, '');
    const dates = t.dueTime ? `${start}/${end}` : `${start}/${end}`;
    const params = new URLSearchParams({ action: 'TEMPLATE', text: t.title, dates, details: t.description || '' });
    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }
  const rel = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 1) return 'vừa xong'; if (m < 60) return m + ' phút trước'; const h = Math.round(m / 60); if (h < 24) return h + ' giờ trước'; const d = Math.round(h / 24); return d < 30 ? d + ' ngày trước' : new Date(iso).toLocaleDateString('vi-VN'); };

  const STATUS = [['todo', 'Cần làm'], ['doing', 'Đang làm'], ['review', 'Chờ duyệt'], ['done', 'Hoàn thành']];
  const STATUS_L = Object.fromEntries(STATUS);
  const PRIO = [['low', 'Thấp'], ['normal', 'Bình thường'], ['high', 'Cao'], ['urgent', 'Khẩn']];
  const PRIO_COLOR = { urgent: 'var(--red)', high: 'var(--gold)', normal: 'transparent', low: 'transparent' };
  const RECUR = [['', 'Không lặp'], ['daily', 'Mỗi ngày'], ['weekdays', 'Ngày làm việc'], ['weekly', 'Mỗi tuần'], ['monthly', 'Mỗi tháng']];
  const COLORS = ['#2563eb', '#0891b2', '#059669', '#ca8a04', '#dc2626', '#db2777', '#7c3aed', '#475569'];
  const TONE = { blue: 'var(--sapphire)', green: 'var(--green)', gold: 'var(--gold)', red: 'var(--red)', violet: 'var(--violet)' };

  let D = { me: {}, tasks: [], projects: [], staff: [], inbox: [] };
  let state = { view: 'today', project: '', scope: 'me', boardWho: '', weekStart: null, openId: null, selected: new Set() };

  // ---------- API ----------
  async function api(path, opts = {}, attempt = 0) {
    const get = !opts.method || opts.method === 'GET';
    let res;
    try { res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token } }); }
    catch (e) { if (get && attempt < 2) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, opts, attempt + 1); } throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { localStorage.removeItem('wvn_admin_token'); location.replace('admin-dang-nhap.html'); throw new Error('Phiên đăng nhập đã hết hạn.'); }
    if (res.status >= 500 && get && attempt < 2 && (!data.message || data.retryable)) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, opts, attempt + 1); }
    if (!res.ok || !data.success) throw new Error(data.message || `Máy chủ chưa phản hồi được (mã ${res.status}).`);
    return data;
  }
  const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });

  function toast(msg, opts) {
    opts = opts || {};
    const t = $('toast'); $('toastMsg').textContent = msg; t.className = 'toast show' + (opts.error ? ' error' : '');
    const u = $('toastUndo'); u.hidden = !opts.undo; u.onclick = () => { t.className = 'toast'; opts.undo(); };
    clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', opts.error ? 6000 : opts.undo ? 5000 : 2600);
  }

  // ---------- Truy vấn ----------
  const staffBy = email => D.staff.find(s => s.email === email) || { email, name: email ? email.split('@')[0] : '?' };
  const projectBy = id => D.projects.find(p => p.id === id);
  const isMine = t => t.assignees.includes(D.me.email);
  const findTask = id => D.tasks.find(t => t.id === id);
  const open = t => t.status !== 'done';
  const byDue = (a, b) => (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || (a.dueTime || '99').localeCompare(b.dueTime || '99') || prioRank(b) - prioRank(a);
  const prioRank = t => ({ urgent: 3, high: 2, normal: 1, low: 0 })[t.priority] || 1;

  // ---------- Dòng việc ----------
  const labelHue = l => { let h = 0; for (const c of String(l)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const allLabels = () => Array.from(new Set(D.tasks.flatMap(t => t.labels || []))).sort((a, b) => a.localeCompare(b, 'vi'));
  function metaHtml(t) {
    // Thông tin PHỤ đi dưới tiêu đề (dự án, checklist, đính kèm, bình luận, nhãn, lặp lại, liên kết,
    // đang bị chặn). Hạn chót và Ưu tiên KHÔNG còn ở đây — đã tách thành 2 cột riêng, thẳng hàng
    // giữa các dòng (xem cột Hạn/Ưu tiên trong taskRow) để dễ quét mắt theo hàng dọc kiểu bảng.
    const bits = [];
    const p = projectBy(t.projectId); if (p) bits.push(`<span class="m"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}</span>`);
    if (t.checklist.length) { const d = t.checklist.filter(i => i.done).length; bits.push(`<span class="m"><i class="fa-regular fa-square-check" aria-hidden="true"></i>${d}/${t.checklist.length}</span>`); }
    if ((t.attachments || []).length) bits.push(`<span class="m"><i class="fa-solid fa-paperclip" aria-hidden="true"></i>${t.attachments.length}</span>`);
    if (t.commentCount) bits.push(`<span class="m"><i class="fa-regular fa-comment" aria-hidden="true"></i>${t.commentCount}</span>`);
    (t.labels || []).slice(0, 3).forEach(l => bits.push(`<span class="lbl" style="--h:${labelHue(l)}">${esc(l)}</span>`));
    if (t.recurrence) bits.push('<span class="m"><i class="fa-solid fa-repeat" aria-hidden="true"></i></span>');
    if (t.link) bits.push('<span class="m" style="color:var(--gold)"><i class="fa-solid fa-link" aria-hidden="true"></i></span>');
    const blocker = t.blockedBy && findTask(t.blockedBy);
    if (blocker && blocker.status !== 'done') bits.push(`<span class="pill blocked"><i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>Chờ: ${esc(blocker.title.slice(0, 30))}</span>`);
    return bits.join('');
  }
  // Cột "Hạn chót" riêng — luôn hiện, kể cả khi chưa đặt hạn (hiện "—") để các dòng thẳng hàng nhau.
  function dueColHtml(t) {
    const today = todayStr();
    if (!t.dueDate) return `<span class="col-due muted">—</span>`;
    const cls = t.status !== 'done' && t.dueDate < today ? 'red' : t.dueDate === today ? 'blue' : '';
    return `<span class="col-due pill ${cls}"><i class="fa-regular fa-calendar" aria-hidden="true"></i>${esc(fmtDue(t.dueDate, t.dueTime))}</span>`;
  }
  // Cột "Ưu tiên" riêng — luôn hiện cả 4 mức (kể cả Bình thường/Thấp) để bảng đều cột như Monday.
  const PRIO_COL = {
    urgent: { label: 'Khẩn', cls: 'red', icon: 'fa-bolt' },
    high: { label: 'Cao', cls: 'gold', icon: 'fa-star' },
    normal: { label: 'Bình thường', cls: '', icon: 'fa-minus' },
    low: { label: 'Thấp', cls: '', icon: 'fa-arrow-down' }
  };
  function prioColHtml(t) {
    const c = PRIO_COL[t.priority] || PRIO_COL.normal;
    return `<span class="col-prio pill ${c.cls}"><i class="fa-solid ${c.icon}" aria-hidden="true"></i>${c.label}</span>`;
  }
  const AV_TONES = [['#eaf0ff', '#1f4fd6'], ['#e6f4ec', '#1f7a4d'], ['#f6efe3', '#8a6a37'], ['#efebfb', '#6246c9'], ['#fdeceb', '#c2352b'], ['#e3f4f7', '#0e7490'], ['#fdf3e2', '#b7791f']];
  const avTone = e => { let h = 0; for (const c of String(e || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; const t = AV_TONES[h % AV_TONES.length]; return `background:${t[0]};color:${t[1]}`; };
  const avatars = list => `<span class="avs">${list.slice(0, 3).map(e => `<span class="av" style="${avTone(e)}" title="${esc(staffBy(e).name)}">${esc(initials(staffBy(e).name))}</span>`).join('')}${list.length > 3 ? `<span class="av">+${list.length - 3}</span>` : ''}</span>`;
  const taskRow = t => `<div class="task ${t.status === 'done' ? 'done' : ''} prio-${t.priority}" data-open="${esc(t.id)}" tabindex="0">
      <button class="sel-box ${state.selected.has(t.id) ? 'on' : ''}" data-select="${esc(t.id)}" aria-label="Chọn việc này"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
      <button class="check" data-toggle="${esc(t.id)}" aria-label="${t.status === 'done' ? 'Đánh dấu chưa xong' : 'Hoàn thành'}"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
      <div class="t-body"><div class="t-title">${esc(t.title)}</div><div class="t-meta">${metaHtml(t)}${t.status === 'doing' ? '<span class="pill blue">Đang làm</span>' : t.status === 'review' ? '<span class="pill" style="background:var(--violet-soft);color:var(--violet);border-color:transparent">Chờ duyệt</span>' : ''}</div></div>
      <div class="t-col-due">${dueColHtml(t)}</div>
      <div class="t-col-prio">${prioColHtml(t)}</div>
      <div class="t-right">${avatars(t.assignees)}</div></div>`;
  const list = (items, emptyMsg) => items.length ? `<div class="tasks">${items.map(taskRow).join('')}</div>` : `<div class="empty">${emptyMsg}</div>`;

  // ---------- Hôm nay ----------
  function renderToday() {
    const today = todayStr();
    const pool = D.tasks.filter(t => state.scope === 'me' ? isMine(t) : true);
    const overdue = pool.filter(t => open(t) && t.dueDate && t.dueDate < today).sort(byDue);
    const todays = pool.filter(t => t.dueDate === today).sort((a, b) => (a.status === 'done') - (b.status === 'done') || byDue(a, b));
    const upcoming = pool.filter(t => open(t) && t.dueDate > today && t.dueDate <= addDays(today, 7)).sort(byDue);
    const noDate = pool.filter(t => open(t) && !t.dueDate && t.status === 'doing').sort(byDue);
    const doneToday = pool.filter(t => t.status === 'done' && t.completedAt && ymd(new Date(t.completedAt)) === today).length;
    const totalToday = todays.filter(open).length + overdue.length + doneToday;
    const pct = totalToday ? Math.round(doneToday / totalToday * 100) : 0;
    const d = new Date(); const h = d.getHours();
    const greet = h < 11 ? 'Chào buổi sáng' : h < 14 ? 'Chào buổi trưa' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối';
    const first = (D.me.name || '').trim().split(/\s+/).pop();
    const C = 2 * Math.PI * 50;
    const remain = todays.filter(open).length + overdue.length;
    const doingN = pool.filter(t => t.status === 'doing').length;
    const inboxN = D.inbox.reduce((s, i) => s + i.count, 0);
    const stat = (n, label, cls, ic) => `<div class="stat ${cls}"><i class="${ic}" aria-hidden="true"></i><b>${n}</b><span>${label}</span></div>`;
    $('view-today').innerHTML = `
      <div class="hero">
        <div>
          <div class="eyebrow">${greet}${first ? ', ' + esc(first) : ''}</div>
          <h1>${WD[d.getDay()]}, <em>${d.getDate()} tháng ${d.getMonth() + 1}</em></h1>
          <p>${remain ? `Còn ${remain} việc cho hôm nay${overdue.length ? `, trong đó ${overdue.length} việc đã quá hạn` : ''}.` : doneToday ? 'Đã xong hết việc hôm nay. Làm tốt lắm!' : 'Chưa có việc nào hạn hôm nay.'}${D.inbox.length ? ` Hệ thống có ${D.inbox.reduce((s, i) => s + i.count, 0)} đầu việc đang chờ.` : ''}</p>
          ${window.WVNQuote ? WVNQuote.html('team', 'on-dark') : ''}
          <div class="stats">${stat(overdue.length, 'Quá hạn', overdue.length ? 'red' : '', 'fa-solid fa-triangle-exclamation')}${stat(todays.filter(open).length, 'Hạn hôm nay', 'gold', 'fa-regular fa-calendar')}${stat(doingN, 'Đang làm', 'blue', 'fa-solid fa-person-running')}${stat(inboxN, 'Từ hệ thống', 'violet', 'fa-solid fa-inbox')}</div>
        </div>
        <div class="ring" role="img" aria-label="Đã xong ${doneToday} trên ${totalToday} việc hôm nay">
          <svg width="116" height="116" viewBox="0 0 116 116"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#38bdf8"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><circle cx="58" cy="58" r="50" fill="none" stroke="var(--line-2)" stroke-width="5"/><circle cx="58" cy="58" r="50" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg>
          <div class="lbl"><div><b>${doneToday}/${totalToday || 0}</b><span>đã xong</span></div></div>
        </div>
      </div>
      ${D.inbox.length ? `<div class="section-title" style="margin-top:0.4rem"><h3>Việc từ hệ thống</h3><span class="sub">tự cập nhật từ dữ liệu vận hành</span></div><div class="inbox-strip">${D.inbox.map(inboxCard).join('')}</div>` : ''}
      ${overdue.length ? `<div class="section-title red"><h3>Quá hạn</h3><span>${overdue.length}</span><div class="scope list-scope" role="group" aria-label="Phạm vi"><button data-scope="me" aria-pressed="${state.scope === 'me'}">Của tôi</button><button data-scope="all" aria-pressed="${state.scope === 'all'}">Cả nhóm</button></div></div>${list(overdue)}` : ''}
      <div class="section-title"><h3>Hôm nay</h3><span>${todays.length || ''}</span>${overdue.length ? '' : `<div class="scope list-scope" role="group" aria-label="Phạm vi"><button data-scope="me" aria-pressed="${state.scope === 'me'}">Của tôi</button><button data-scope="all" aria-pressed="${state.scope === 'all'}">Cả nhóm</button></div>`}</div>
      ${list(todays, '<b>Không có việc hạn hôm nay.</b>Gõ vào ô phía trên, ví dụ "Chuẩn bị tài liệu lớp chiều nay".')}
      ${noDate.length ? `<div class="section-title"><h3>Đang làm</h3><span>${noDate.length}</span></div>${list(noDate)}` : ''}
      ${upcoming.length ? `<div class="section-title"><h3>7 ngày tới</h3><span>${upcoming.length}</span></div>${list(upcoming)}` : ''}`;
  }
  const inboxCard = i => `<div class="ibox" style="--tone:${TONE[i.tone] || 'var(--sapphire)'}"><b>${esc(i.title)}</b><small>${esc(i.hint || '')}</small>
      <div class="acts"><a href="${esc(i.href)}">Mở xử lý</a><button data-assign-inbox="${esc(i.key)}">Giao việc</button></div></div>`;

  function renderInbox() {
    $('view-inbox').innerHTML = `<div class="toolbar"><div class="pt"><h2 class="page-title">Việc từ hệ thống</h2><p class="pt-sub">Các đầu việc tự sinh từ dữ liệu vận hành: chấm công chờ duyệt, tài khoản chờ duyệt, đơn đăng ký, biên lai, đổi quà, học phí bị báo sai và lịch gọi phụ huynh. Chạm "Giao việc" để tạo một công việc có sẵn đường dẫn xử lý.</p></div>${D.inbox.length ? `<div class="pt-num"><b>${D.inbox.reduce((s, i) => s + i.count, 0)}</b><span>đầu việc chờ</span></div>` : ''}</div>
      ${D.inbox.length ? `<div class="inbox-strip">${D.inbox.map(inboxCard).join('')}</div>` : '<div class="empty"><b>Không có gì tồn đọng.</b>Mọi đơn, biên lai và yêu cầu đều đã được xử lý.</div>'}

  // ---------- Tìm việc (phím / hoặc Ctrl/⌘ + K) ----------
  const normVN = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  function openSearch() {
    if ($('searchOverlay')) return $('searchInput').focus();
    const el = document.createElement('div'); el.id = 'searchOverlay'; el.className = 'sp-overlay';
    el.innerHTML = `<div class="sp-box" role="dialog" aria-modal="true" aria-label="Tìm công việc"><div class="sp-in"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="searchInput" type="search" placeholder="Tìm theo tên việc, mô tả, nhãn, dự án, người làm…" autocomplete="off"><kbd>Esc</kbd></div><div class="sp-res" id="searchRes" role="listbox"></div></div>`;
    document.body.appendChild(el);
    let sel = 0;
    const run = () => {
      const q = normVN($('searchInput').value.trim()).split(/\s+/).filter(Boolean);
      const staffName = e => { const p = D.staff.find(x => String(x.email).toLowerCase() === String(e).toLowerCase()); return p ? p.name : e; };
      const hay = t => normVN([t.title, t.description, (t.labels || []).join(' '), (projectBy(t.projectId) || {}).name, (t.assignees || []).map(staffName).join(' '), (t.checklist || []).map(i => i.text).join(' ')].join(' '));
      const list = (q.length ? D.tasks.filter(t => q.every(w => hay(t).includes(w))) : D.tasks.filter(open).sort(byDue)).sort((a, b) => (a.status === 'done') - (b.status === 'done')).slice(0, 30);
      sel = Math.min(sel, Math.max(0, list.length - 1));
      $('searchRes').innerHTML = list.length ? list.map((t, i) => `<button type="button" class="sp-item${i === sel ? ' on' : ''}${t.status === 'done' ? ' done' : ''}" data-sp="${esc(t.id)}" role="option" aria-selected="${i === sel}"><strong>${esc(t.title)}</strong><span class="t-meta">${metaHtml(t)}${t.status === 'done' ? '<span class="pill">Đã xong</span>' : ''}</span></button>`).join('')
        : '<div class="empty" style="margin:0.6rem">Không tìm thấy việc nào khớp.</div>';
    };
    const close = () => el.remove();
    el.addEventListener('click', e => { const it = e.target.closest('[data-sp]'); if (it) { close(); return openDrawer(it.dataset.sp); } if (e.target === el) close(); });
    el.addEventListener('keydown', e => {
      const items = el.querySelectorAll('[data-sp]');
      if (e.key === 'Escape') { e.stopPropagation(); return close(); }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length); run(); const on = el.querySelector('.sp-item.on'); if (on) on.scrollIntoView({ block: 'nearest' }); }
      if (e.key === 'Enter' && items[sel]) { e.preventDefault(); const id = items[sel].dataset.sp; close(); openDrawer(id); }
    });
    $('searchInput').addEventListener('input', () => { sel = 0; run(); });
    run(); setTimeout(() => $('searchInput').focus(), 20);

  // ---------- Thêm việc nhanh: hiểu câu tiếng Việt ----------
  function parseQuick(text) {
    let s = (' ' + text + ' ').normalize('NFC');
    const out = { title: '', dueDate: '', dueTime: '', assignees: [], projectId: '', priority: '', recurrence: '' };
    const n = norm(s);
    const cut = (re) => { const m = norm(s).match(re); if (!m) return null; const i = m.index; s = s.slice(0, i) + ' ' + s.slice(i + m[0].length); return m; };
    const today = todayStr();
    // lặp lại
    let m;
    if ((m = cut(/\s(moi|hang) ngay lam viec(?=\s)/))) out.recurrence = 'weekdays';
    else if ((m = cut(/\s(moi|hang) (ngay)(?=\s)/))) out.recurrence = 'daily';
    else if ((m = cut(/\s(moi|hang) tuan(?=\s)/))) out.recurrence = 'weekly';
    else if ((m = cut(/\s(moi|hang) thang(?=\s)/))) out.recurrence = 'monthly';
    // ngày
    if ((m = cut(/\s(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?(?=\s)/))) {
      const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : String(new Date().getFullYear());
      let d = `${y}-${pad(+m[2])}-${pad(+m[1])}`; if (!m[3] && d < today) d = `${+y + 1}-${pad(+m[2])}-${pad(+m[1])}`; out.dueDate = d;
    } else if (cut(/\s(hom nay|toi nay|chieu nay|sang nay|nay)(?=\s)/)) out.dueDate = today;
    else if (cut(/\s(ngay mai|mai)(?=\s)/)) out.dueDate = addDays(today, 1);
    else if (cut(/\s(ngay kia|mot)(?=\s)/)) out.dueDate = addDays(today, 2);
    else if (cut(/\stuan sau(?=\s)/)) out.dueDate = addDays(mondayOf(today), 7);
    else if ((m = cut(/\s(?:thu\s?([2-7])|t([2-7])|(chu nhat|cn))(?=\s)/))) {
      const target = m[3] ? 0 : (+(m[1] || m[2]) - 1); const cur = new Date(today + 'T00:00:00').getDay();
      let diff = (target - cur + 7) % 7; if (diff === 0) diff = 7; out.dueDate = addDays(today, diff);
    }
    // giờ
    if ((m = cut(/\s(\d{1,2})(?:h|:|g)(\d{2})?(?:\s?(sang|chieu|toi))?(?=\s)/))) {

      s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length);
      if (who && !out.assignees.includes(who.email)) out.assignees.push(who.email);

      }

    if (patch.status === 'done' && before.status !== 'done') t.completedAt = new Date().toISOString();
    if (!(opts && opts.silentRender)) renderAll();
    try {
      const r = await post('/api/portal-work-save-task', { id, ...patch });

      if (r.spawned) { D.tasks.unshift(r.spawned); toast(`Đã xong. Lần tiếp theo: ${fmtDue(r.spawned.dueDate)}`); }
      else if (opts && opts.msg) toast(opts.msg, opts.undo ? { undo: () => update(id, opts.undo) } : undefined);

  }

  }
  function setPushButton(on) {
    $('pushToggleLabel').textContent = on ? 'Đã bật thông báo đẩy' : 'Bật thông báo đẩy';
    $('pushToggle').classList.toggle('on-state', on);
    $('pushToggle').dataset.on = on ? '1' : '0';
  }
  async function togglePush() {
    if (!pushSupported()) { toast('Trình duyệt này không hỗ trợ thông báo đẩy.', { error: true }); return; }
    const isOn = $('pushToggle').dataset.on === '1';
    try {
      const reg = await navigator.serviceWorker.register('/push-sw.js');
      if (isOn) {
        const sub = await reg.pushManager.getSubscription();
        if (sub) { await post('/api/portal-push-subscribe', { subscription: sub.toJSON(), action: 'unsubscribe' }); await sub.unsubscribe(); }
        setPushButton(false); toast('Đã tắt thông báo đẩy trên thiết bị này.');
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('Bạn chưa cho phép nhận thông báo trên trình duyệt.', { error: true }); return; }
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      await post('/api/portal-push-subscribe', { subscription: sub.toJSON(), action: 'subscribe' });
      setPushButton(true); toast('Đã bật thông báo đẩy — bạn sẽ nhận thông báo khi có việc mới, được nhắc tên, hoặc tổng hợp mỗi sáng.');
    } catch (e) { toast('Không bật được thông báo: ' + e.message, { error: true }); }
  }
  $('pushToggle').addEventListener('click', togglePush);

  // Tự làm mới khi quay lại tab (để thấy việc đồng nghiệp vừa giao, và hộp việc hệ thống mới nhất)
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !D.me.email) return;
    try { const r = await api('/api/portal-work-data'); D.tasks = r.tasks; D.projects = r.projects; D.inbox = r.inbox; D.staff = r.staff.length ? r.staff : D.staff; renderAll(); } catch (e) {}
  });
  load();
})();
</script>
