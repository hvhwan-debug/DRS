<style>
:root {
  --night: #111a33; --night-2: #1a2548; --night-3: #26335e; --night-text: #c9d2ea; --night-muted: #8390b5;
  --porcelain: #f4f5f8; --surface: #ffffff; --line: #e4e7ef; --line-2: #eef0f5;
  --ink: #121829; --ink-2: #3a4257; --muted: #6b7386;
  --sapphire: #1f4fd6; --sapphire-2: #1a43b8; --sapphire-soft: #eaf0ff;
  --gold: #b08d57; --gold-soft: #f6efe3; --gold-line: #e3d2b5;
  --red: #c2352b; --red-soft: #fdeceb; --amber: #b7791f; --amber-soft: #fdf3e2; --green: #1f7a4d; --green-soft: #e6f4ec;
  --violet: #6246c9; --violet-soft: #efebfb;
  --r-s: 6px; --r-m: 10px; --r-l: 14px;
  --serif: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --sans: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --shadow: 0 1px 2px rgba(17,26,51,0.05), 0 8px 24px rgba(17,26,51,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--porcelain); color: var(--ink); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--sapphire); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Khung ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.side { background: var(--night); color: var(--night-text); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 1.1rem 0.8rem; overflow-y: auto; }
.add-btn { display: flex; align-items: center; gap: 0.6rem; width: 100%; padding: 0.65rem 0.8rem; border-radius: var(--r-m); background: var(--sapphire); color: #fff; font-weight: 600; margin-bottom: 1rem; }
.add-btn:hover { background: var(--sapphire-2); }
.add-btn kbd { margin-left: auto; font-family: var(--sans); font-size: 0.72rem; background: rgba(255,255,255,0.18); border-radius: 4px; padding: 0.05rem 0.4rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button, .nav a { display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.55rem 0.7rem; border-radius: 8px; color: var(--night-text); text-align: left; text-decoration: none; font-weight: 500; font-size: 0.92rem; }
.nav button:hover, .nav a:hover { background: var(--night-2); color: #fff; }
.nav button[aria-current="page"] { background: var(--night-3); color: #fff; }
.nav i { width: 1.1rem; text-align: center; color: var(--night-muted); font-size: 0.9rem; }
.nav button[aria-current="page"] i { color: #fff; }
.nav .n { margin-left: auto; font-size: 0.75rem; color: var(--night-muted); font-weight: 600; }
.nav .n.hot { color: #f3d9a8; }
.side h4 { font-size: 0.72rem; font-weight: 600; color: var(--night-muted); margin: 1.3rem 0.7rem 0.4rem; display: flex; align-items: center; justify-content: space-between; letter-spacing: 0.3px; }
.side h4 button { color: var(--night-muted); font-size: 0.8rem; padding: 0.1rem 0.3rem; border-radius: 4px; }
.side h4 button:hover { color: #fff; background: var(--night-2); }
.dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; display: inline-block; }
.side-foot { margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--night-2); }
.me { display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.7rem 0; font-size: 0.84rem; }
.me .av { background: var(--gold); color: #fff; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(244,245,248,0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 0.9rem 2rem 0.8rem; border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.quick { position: relative; max-width: 860px; }
.quick input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.75rem 1rem 0.75rem 2.6rem; font-size: 0.95rem; box-shadow: var(--shadow); }
.quick input:focus { outline: none; border-color: var(--sapphire); box-shadow: 0 0 0 4px rgba(31,79,214,0.12), var(--shadow); }
.quick > i { position: absolute; left: 1rem; top: 1.02rem; color: var(--sapphire); }
.quick .parsed { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.5rem; min-height: 0; }
.quick .hint { font-size: 0.78rem; color: var(--muted); margin-top: 0.45rem; }
.quick .hint code { font-family: var(--sans); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 0.3rem; color: var(--ink-2); }
.content { padding: 1.4rem 2rem 5rem; max-width: 1280px; width: 100%; }
.view { display: none; }
.view.active { display: block; }

/* ---------- Thành phần ---------- */
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 0.66rem; font-weight: 700; background: var(--sapphire-soft); color: var(--sapphire); border: 2px solid var(--surface); flex-shrink: 0; }
.avs { display: inline-flex; }
.avs .av + .av { margin-left: -7px; }
.pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.74rem; font-weight: 600; padding: 0.12rem 0.5rem; border-radius: 999px; background: var(--porcelain); color: var(--ink-2); white-space: nowrap; border: 1px solid var(--line-2); }
.pill.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.pill.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.pill.blue { background: var(--sapphire-soft); color: var(--sapphire); border-color: transparent; }
.pill.gold { background: var(--gold-soft); color: #8a6a37; border-color: var(--gold-line); }
.pill.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.btn { display: inline-flex; align-items: center; gap: 0.45rem; border-radius: var(--r-s); padding: 0.45rem 0.85rem; font-weight: 600; font-size: 0.86rem; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { border-color: #c9cfdc; }
.btn.primary { background: var(--sapphire); border-color: var(--sapphire); color: #fff; }
.btn.primary:hover { background: var(--sapphire-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface); }
.btn.danger { color: var(--red); }
.section-title { display: flex; align-items: baseline; gap: 0.6rem; margin: 1.6rem 0 0.6rem; }
.section-title h3 { font-size: 0.95rem; font-weight: 700; }
.section-title span { font-size: 0.8rem; color: var(--muted); }
.section-title.red h3 { color: var(--red); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 1.2rem 0; }
.empty b { color: var(--ink); display: block; font-weight: 600; }

/* Dòng công việc */
.tasks { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }
.task { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.task:last-child { border-bottom: none; }
.task:hover { background: #fafbfd; }
.check { width: 21px; height: 21px; border-radius: 50%; border: 2px solid #c3c9d6; flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; transition: all 0.15s; }
.check:hover { border-color: var(--green); background: var(--green-soft); }
.check i { font-size: 0.62rem; color: #fff; opacity: 0; }
.task.done .check, .check.on { background: var(--green); border-color: var(--green); }
.task.done .check i, .check.on i { opacity: 1; }
.task.done .t-title { color: var(--muted); text-decoration: line-through; text-decoration-color: #b9bfcc; }
.task.prio-urgent .check { border-color: var(--red); }
.task.prio-high .check { border-color: var(--gold); }
.t-body { flex: 1; min-width: 0; }
.t-title { font-weight: 500; overflow-wrap: anywhere; }
.t-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-top: 0.3rem; font-size: 0.78rem; color: var(--muted); }
.t-meta .m { display: inline-flex; align-items: center; gap: 0.3rem; }
.t-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
.task.just-done { animation: fadeOut 0.5s 0.35s forwards; }
@keyframes fadeOut { to { opacity: 0.35; } }

/* ---------- Hôm nay ---------- */
.hero { display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 0.6rem 0 1.2rem; }
.hero .eyebrow { font-size: 0.85rem; color: var(--muted); }
.hero h1 { font-family: var(--serif); font-weight: 600; font-size: 2.6rem; line-height: 1.12; letter-spacing: -0.3px; margin: 0.15rem 0 0.4rem; }
.hero h1 em { font-style: italic; font-weight: 500; color: var(--gold); }
.hero p { color: var(--ink-2); max-width: 56ch; }
.ring { position: relative; width: 116px; height: 116px; flex-shrink: 0; }
.ring svg { transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .lbl b { font-family: var(--serif); font-size: 1.6rem; font-weight: 600; display: block; line-height: 1; }
.ring .lbl span { font-size: 0.72rem; color: var(--muted); }
.ring circle { transition: stroke-dashoffset 0.6s ease; }
.inbox-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0.7rem; margin-top: 0.4rem; }
.ibox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 0.85rem 0.95rem; display: flex; flex-direction: column; gap: 0.2rem; text-decoration: none; color: inherit; position: relative; }
.ibox::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tone); }
.ibox b { font-weight: 600; font-size: 0.9rem; }
.ibox small { color: var(--muted); font-size: 0.78rem; }
.ibox .acts { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
.ibox .acts a, .ibox .acts button { font-size: 0.78rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; color: var(--ink-2); background: var(--surface); }
.ibox .acts a:hover, .ibox .acts button:hover { border-color: var(--sapphire); color: var(--sapphire); }
.scope { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.scope button { padding: 0.28rem 0.8rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.scope button[aria-pressed="true"] { background: var(--night); color: #fff; }

/* ---------- Bảng ---------- */
.toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
.toolbar h2, .page-title { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; margin-right: auto; }
.toolbar select { border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); padding: 0.4rem 0.6rem; font-size: 0.85rem; }
.board { display: grid; grid-template-columns: repeat(4, minmax(250px, 1fr)); gap: 0.9rem; overflow-x: auto; padding-bottom: 0.6rem; align-items: start; }
.col { background: #eceef4; border-radius: var(--r-l); padding: 0.6rem; min-height: 200px; transition: background 0.15s; }
.col.drop { background: #dfe6fb; }
.col-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0.3rem 0.6rem; }
.col-head b { font-size: 0.88rem; }
.col-head span { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.col-head button { margin-left: auto; color: var(--muted); width: 26px; height: 26px; border-radius: 6px; }
.col-head button:hover { background: var(--surface); color: var(--ink); }
.cards { display: flex; flex-direction: column; gap: 0.5rem; min-height: 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 0.7rem 0.75rem; cursor: pointer; box-shadow: 0 1px 1px rgba(17,26,51,0.03); }
.card:hover { border-color: #c9cfdc; }
.card.dragging { opacity: 0.4; }
.card .t-title { font-size: 0.9rem; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; margin-top: 0.55rem; }
.card .proj { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.74rem; color: var(--muted); margin-bottom: 0.3rem; }
.prio-bar { height: 3px; border-radius: 3px; margin: -0.3rem -0.35rem 0.5rem; }

/* ---------- Lịch ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 0.5rem; overflow-x: auto; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); min-height: 340px; padding: 0.55rem; display: flex; flex-direction: column; gap: 0.4rem; transition: background 0.15s; }
.day.today { border-color: var(--gold-line); box-shadow: inset 0 3px 0 var(--gold); }
.day.drop { background: var(--sapphire-soft); }
.day-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0.1rem 0.2rem 0.3rem; }
.day-head b { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
.day-head span { font-size: 0.76rem; color: var(--muted); }
.day .card { padding: 0.5rem 0.55rem; }
.day .card .t-title { font-size: 0.82rem; }
.day .add { color: var(--muted); font-size: 0.8rem; text-align: left; padding: 0.25rem 0.3rem; border-radius: 6px; }
.day .add:hover { background: var(--porcelain); color: var(--ink); }

/* ---------- Ngăn chi tiết ---------- */
.scrim { position: fixed; inset: 0; background: rgba(17,26,51,0.32); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--surface); z-index: 50; transform: translateX(100%); visibility: hidden; transition: transform 0.25s ease, visibility 0.25s; display: flex; flex-direction: column; }
.drawer.open { transform: none; visibility: visible; box-shadow: -18px 0 50px rgba(17,26,51,0.18); }
.d-head { padding: 1rem 1.3rem 0.8rem; border-bottom: 1px solid var(--line-2); display: flex; gap: 0.8rem; align-items: flex-start; }
.d-head .check { width: 26px; height: 26px; margin-top: 4px; }
.d-title { flex: 1; font-family: var(--serif); font-size: 1.45rem; font-weight: 600; line-height: 1.25; border: 1px solid transparent; border-radius: 8px; padding: 0.1rem 0.35rem; margin-left: -0.35rem; resize: none; width: 100%; background: transparent; overflow: hidden; }
.d-title:hover { border-color: var(--line); }
.d-title:focus { outline: none; border-color: var(--sapphire); }
.d-close { width: 36px; height: 36px; border-radius: 50%; color: var(--muted); font-size: 1.05rem; flex-shrink: 0; }
.d-close:hover { background: var(--porcelain); color: var(--ink); }
.d-body { flex: 1; overflow-y: auto; padding: 1rem 1.3rem 2rem; }
.row { display: grid; grid-template-columns: 118px 1fr; gap: 0.8rem; align-items: start; padding: 0.55rem 0; border-bottom: 1px dashed var(--line-2); }
.row > label { font-size: 0.8rem; color: var(--muted); padding-top: 0.35rem; }
.opts { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.opt { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0.3rem 0.72rem; font-size: 0.82rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.35rem; }
.opt:hover { border-color: #c1c8d6; color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
.opt.st-doing[aria-pressed="true"] { background: var(--sapphire); border-color: var(--sapphire); }
.opt.st-review[aria-pressed="true"] { background: var(--violet); border-color: var(--violet); }
.opt.st-done[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
.opt.p-urgent[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.opt.p-high[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
.opt input[type=date], .opt-date { border: 1px solid var(--line); border-radius: 999px; padding: 0.24rem 0.6rem; font-size: 0.82rem; background: var(--surface); }
.d-section { margin-top: 1.3rem; }
.d-section h5 { font-size: 0.82rem; font-weight: 700; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
.d-section h5 span { color: var(--muted); font-weight: 500; }
.desc { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: var(--r-m); padding: 0.65rem 0.75rem; resize: vertical; line-height: 1.55; }
.desc:focus { outline: none; border-color: var(--sapphire); box-shadow: 0 0 0 3px rgba(31,79,214,0.1); }
.cl-item { display: flex; align-items: center; gap: 0.6rem; padding: 0.35rem 0.2rem; border-radius: 6px; }
.cl-item:hover { background: var(--porcelain); }
.cl-item .check { width: 18px; height: 18px; }
.cl-item span { flex: 1; font-size: 0.9rem; }
.cl-item.done span { color: var(--muted); text-decoration: line-through; }
.cl-item .x { color: var(--muted); opacity: 0; width: 24px; height: 24px; border-radius: 5px; }
.cl-item:hover .x { opacity: 1; }
.cl-add { width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 0.45rem 0.65rem; font-size: 0.88rem; margin-top: 0.3rem; background: transparent; }
.cl-add:focus { outline: none; border-style: solid; border-color: var(--sapphire); }
.bar { height: 5px; background: var(--line-2); border-radius: 5px; overflow: hidden; margin-bottom: 0.5rem; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 5px; transition: width 0.3s; }
.link-card { margin-bottom: 0.6rem; display: flex; align-items: center; gap: 0.6rem; background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: var(--r-m); padding: 0.6rem 0.75rem; text-decoration: none; color: inherit; font-size: 0.88rem; }
.link-card i { color: var(--gold); }
.comment { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; }
.comment .bubble { background: var(--porcelain); border-radius: 4px 12px 12px 12px; padding: 0.5rem 0.75rem; flex: 1; }
.comment .who { font-size: 0.76rem; color: var(--muted); margin-bottom: 0.15rem; }
.comment .who b { color: var(--ink); font-weight: 600; margin-right: 0.3rem; }
.comment p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.9rem; }
.c-form { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
.c-form textarea { flex: 1; border: 1px solid var(--line); border-radius: var(--r-m); padding: 0.5rem 0.7rem; resize: none; min-height: 42px; }
.c-form textarea:focus { outline: none; border-color: var(--sapphire); }
.hist { list-style: none; font-size: 0.8rem; color: var(--muted); }
.hist li { padding: 0.15rem 0; }
.hist b { color: var(--ink-2); font-weight: 600; }
.d-foot { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 1.3rem; border-top: 1px solid var(--line-2); font-size: 0.78rem; color: var(--muted); }

/* ---------- Hộp thoại dự án ---------- */
.modal-wrap { position: fixed; inset: 0; background: rgba(17,26,51,0.4); z-index: 60; display: none; align-items: center; justify-content: center; padding: 1rem; }
.modal-wrap.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 420px; padding: 1.3rem; box-shadow: 0 30px 70px rgba(17,26,51,0.3); }
.modal h3 { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; margin-bottom: 0.9rem; }
.modal input { width: 100%; border: 1px solid var(--line); border-radius: var(--r-m); padding: 0.6rem 0.75rem; margin-bottom: 0.8rem; }
.modal input:focus { outline: none; border-color: var(--sapphire); }
.swatches { display: flex; gap: 0.45rem; margin-bottom: 1.1rem; }
.swatches button { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; }
.swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
.modal .acts { display: flex; justify-content: flex-end; gap: 0.5rem; }

.toast { position: fixed; bottom: 1.3rem; left: 50%; transform: translate(-50%, 16px); background: var(--night); color: #fff; padding: 0.65rem 0.9rem 0.65rem 1rem; border-radius: 12px; font-size: 0.88rem; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 70; display: flex; align-items: center; gap: 0.8rem; max-width: calc(100% - 2rem); box-shadow: 0 12px 30px rgba(17,26,51,0.3); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast.error { background: var(--red); }
.toast button { color: #f3d9a8; font-weight: 700; font-size: 0.84rem; }
.loading { padding: 5rem 1rem; text-align: center; color: var(--muted); }

.mobile-nav, .fab, .mobile-head { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .mobile-head { display: flex; align-items: center; justify-content: space-between; padding: calc(0.8rem + env(safe-area-inset-top, 0px)) 1rem 0.2rem; }
  .mobile-head b { font-family: var(--sans); font-size: 1.15rem; font-weight: 700; letter-spacing: -0.3px; display: inline-flex; align-items: center; gap: 0.5rem; }
  .mobile-head b img { width: 30px; height: auto; }
  .mobile-head a { font-size: 0.8rem; color: var(--muted); text-decoration: none; }
  .topbar { padding: 0.6rem 1rem; }
  .quick .hint { display: none; }
  .content { padding: 1rem 1rem 6rem; }
  .hero { flex-direction: column-reverse; align-items: flex-start; gap: 0.8rem; }
  .hero h1 { font-size: 2rem; }
  .ring { width: 88px; height: 88px; }
  .ring svg { width: 88px; height: 88px; }
  .mobile-nav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--night); z-index: 30; padding: 0.4rem 0.4rem calc(0.4rem + env(safe-area-inset-bottom, 0px)); }
  .mobile-nav button { color: var(--night-muted); display: flex; flex-direction: column; align-items: center; gap: 0.15rem; font-size: 0.68rem; padding: 0.35rem 0; border-radius: 8px; position: relative; }
  .mobile-nav button i { font-size: 1.05rem; }
  .mobile-nav button[aria-current="page"] { color: #fff; }
  .mobile-nav .badge { position: absolute; top: 2px; right: 22%; background: var(--gold); color: #fff; font-size: 0.6rem; font-weight: 700; border-radius: 999px; padding: 0 0.3rem; }
  .fab { display: grid; place-items: center; position: fixed; right: 1rem; bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; background: var(--sapphire); color: #fff; font-size: 1.2rem; z-index: 31; box-shadow: 0 10px 25px rgba(31,79,214,0.4); }
  .row { grid-template-columns: 1fr; gap: 0.35rem; }
  .row > label { padding-top: 0; }
  .board { grid-template-columns: repeat(4, 82vw); scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; }
}

/* =========================================================
   Tinh chỉnh giao diện (bản 2): căn giữa, avatar màu, thẻ nổi,
   cột bảng có màu trạng thái, lịch gọn, mobile cuộn ngang
   ========================================================= */
.side { background: linear-gradient(180deg, #111a33 0%, #0e1630 100%); box-shadow: inset -1px 0 0 rgba(255,255,255,0.04); }
/* Logo W + chữ tên phân hệ */
.brand { display: flex; align-items: center; gap: 0.75rem; padding: 0.35rem 0.55rem 1.3rem; text-decoration: none; color: #fff; position: relative; }
.brand::after { content: ""; position: absolute; left: 0.55rem; right: 0.55rem; bottom: 0.55rem; height: 1px; background: linear-gradient(90deg, rgba(0,200,255,0.45), rgba(180,230,40,0.25) 45%, transparent); }
.brand .mark { width: 44px; height: auto; flex-shrink: 0; filter: drop-shadow(0 4px 12px rgba(0,150,255,0.45)); transition: transform .25s ease, filter .25s ease; }
.brand:hover .mark { transform: translateY(-1px) scale(1.04); filter: drop-shadow(0 6px 16px rgba(0,170,255,0.6)); }
.brand .word { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.brand .word b { font-family: var(--sans); font-size: 1.28rem; font-weight: 700; letter-spacing: -0.3px; color: #fff; display: block; }
.brand .word small { margin-top: 0.15rem; line-height: 1.6; padding-top: 2px; font-size: 0.62rem; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; white-space: nowrap; background: linear-gradient(90deg, #38d2ff 0%, #7fe0a0 55%, #c8ec3a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.add-btn { box-shadow: 0 6px 18px rgba(31,79,214,0.35); transition: transform .15s, background .15s; }
.add-btn:hover { transform: translateY(-1px); }
.nav button, .nav a { transition: background .15s, color .15s; }
.nav button[aria-current="page"] { background: linear-gradient(90deg, rgba(31,79,214,0.35), rgba(31,79,214,0.12)); box-shadow: inset 3px 0 0 #6d8dff; }
.nav .n:not(:empty) { background: rgba(255,255,255,0.07); border-radius: 999px; padding: 0.05rem 0.5rem; min-width: 1.6rem; text-align: center; }
.nav .n.hot:not(:empty) { background: rgba(243,217,168,0.16); }

/* Căn giữa nội dung + thanh thêm việc thẳng hàng với nội dung */
.topbar { padding: 1rem 2.5rem 0.9rem; }
.quick { max-width: 1180px; margin: 0 auto; }
.quick input { border-radius: 14px; padding: 0.85rem 1.1rem 0.85rem 2.8rem; font-size: 0.97rem; }
.quick > i { top: 1.1rem; left: 1.1rem; }
.quick .hint { opacity: 0.85; }
.content { max-width: 1180px; margin: 0 auto; padding: 1.2rem 2.5rem 5rem; }

/* Avatar: to hơn, có màu riêng từng người, viền tách rõ */
.av { width: 28px; height: 28px; font-size: 0.64rem; letter-spacing: 0.2px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgba(17,26,51,0.06); }
.avs .av + .av { margin-left: -6px; }
.avs:hover .av + .av { margin-left: -2px; }
.avs .av { transition: margin .15s; }

/* Tiêu đề nhóm: số đếm thành huy hiệu */
.section-title { align-items: center; margin: 1.8rem 0 0.7rem; }
.section-title > span:not(:empty):not(.sub), .section-title div > span:not(:empty) { background: var(--line-2); color: var(--ink-2); font-weight: 600; font-size: 0.72rem; border-radius: 999px; padding: 0.08rem 0.55rem; }
.section-title.red > span:not(:empty) { background: var(--red-soft); color: var(--red); }
.section-title.red h3::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 0.5rem; vertical-align: 1px; box-shadow: 0 0 0 4px var(--red-soft); }

/* Danh sách việc */
.tasks { border-radius: 16px; box-shadow: 0 1px 2px rgba(17,26,51,0.04); }
.task { padding: 0.85rem 1.1rem; gap: 0.9rem; position: relative; transition: background .12s; }
.task::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
.task.prio-urgent::before { background: var(--red); }
.task.prio-high::before { background: var(--gold); }
.task:hover { background: #f8f9fc; }
.t-title { font-size: 0.95rem; color: var(--ink); }
.t-meta { margin-top: 0.4rem; gap: 0.45rem 0.6rem; }
.t-right { align-self: center; }
.check { width: 22px; height: 22px; }

/* Trạng thái rỗng */
.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 16px; padding: 1.4rem 1.3rem; text-align: center; }
.empty b { margin-bottom: 0.2rem; }

/* Hero hôm nay */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.6rem 1.8rem; margin: 0.4rem 0 1.4rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero h1 { font-size: 2.4rem; }

/* Thẻ hệ thống */
.inbox-strip { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.8rem; }
.ibox { padding: 1rem 1.05rem 0.95rem 1.2rem; transition: box-shadow .15s, transform .15s; }
.ibox:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.ibox::before { top: 0; bottom: 0; width: 4px; border-radius: 0; }
.ibox .acts a:first-child { background: var(--night); border-color: var(--night); color: #fff; }
.ibox .acts a:first-child:hover { background: var(--sapphire); border-color: var(--sapphire); color: #fff; }

/* Bảng công việc */
.toolbar { margin-bottom: 1.2rem; }
.toolbar select { border-radius: 10px; padding: 0.5rem 0.7rem; min-width: 150px; }
.board { gap: 1rem; }
.col { background: #eef0f5; border: 1px solid #e6e9f0; border-radius: 16px; padding: 0.7rem; }
.col-head { padding: 0.25rem 0.35rem 0.75rem; }
.col-head b::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 0.5rem; background: var(--st, #9aa3b5); vertical-align: 1px; }
.col[data-col="todo"] { --st: #9aa3b5; }
.col[data-col="doing"] { --st: var(--sapphire); }
.col[data-col="review"] { --st: var(--violet); }
.col[data-col="done"] { --st: var(--green); }
.col-head span { background: var(--surface); border-radius: 999px; padding: 0 0.5rem; }
.card { border-radius: 12px; padding: 0.8rem 0.85rem; transition: box-shadow .15s, transform .15s, border-color .15s; position: relative; overflow: hidden; }
.card:hover { box-shadow: 0 6px 18px rgba(17,26,51,0.08); transform: translateY(-1px); border-color: #d6dbe6; }
.prio-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; height: auto; margin: 0; border-radius: 0; }
.card .t-title { font-weight: 500; line-height: 1.4; }
.card .foot { margin-top: 0.7rem; align-items: flex-end; }
.col[data-col="done"] .card .t-title { color: var(--muted); text-decoration: line-through; text-decoration-color: #c3c9d6; }

/* Lịch tuần */
.week { gap: 0.6rem; }
.day { min-height: 300px; border-radius: 16px; padding: 0.6rem; }
.day-head { padding: 0.15rem 0.25rem 0.5rem; border-bottom: 1px solid var(--line-2); margin-bottom: 0.2rem; }
.day-head span { font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; font-size: 0.7rem; }
.day.today { box-shadow: none; border-color: var(--gold); background: linear-gradient(180deg, #fffaf1 0%, var(--surface) 80px); }
.day.today .day-head b { background: var(--gold); color: #fff; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1.05rem; }
.day.weekend { background: #fafbfd; }
.day .card { border-radius: 10px; }
.day .add { opacity: 0; transition: opacity .15s; margin-top: auto; }
.day:hover .add, .day .add:focus-visible { opacity: 1; }
.btn { border-radius: 10px; min-height: 34px; }

/* Ngăn chi tiết */
.drawer.open { box-shadow: -24px 0 60px rgba(17,26,51,0.2); }
.d-head { padding: 1.2rem 1.4rem 1rem; }

@media (max-width: 900px) {
  .topbar { padding: 0.6rem 1rem; }
  .content { padding: 1rem 1rem 7rem; }
  .hero { flex-direction: row; align-items: center; padding: 1.1rem 1.1rem; border-radius: 16px; gap: 0.8rem; }
  .hero h1 { font-size: 1.65rem; }
  .hero p { font-size: 0.9rem; }
  .ring, .ring svg { width: 76px; height: 76px; }
  .ring .lbl b { font-size: 1.15rem; }
  .inbox-strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0.6rem; margin: 0 -1rem; padding: 0.2rem 1rem 0.5rem; scrollbar-width: none; }
  .inbox-strip::-webkit-scrollbar { display: none; }
  .ibox { flex: 0 0 78%; scroll-snap-align: start; }
  .task { padding: 0.8rem 0.9rem; }
  .day .add { opacity: 1; }
  .mobile-nav { border-radius: 18px 18px 0 0; box-shadow: 0 -8px 24px rgba(17,26,51,0.18); }
  .mobile-nav button[aria-current="page"] { background: var(--night-3); }
  .toolbar h2, .page-title { font-size: 1.45rem; }
}

/* ---------- Bản 3: gọn, cân đối ---------- */
/* Ô thêm việc thẳng hàng với nội dung; gợi ý chỉ hiện khi đang gõ */
.quick { max-width: calc(1180px - 5rem); }
.quick .hint { display: none; }
.quick:focus-within .hint { display: block; }
.quick input { box-shadow: 0 1px 2px rgba(17,26,51,0.04); }
.quick input:focus { box-shadow: 0 0 0 4px rgba(31,79,214,0.12); }
.topbar { padding-bottom: 0.7rem; }
/* Menu trái: mục đang chọn nhẹ nhàng hơn */
.nav button[aria-current="page"] { background: rgba(255,255,255,0.08); box-shadow: inset 3px 0 0 #4f7bff; }
.nav button, .nav a { font-size: 0.9rem; padding: 0.55rem 0.75rem; }
/* Khung chào */
.hero { padding: 1.5rem 1.8rem; align-items: center; gap: 1.5rem; }
.hero h1 { font-size: 2.2rem; margin-bottom: 0.3rem; }
.hero::after { width: 220px; height: 220px; right: -60px; top: -60px; }
.ring { width: 104px; height: 104px; }
.ring svg { width: 104px; height: 104px; }
.ring .lbl b { font-size: 1.45rem; }
.stats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
.stat { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.8rem; border-radius: 12px; background: var(--porcelain); border: 1px solid var(--line-2); font-size: 0.82rem; color: var(--muted); }
.stat i { font-size: 0.8rem; color: var(--muted); }
.stat b { font-size: 1rem; color: var(--ink); font-weight: 700; }
.stat.red { background: var(--red-soft); border-color: transparent; } .stat.red i, .stat.red b { color: var(--red); }
.stat.gold i { color: var(--gold); } .stat.blue i { color: var(--sapphire); } .stat.violet i { color: var(--violet); }
/* Nút Của tôi / Cả nhóm nằm cùng hàng với tiêu đề nhóm đầu tiên */
.list-scope { margin-left: auto; flex-shrink: 0; }
.quick .parsed:empty { margin-top: 0; }
.content { padding-top: 0.9rem; }
.section-title { margin-top: 1.6rem; }
.section-title h3 { font-size: 1rem; }
@media (max-width: 900px) {
  .quick { max-width: none; }
  .hero { display: block; padding: 1.1rem 1.1rem 1rem; }
  .hero > div:first-child { padding-right: 76px; }
  .hero .ring { position: absolute; top: 1rem; right: 1rem; width: 66px; height: 66px; }
  .hero .ring svg { width: 66px; height: 66px; }
  .hero .ring .lbl b { font-size: 1rem; }
  .hero .ring .lbl span { font-size: 0.6rem; }
  .hero h1 { font-size: 1.55rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin: 0.9rem -76px 0 0; }
  .stat { padding: 0.45rem 0.6rem; font-size: 0.76rem; }
  .list-scope { margin-top: 1.3rem; }
}

/* =========================================================
   Đồng bộ màu chủ đề với website wvn.vn
   (navy #0f172a → xanh đậm #1e3a8a → xanh trời #0284c7, chữ slate, nền #f8fafc)
   ========================================================= */
:root {
  --night: #0f172a; --night-2: #1e293b; --night-3: #1e3a8a; --night-text: #cbd5e1; --night-muted: #94a3b8;
  --porcelain: #f8fafc; --line: #e2e8f0; --line-2: #f1f5f9;
  --ink: #0f172a; --ink-2: #334155; --muted: #64748b;
  --sapphire: #0284c7; --sapphire-2: #0369a1; --sapphire-soft: #e0f2fe;
  --gold: #d97706; --gold-soft: #fef3c7; --gold-line: #fde68a;
  --sky-grad: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
  --site-grad: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
  --serif: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 8px 24px rgba(15,23,42,0.06);
}
.side { background: linear-gradient(170deg, #0f172a 0%, #172554 55%, #1e3a8a 100%); }
.add-btn, .btn.primary, .fab { background: var(--sky-grad); border-color: transparent; box-shadow: 0 6px 18px rgba(2,132,199,0.35); }
.add-btn:hover, .btn.primary:hover { background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%); }
.nav button:hover, .nav a:hover { background: rgba(255,255,255,0.07); }
.nav button[aria-current="page"] { background: rgba(125,211,252,0.12); box-shadow: inset 3px 0 0 #38bdf8; }
.nav .n.hot, .toast button { color: #7dd3fc; }
.nav .n.hot:not(:empty) { background: rgba(125,211,252,0.15); }
.me .av { background: var(--sky-grad); }
.mobile-nav { background: var(--night); }
.mobile-nav .badge { background: #0284c7; }
.quick input:focus, .desc:focus { box-shadow: 0 0 0 4px rgba(2,132,199,0.14); }
/* Tiêu đề: chữ đậm không chân, giống trang chủ */
.hero h1, .toolbar h2, .page-title, .d-title, .modal h3, .day-head b, .ring .lbl b { font-weight: 800; letter-spacing: -0.5px; }
.hero h1 em { font-style: normal; font-weight: 800; background: linear-gradient(90deg, #0284c7, #2563eb); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero::after { background: radial-gradient(circle, #e0f2fe 0%, transparent 70%); }
.ring circle:last-child { stroke: #0284c7; }
.stat.gold i { color: #0284c7; }
.pill.gold { color: #b45309; }
/* Bảng & lịch */
.col { background: #f1f5f9; border-color: #e2e8f0; }
.col.drop { background: #e0f2fe; }
.day.today { border-color: #7dd3fc; background: linear-gradient(180deg, #f0f9ff 0%, var(--surface) 80px); }
.day.today .day-head b { background: var(--sky-grad); }
.day.weekend { background: #fbfcfe; }
.link-card { background: #f0f9ff; border-color: #bae6fd; }
.link-card i { color: #0284c7; }
.scope button[aria-pressed="true"], .opt[aria-pressed="true"] { background: var(--night); }
.ibox .acts a:first-child { background: var(--sky-grad); border-color: transparent; }

/* ---------- Ngăn chi tiết công việc: sáng, thoáng ---------- */
.scrim { background: rgba(15,23,42,0.16); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.drawer { background: #f8fafc; }
.drawer.open { box-shadow: -20px 0 50px rgba(15,23,42,0.14); }
.d-head { background: #fff; border-bottom: 1px solid var(--line); padding: 1.1rem 1.3rem 1rem; position: relative; }
.d-head::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #0284c7, #2563eb 55%, #38bdf8); }
.d-title { font-size: 1.35rem; }
.d-body { padding: 1rem 1.2rem 2rem; }
.props { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0.3rem 1rem; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
.props .row { border-bottom: 1px solid var(--line-2); padding: 0.65rem 0; grid-template-columns: 124px 1fr; }
.props .row:last-child { border-bottom: none; }
.row > label { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; color: var(--muted); font-size: 0.8rem; padding-top: 0.4rem; align-self: start; }
.row > label i { width: 14px; text-align: center; color: #94a3b8; font-size: 0.78rem; }
.opt { background: #fff; border-color: var(--line); color: var(--ink-2); padding: 0.32rem 0.75rem; transition: all .12s; }
.opt:hover { border-color: #7dd3fc; background: #f0f9ff; color: var(--ink); }
/* Mục đang chọn: tô nhạt theo màu, không còn khối đen */
.opt[aria-pressed="true"], .scope .opt[aria-pressed="true"] { background: #e0f2fe; border-color: #38bdf8; color: #0369a1; font-weight: 600; box-shadow: 0 0 0 1px #38bdf8 inset; }
.opt.st-todo[aria-pressed="true"] { background: #f1f5f9; border-color: #94a3b8; color: #334155; box-shadow: 0 0 0 1px #94a3b8 inset; }
.opt.st-doing[aria-pressed="true"] { background: #e0f2fe; border-color: #0284c7; color: #0369a1; box-shadow: 0 0 0 1px #0284c7 inset; }
.opt.st-review[aria-pressed="true"] { background: #ede9fe; border-color: #8b5cf6; color: #6d28d9; box-shadow: 0 0 0 1px #8b5cf6 inset; }
.opt.st-done[aria-pressed="true"] { background: #dcfce7; border-color: #22c55e; color: #15803d; box-shadow: 0 0 0 1px #22c55e inset; }
.opt.p-low[aria-pressed="true"] { background: #f1f5f9; border-color: #94a3b8; color: #475569; box-shadow: 0 0 0 1px #94a3b8 inset; }
.opt.p-high[aria-pressed="true"] { background: #fef3c7; border-color: #f59e0b; color: #b45309; box-shadow: 0 0 0 1px #f59e0b inset; }
.opt.p-urgent[aria-pressed="true"] { background: #fee2e2; border-color: #ef4444; color: #b91c1c; box-shadow: 0 0 0 1px #ef4444 inset; }
.opt[aria-pressed="true"] .av { background: #0284c7 !important; color: #fff !important; }
.opt input[type=date], .opt-date { background: #fff; }
.d-section { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1rem; margin-top: 0.8rem; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }
.d-section h5 { font-size: 0.82rem; color: var(--ink); margin-bottom: 0.6rem; }
.d-section h5 i { color: #0284c7; font-size: 0.8rem; width: 14px; text-align: center; }

/* =========================================================
   Bản 4: sang trọng, tiết chế
   - Chữ: một phông duy nhất Be Vietnam Pro (tiêu đề dùng nét đậm hơn)
   - Một điểm nhấn duy nhất: khung chào nền đêm với vòng tiến độ màu logo
   - Phần còn lại: trắng, đường mảnh, nhiều khoảng thở
   ========================================================= */
:root {
  --sans: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --midnight: #0a1230; --midnight-2: #101d4a; --midnight-3: #16296b;
  --canvas: #f5f6fa; --hair: #e6e9f1; --hair-2: #eff1f6;

  --glow-cyan: #38bdf8; --glow-lime: #bef264;

}
body { font-family: var(--sans); background: var(--canvas); color: var(--ink); font-size: 14.5px; letter-spacing: -0.005em; }
.topbar { background: rgba(245,246,250,0.86); }

/* Thanh bên: đêm sâu, ánh sáng logo rất nhẹ ở đỉnh */
.side {
  background:
    radial-gradient(120% 40% at 0% 0%, rgba(56,189,248,0.16), transparent 60%),
    radial-gradient(90% 30% at 100% 8%, rgba(190,242,100,0.07), transparent 60%),
    linear-gradient(180deg, #0a1230 0%, #0d1840 55%, #13245f 100%);
  padding: 1.3rem 0.9rem 1rem;
  box-shadow: inset -1px 0 0 rgba(255,255,255,0.05);
}
.brand { padding: 0.2rem 0.55rem 1.4rem; }
.brand::after { bottom: 0.45rem; background: linear-gradient(90deg, rgba(56,189,248,0.4), rgba(190,242,100,0.18) 50%, transparent); }
.brand-mini .word small.tag { font-family: var(--sans); font-size: 0.78rem; font-weight: 600; letter-spacing: 3px; }
.add-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff;
  box-shadow: none; border-radius: 12px; padding: 0.7rem 0.85rem; font-weight: 500; margin-bottom: 1.2rem;
}
.add-btn:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.2); transform: none; }
.add-btn i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; color: var(--midnight); background: linear-gradient(135deg, var(--glow-cyan), var(--glow-lime)); }
.add-btn kbd { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); font-weight: 500; }
.nav { gap: 1px; }
.nav button, .nav a { color: #aeb8d6; font-weight: 450; font-size: 0.9rem; padding: 0.58rem 0.75rem; border-radius: 10px; }
.nav i { color: #6f7ca3; }
.nav button:hover, .nav a:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav button[aria-current="page"] { background: rgba(255,255,255,0.07); color: #fff; box-shadow: none; position: relative; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -0.9rem; top: 22%; bottom: 22%; width: 3px; border-radius: 0 3px 3px 0; background: linear-gradient(180deg, var(--glow-cyan), var(--glow-lime)); }
.nav button[aria-current="page"] i { color: var(--glow-cyan); }
.nav .n:not(:empty) { background: transparent; border: 1px solid rgba(255,255,255,0.12); color: #aeb8d6; font-weight: 500; font-size: 0.72rem; }

.side h4 { font-weight: 500; font-size: 0.74rem; color: #6f7ca3; letter-spacing: 0.2px; margin-top: 1.6rem; }
.side-foot { border-top: 1px solid rgba(255,255,255,0.07); }

/* Ô thêm việc */

/* Khung chào: điểm nhấn duy nhất */
.hero {

}
.hero::after { content: ""; right: 150px; top: auto; bottom: -150px; width: 280px; height: 280px; border-radius: 0; background: url("/images/logo-wvn.png?v=20260927b") no-repeat center / contain; opacity: 0.05; filter: grayscale(1) brightness(3); }

.hero h1 { font-family: var(--display); font-weight: 600; font-size: 2.85rem; letter-spacing: -0.4px; line-height: 1.08; color: #fff; margin: 0.35rem 0 0.55rem; }

.stats { display: flex; gap: 0; margin-top: 1.5rem; flex-wrap: wrap; }
.stat {

  background: transparent; border: none; border-left: 1px solid rgba(255,255,255,0.12); border-radius: 0;
  padding: 0.1rem 1.5rem; color: #9fb0da; font-size: 0.78rem;
}
.stat:first-child { border-left: none; padding-left: 0; }
.stat b { grid-column: 1 / -1; grid-row: 1; font-family: var(--display); font-size: 1.75rem; font-weight: 600; color: #fff; line-height: 1.1; }
.stat i { grid-row: 2; font-size: 0.72rem; color: #7f90bd; }
.stat span { grid-row: 2; }
.stat.red { background: transparent; } .stat.red b { color: #fca5a5; } .stat.red i { color: #fca5a5; }
.stat.gold i, .stat.blue i { color: var(--glow-cyan); } .stat.violet i { color: #c4b5fd; }
.ring .lbl b { font-family: var(--display); color: #fff; font-weight: 600; letter-spacing: 0; }
.ring .lbl span { color: #9fb0da; }
.ring circle:first-of-type { stroke: rgba(255,255,255,0.1); }
.ring circle:last-child { stroke: url(#ringGrad); stroke-width: 4; filter: drop-shadow(0 0 6px rgba(56,189,248,0.45)); }

/* Tiêu đề nhóm */
.section-title { margin: 2rem 0 0.8rem; }
.section-title h3 { font-size: 1.02rem; font-weight: 600; letter-spacing: -0.2px; }
.section-title > span:not(:empty):not(.sub), .section-title div > span:not(:empty) { background: transparent; border: 1px solid var(--hair); color: var(--muted); font-weight: 500; }

/* Danh sách việc */
.tasks { border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--lift); }
.task { padding: 1rem 1.3rem; gap: 1rem; border-bottom-color: var(--hair-2); }
.task:hover { background: #fafbfd; }
.task::before { top: 14px; bottom: 14px; }
.t-title { font-size: 0.97rem; font-weight: 500; color: var(--ink); }

.t-meta { margin-top: 0.45rem; }
.check { border-width: 1.5px; border-color: #c5cbdc; }
.task.done .check, .check.on { background: linear-gradient(135deg, #0ea5a4, #16a34a); border-color: transparent; }
.pill { font-weight: 500; border-radius: 8px; padding: 0.14rem 0.5rem; background: #f4f6fa; border-color: var(--hair-2); }
.pill.blue { background: #eaf6fe; color: #0369a1; }
.pill.gold { background: #fdf6e7; color: #9a6412; border-color: #f5e3bc; }
.pill.red { background: #fff1f0; color: #b42318; }
.av { box-shadow: none; border-color: #fff; font-weight: 600; }

/* Thẻ hệ thống */
.ibox { border: 1px solid var(--hair); border-radius: 16px; box-shadow: var(--lift); padding: 1.1rem 1.15rem 1rem 1.3rem; }
.ibox:hover { transform: none; box-shadow: 0 1px 0 rgba(12,19,48,0.03), 0 22px 44px -26px rgba(12,19,48,0.35); }

.ibox .acts a, .ibox .acts button { font-weight: 500; padding: 0.32rem 0.8rem; border-color: var(--hair); }
.ibox .acts a:first-child { background: var(--midnight); color: #fff; border-color: var(--midnight); }
.ibox .acts a:first-child:hover { background: var(--midnight-3); border-color: var(--midnight-3); color: #fff; }

/* Công tắc Của tôi / Cả nhóm */
.scope { border-color: var(--hair); box-shadow: var(--lift); }
.scope button { font-weight: 500; }
.scope button[aria-pressed="true"] { background: var(--midnight); }

/* Trạng thái rỗng */
.empty { border: 1px dashed #d7dbe7; background: #fbfbfd; border-radius: 18px; padding: 1.6rem 1.3rem; }

/* Bảng & lịch: cùng ngôn ngữ đường mảnh */
.toolbar h2, .page-title { font-family: var(--display); font-weight: 600; font-size: 2rem; letter-spacing: -0.3px; }
.col { background: #eff1f6; border-color: var(--hair); border-radius: 18px; }

.card { border-color: var(--hair); border-radius: 13px; box-shadow: 0 1px 0 rgba(12,19,48,0.03); }

.btn.primary, .fab { background: var(--midnight); box-shadow: 0 10px 24px -12px rgba(10,18,48,0.7); }
.btn.primary:hover { background: var(--midnight-3); }
.mobile-nav { background: var(--midnight); }
.mobile-nav button[aria-current="page"] { background: rgba(255,255,255,0.08); color: #fff; }
.mobile-nav .badge { background: var(--glow-cyan); color: var(--midnight); }

@media (max-width: 900px) {
  .hero { padding: 1.3rem 1.2rem 1.2rem; border-radius: 18px; margin-top: 0.3rem; }

  .hero h1 { font-size: 1.85rem; }
  .hero p { font-size: 0.88rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 0; margin: 1.1rem -76px 0 0; }
  .stat { padding: 0 0 0 0.9rem; }
  .stat:nth-child(odd) { border-left: none; padding-left: 0; }
  .stat b { font-size: 1.4rem; }

}
.brand-work { padding: 0.3rem 0.55rem 1.45rem; }
.brand-work .work-logo { display: block; height: 36px; width: auto; max-width: 100%; filter: drop-shadow(0 4px 14px rgba(56,189,248,0.25)); }
.mobile-head b.m-brand img.work-logo-m { width: auto; height: 30px; display: block; }

/* =========================================================
   Bản 5: mọi màn hình cùng đẳng cấp với "Hôm nay"
   ========================================================= */
.main { background: radial-gradient(900px 420px at 100% -10%, rgba(56,189,248,0.10), transparent 60%), var(--canvas); }
.topbar { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
.topbar.scrolled { background: rgba(245,246,250,0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.quick > i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; color: var(--midnight); background: linear-gradient(135deg, var(--glow-cyan), var(--glow-lime)); top: 0.72rem; left: 0.8rem; }
.quick input { padding-left: 3rem; }

/* Đầu trang của các màn hình còn lại */
.view .toolbar { position: relative; overflow: hidden; background: #fff; border: 1px solid var(--hair); border-radius: 22px; padding: 1.5rem 1.7rem; margin: 0.6rem 0 1.5rem; box-shadow: var(--lift); gap: 0.6rem 0.7rem; align-items: center; }
.view .toolbar::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--glow-cyan), #60a5fa 50%, var(--glow-lime)); }
.view .toolbar::after { content: ""; position: absolute; right: -80px; top: -120px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(56,189,248,0.12), transparent 65%); pointer-events: none; }
.view .toolbar > *:not(.sr-only) { position: relative; z-index: 1; }
.pt { margin-right: auto; min-width: 0; flex: 1 1 320px; }
.pt .page-title { margin: 0; font-size: 2.1rem; line-height: 1.1; }
.pt-sub { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; max-width: 64ch; }
.pt-num { display: grid; justify-items: start; padding: 0 0 0 1.3rem; border-left: 1px solid var(--hair); min-width: 88px; }
.pt-num b { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1; color: var(--ink); }
.pt-num span { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
.view .toolbar select { background-color: #fff; border-color: var(--hair); border-radius: 12px; font: inherit; font-size: 0.86rem; padding: 0.55rem 0.8rem; }
.view .toolbar .btn { border-radius: 12px; border-color: var(--hair); background: #fff; }
.view .toolbar .btn:hover { border-color: #c9d0e0; }

/* Bảng công việc */
.board { gap: 1.1rem; }
.col { background: rgba(255,255,255,0.55); border: 1px solid var(--hair); border-radius: 20px; padding: 0.75rem; position: relative; }
.col::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--st, #9aa3b5); opacity: 0.9; }
.col-head { padding: 0.45rem 0.35rem 0.8rem; }
.col-head b { font-size: 0.92rem; }
.col-head b::before { width: 8px; height: 8px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--st, #9aa3b5) 18%, transparent); }
.col-head span { border: 1px solid var(--hair); background: #fff; font-weight: 500; }
.col.drop { background: #eaf4ff; border-color: #93c5fd; }
.cards:empty { min-height: 88px; border: 1.5px dashed #d5dae6; border-radius: 14px; display: grid; place-items: center; }
.cards:empty::before { content: "Kéo thả việc vào đây"; font-size: 0.8rem; color: #a2a9c0; }
.card { background: #fff; border-radius: 14px; padding: 0.85rem 0.9rem; box-shadow: 0 1px 0 rgba(12,19,48,0.03), 0 10px 22px -20px rgba(12,19,48,0.45); }
.card .t-title { font-size: 0.92rem; }

/* Lịch tuần */
.week { gap: 0.7rem; }
.day { background: rgba(255,255,255,0.7); border-radius: 20px; padding: 0.7rem; min-height: 320px; }

.day.today { background: #fff; border-color: transparent; box-shadow: 0 0 0 1.5px #60a5fa, 0 24px 44px -30px rgba(29,78,216,0.55); }
.day.today .day-head b { width: 40px; height: 40px; font-size: 1.1rem; background: linear-gradient(135deg, #0a1230, #1e3a8a); box-shadow: 0 6px 16px -6px rgba(10,18,48,0.6); }
.day.today .day-head span { color: #1d4ed8; font-weight: 600; }
.day.weekend { background: rgba(240,242,248,0.7); }
.day .card { box-shadow: 0 1px 0 rgba(12,19,48,0.03), 0 8px 18px -16px rgba(12,19,48,0.45); }

/* Thanh bên: nhịp tiến độ hôm nay */
.focus { margin: 1.2rem 0.2rem 0.4rem; padding: 0.9rem 0.95rem; border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); }
.focus:empty { display: none; }
.f-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.78rem; color: #aeb8d6; }
.f-top b { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: #fff; }
.f-bar { height: 5px; border-radius: 5px; background: rgba(255,255,255,0.1); margin: 0.55rem 0 0.5rem; overflow: hidden; }
.f-bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--glow-cyan), var(--glow-lime)); box-shadow: 0 0 10px rgba(56,189,248,0.5); transition: width .5s ease; }
.focus small { font-size: 0.76rem; color: #8f9cc2; }

/* Phản hồi khi hoàn thành một việc */
@keyframes checkPop { 0% { transform: scale(0.7); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes rowGlow { 0% { background: rgba(125,211,252,0.28); } 100% { background: transparent; } }
.task.just-done .check { animation: checkPop .42s cubic-bezier(.3,1.5,.5,1); }
.task.just-done { animation: rowGlow 0.9s ease-out, fadeOut 0.5s 0.6s forwards; }

/* Trạng thái rỗng dễ thương hơn */
.empty { position: relative; padding: 1.8rem 1.4rem; color: var(--muted); }
.empty b { font-family: var(--display); font-size: 1.2rem; font-weight: 600; color: var(--ink); margin-bottom: 0.3rem; }

@media (max-width: 900px) {
  .view .toolbar { padding: 1.1rem 1.1rem; border-radius: 18px; margin-top: 0.3rem; }

  .pt .page-title { font-size: 1.6rem; }

/* Một phông duy nhất: tiêu đề lớn dùng nét đậm và khoảng chữ khít */
.hero h1, .toolbar h2, .page-title, .pt .page-title, .d-title, .modal h3 { font-weight: 700 !important; letter-spacing: -0.025em !important; }
.hero h1 em { font-style: normal !important; font-weight: 500 !important; }

/* Câu triết lý song ngữ trong khung Hôm nay */
.hero .wvn-quote { margin: 1rem 0 0; padding-left: 0.9rem; border-left: 2px solid; border-image: linear-gradient(180deg, var(--glow-cyan), var(--glow-lime)) 1; max-width: 60ch; }
.hero .wvn-quote p { margin: 0; color: #c9d3ef; font-size: 0.92rem; line-height: 1.5; }
.hero .wvn-quote .wvn-quote-en { margin-top: 0.2rem; font-style: italic; font-size: 0.85rem; color: #9fb0da; }

<script>
(function () {
  'use strict';
  const token = localStorage.getItem('wvn_admin_token');
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
  const DAY = 864e5;
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => ymd(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
  const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const WDs = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  const fmtDue = (d, t) => {
    if (!d) return '';
    const n = Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / DAY);
    let s = n === 0 ? 'Hôm nay' : n === 1 ? 'Ngày mai' : n === -1 ? 'Hôm qua' : (n > 1 && n < 7) ? WD[new Date(d + 'T00:00:00').getDay()] : d.slice(8) + '/' + d.slice(5, 7);
    return t ? `${s} ${t}` : s;
  };
  const initials = n => { const p = String(n || '?').trim().split(/\s+/); return ((p.length > 1 ? p[p.length - 2][0] : '') + p[p.length - 1][0]).toUpperCase(); };
  const rel = iso => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso)) / 60000); if (m < 1) return 'vừa xong'; if (m < 60) return m + ' phút trước'; const h = Math.round(m / 60); if (h < 24) return h + ' giờ trước'; const d = Math.round(h / 24); return d < 30 ? d + ' ngày trước' : new Date(iso).toLocaleDateString('vi-VN'); };

  const STATUS = [['todo', 'Cần làm'], ['doing', 'Đang làm'], ['review', 'Chờ duyệt'], ['done', 'Hoàn thành']];
  const STATUS_L = Object.fromEntries(STATUS);
  const PRIO = [['low', 'Thấp'], ['normal', 'Bình thường'], ['high', 'Cao'], ['urgent', 'Khẩn']];
  const PRIO_COLOR = { urgent: 'var(--red)', high: 'var(--gold)', normal: 'transparent', low: 'transparent' };
  const RECUR = [['', 'Không lặp'], ['daily', 'Mỗi ngày'], ['weekdays', 'Ngày làm việc'], ['weekly', 'Mỗi tuần'], ['monthly', 'Mỗi tháng']];
  const COLORS = ['#2563eb', '#0891b2', '#059669', '#ca8a04', '#dc2626', '#db2777', '#7c3aed', '#475569'];
  const TONE = { blue: 'var(--sapphire)', green: 'var(--green)', gold: 'var(--gold)', red: 'var(--red)', violet: 'var(--violet)' };

  let D = { me: {}, tasks: [], projects: [], staff: [], inbox: [] };
  let state = { view: 'today', project: '', scope: 'me', boardWho: '', weekStart: null, openId: null };

  // ---------- API ----------
  async function api(path, opts = {}, attempt = 0) {
    const get = !opts.method || opts.method === 'GET';
    let res;
    try { res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token } }); }
    catch (e) { if (get && attempt < 2) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, opts, attempt + 1); } throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { localStorage.removeItem('wvn_admin_token'); location.replace('admin-dang-nhap.html'); throw new Error('Phiên đăng nhập đã hết hạn.'); }
    if (res.status >= 500 && get && attempt < 2 && (!data.message || data.retryable)) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, opts, attempt + 1); }
    if (!res.ok || !data.success) throw new Error(data.message || `Máy chủ chưa phản hồi được (mã ${res.status}).`);
    return data;
  }
  const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body) });

  function toast(msg, opts) {
    opts = opts || {};
    const t = $('toast'); $('toastMsg').textContent = msg; t.className = 'toast show' + (opts.error ? ' error' : '');
    const u = $('toastUndo'); u.hidden = !opts.undo; u.onclick = () => { t.className = 'toast'; opts.undo(); };
    clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', opts.error ? 6000 : opts.undo ? 5000 : 2600);
  }

  // ---------- Truy vấn ----------
  const staffBy = email => D.staff.find(s => s.email === email) || { email, name: email ? email.split('@')[0] : '?' };
  const projectBy = id => D.projects.find(p => p.id === id);

      <div class="hero">
        <div>

      ${overdue.length ? `<div class="section-title red"><h3>Quá hạn</h3><span>${overdue.length}</span><div class="scope list-scope" role="group" aria-label="Phạm vi"><button data-scope="me" aria-pressed="${state.scope === 'me'}">Của tôi</button><button data-scope="all" aria-pressed="${state.scope === 'all'}">Cả nhóm</button></div></div>${list(overdue)}` : ''}

      ${list(todays, '<b>Không có việc hạn hôm nay.</b>Gõ vào ô phía trên, ví dụ "Chuẩn bị tài liệu lớp chiều nay".')}

  const inboxCard = i => `<div class="ibox" style="--tone:${TONE[i.tone] || 'var(--sapphire)'}"><b>${esc(i.title)}</b><small>${esc(i.hint || '')}</small>

        <label class="sr-only" for="fProj">Dự án</label><select id="fProj"><option value="">Mọi dự án</option>${D.projects.filter(x => !x.archived).map(x => `<option value="${esc(x.id)}" ${x.id === state.project ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>

  // ---------- Tìm việc (phím / hoặc Ctrl/⌘ + K) ----------

      const hay = t => normVN([t.title, t.description, (t.labels || []).join(' '), (projectBy(t.projectId) || {}).name, (t.assignees || []).map(staffName).join(' '), (t.checklist || []).map(i => i.text).join(' ')].join(' '));

  // ---------- Thêm việc nhanh: hiểu câu tiếng Việt ----------
  function parseQuick(text) {
    let s = (' ' + text + ' ').normalize('NFC');
    const out = { title: '', dueDate: '', dueTime: '', assignees: [], projectId: '', priority: '', recurrence: '' };
    const n = norm(s);
    const cut = (re) => { const m = norm(s).match(re); if (!m) return null; const i = m.index; s = s.slice(0, i) + ' ' + s.slice(i + m[0].length); return m; };
    const today = todayStr();
    // lặp lại
    let m;
    if ((m = cut(/\s(moi|hang) ngay lam viec(?=\s)/))) out.recurrence = 'weekdays';
    else if ((m = cut(/\s(moi|hang) (ngay)(?=\s)/))) out.recurrence = 'daily';
    else if ((m = cut(/\s(moi|hang) tuan(?=\s)/))) out.recurrence = 'weekly';
    else if ((m = cut(/\s(moi|hang) thang(?=\s)/))) out.recurrence = 'monthly';
    // ngày
    if ((m = cut(/\s(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?(?=\s)/))) {
      const y = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : String(new Date().getFullYear());
      let d = `${y}-${pad(+m[2])}-${pad(+m[1])}`; if (!m[3] && d < today) d = `${+y + 1}-${pad(+m[2])}-${pad(+m[1])}`; out.dueDate = d;
    } else if (cut(/\s(hom nay|toi nay|chieu nay|sang nay|nay)(?=\s)/)) out.dueDate = today;
    else if (cut(/\s(ngay mai|mai)(?=\s)/)) out.dueDate = addDays(today, 1);
    else if (cut(/\s(ngay kia|mot)(?=\s)/)) out.dueDate = addDays(today, 2);
    else if (cut(/\stuan sau(?=\s)/)) out.dueDate = addDays(mondayOf(today), 7);
    else if ((m = cut(/\s(?:thu\s?([2-7])|t([2-7])|(chu nhat|cn))(?=\s)/))) {
      const target = m[3] ? 0 : (+(m[1] || m[2]) - 1); const cur = new Date(today + 'T00:00:00').getDay();
      let diff = (target - cur + 7) % 7; if (diff === 0) diff = 7; out.dueDate = addDays(today, diff);
    }
    // giờ
    if ((m = cut(/\s(\d{1,2})(?:h|:|g)(\d{2})?(?:\s?(sang|chieu|toi))?(?=\s)/))) {
      let h = +m[1]; if ((m[3] === 'chieu' || m[3] === 'toi') && h < 12) h += 12; if (h < 24) { out.dueTime = `${pad(h)}:${pad(+(m[2] || 0))}`; if (!out.dueDate) out.dueDate = today; }
    }
    // ưu tiên
    if (cut(/\s(!{3}|!khan|!gap)(?=\s)/)) out.priority = 'urgent';
    else if (cut(/\s(!{2}|!cao|!quan trong)(?=\s)/)) out.priority = 'high';
    else if (cut(/\s!thap(?=\s)/)) out.priority = 'low';
    // @người
    let guard = 0;
    while ((m = norm(s).match(/\s@([a-z0-9._-]+)/)) && guard++ < 5) {
      const q = m[1]; const who = D.staff.find(x => norm(x.name).split(/\s+/).some(w => w.startsWith(q)) || norm(x.email).startsWith(q));
      s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length);
      if (who && !out.assignees.includes(who.email)) out.assignees.push(who.email);
    }
    // #dự án (khớp tên dài nhất)
    if ((m = norm(s).match(/\s#([^\s#@!]+(?:\s[^\s#@!]+){0,3})/))) {
      const words = m[1].split(/\s+/); let best = null, bestLen = 0;
      for (let k = words.length; k >= 1; k--) {
        const q = words.slice(0, k).join(' ').replace(/-/g, ' ');
        const p = D.projects.find(x => !x.archived && norm(x.name).startsWith(q)) || D.projects.find(x => !x.archived && norm(x.name).includes(q));
        if (p) { best = p; bestLen = k; break; }
      }
      const consumed = best ? ('#' + words.slice(0, bestLen).join(' ')) : ('#' + words[0]);
      const idx = norm(s).indexOf(consumed); if (idx >= 0) s = s.slice(0, idx) + ' ' + s.slice(idx + consumed.length);
      if (best) out.projectId = best.id; else out.unknownProject = words[0];
    }
    out.title = s.replace(/\s+/g, ' ').trim();
    return out;
  }

  // ---------- Cập nhật ----------

    if (patch.status === 'done' && before.status !== 'done') t.completedAt = new Date().toISOString();
    if (!(opts && opts.silentRender)) renderAll();
    try {
      const r = await post('/api/portal-work-save-task', { id, ...patch });
      Object.assign(t, r.task);
      if (r.spawned) { D.tasks.unshift(r.spawned); toast(`Đã xong. Lần tiếp theo: ${fmtDue(r.spawned.dueDate)}`); }
      else if (opts && opts.msg) toast(opts.msg, opts.undo ? { undo: () => update(id, opts.undo) } : undefined);
      if (!(opts && opts.silentRender)) renderAll(); else { renderSide(); }
    } catch (e) { Object.assign(t, before); renderAll(); toast(e.message, { error: true }); }
  }
