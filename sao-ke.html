<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sao Kê Minh Bạch - DR SOLUTIONS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f8fafc; color: #1e293b; }
    header { background: #0f172a; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #cbd5e1; text-decoration: none; margin-left: 1.5rem; font-weight: 500; font-size: 0.95rem; }
    nav a:hover, nav a.active { color: #38bdf8; }
    .container { max-width: 1100px; margin: 2.5rem auto; padding: 0 1rem; }
    h1 { font-size: 2rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; color: #0f172a; display: flex; align-items: center; gap: 0.75rem; }
    .toolbar { background: #fff; padding: 1rem 1.5rem; border-radius: 10px 10px 0 0; border: 1px solid #e2e8f0; border-bottom: none; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .search-box input { padding: 0.6rem 1rem; width: 300px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .search-box input:focus { border-color: #0284c7; }
    .stats { font-size: 0.9rem; color: #64748b; font-weight: 500; }
    .table-container { background: #fff; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); overflow: hidden; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.85rem 1.25rem; font-size: 0.9rem; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #0f172a; font-weight: 600; }
    tr:hover { background: #f8fafc; }
    .amount-in { color: #166534; font-weight: 600; }
    .pagination { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #fff; border-top: 1px solid #e2e8f0; border-radius: 0 0 10px 10px; }
    .pagination button { padding: 0.5rem 1rem; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .pagination button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .pagination button:hover:not(:disabled) { background: #0369a1; }
    .page-info { font-size: 0.9rem; color: #64748b; }
    footer { background: #0f172a; color: #94a3b8; text-align: center; padding: 2rem; margin-top: 4rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div style="font-weight: 700; font-size: 1.25rem; color: #fff;">
      <i class="fa-solid fa-hands-holding-child"></i> DR SOLUTIONS
    </div>
    <nav>
      <a href="index.html"><i class="fa-solid fa-house"></i> Trang Chủ</a>
      <a href="hoat-dong.html"><i class="fa-solid fa-newspaper"></i> Hoạt Động</a>
      <a href="sao-ke.html" class="active"><i class="fa-solid fa-file-invoice-dollar"></i> Sao Kê</a>
      <a href="lien-he.html"><i class="fa-solid fa-envelope"></i> Liên Hệ</a>
    </nav>
  </header>

  <div class="container">
    <h1><i class="fa-solid fa-shield-halved"></i> Sao Kê Giao Dịch Minh Bạch (1508 Giao Dịch)</h1>
    
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm nội dung, mã giao dịch..." oninput="filterData()">
      </div>
      <div class="stats" id="statsText">Đang hiển thị...</div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 12%;">STT</th>
            <th style="width: 20%;">Ngày Giao Dịch</th>
            <th style="width: 48%;">Nội Dung Chuyển Khoản</th>
            <th style="width: 20%; text-align: right;">Số Tiền (VNĐ)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="4" style="text-align: center; color: #64748b; padding: 2rem;">
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu 1508 giao dịch...
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)"><i class="fa-solid fa-arrow-left"></i> Trang Trước</button>
        <span class="page-info" id="pageInfo">Trang 1 / 1</span>
        <button id="nextBtn" onclick="changePage(1)">Trang Sau <i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 DR SOLUTIONS. Cổng thông tin thiện nguyện và giáo dục cộng đồng.</p>
  </footer>

  <script>
    let allTransactions = [];
    let filteredData = [];
    let currentPage = 1;
    const pageSize = 20; // Hiển thị 20 giao dịch mỗi trang cho gọn gàng

    // Tạo dữ liệu giả lập 1508 giao dịch thực tế để test hệ thống phân trang
    function generateTransactions() {
      const sampleNames = ["Nguyễn Văn A ủng hộ quỹ học liệu", "Trần Thị B tài trợ tủ sách", "Công ty X chung tay vì cộng đồng", "Mạnh thường quân ẩn danh ủng hộ", "Lê Văn C góp quỹ thiện nguyện hè", "Phạm Thị D ủng hộ học sinh khó khăn"];
      const generated = [];
      
      for (let i = 1; i <= 1508; i++) {
        const randomName = sampleNames[Math.floor(Math.random() * sampleNames.length)];
        const randomAmount = (Math.floor(Math.random() * 50) + 1) * 50000; // Số tiền từ 50k đến 2.5tr
        const day = String((i % 28) + 1).padStart(2, '0');
        const month = String(((i % 12) + 1)).padStart(2, '0');
        
        generated.push({
          id: i,
          date: `${day}/${month}/2026`,
          content: `${randomName} - GD #${100000 + i}`,
          amount: randomAmount.toLocaleString('vi-VN') + " đ"
        });
      }
      return generated;
    }

    // Khởi tạo dữ liệu
    allTransactions = generateTransactions();
    filteredData = allTransactions;

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredData.slice(start, end);

      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 2rem;">Không tìm thấy giao dịch phù hợp.</td></tr>`;
        document.getElementById('pageInfo').innerText = `Trang 0 / 0`;
        document.getElementById('statsText').innerText = `Tổng số: 0 giao dịch`;
        return;
      }

      let html = '';
      pageData.forEach(tx => {
        html += `
          <tr>
            <td>#${tx.id}</td>
            <td><i class="fa-regular fa-calendar"></i> ${tx.date}</td>
            <td>${tx.content}</td>
            <td style="text-align: right;" class="amount-in">+${tx.amount}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;

      // Cập nhật thông tin phân trang
      const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
      document.getElementById('pageInfo').innerText = `Trang ${currentPage} / ${totalPages}`;
      document.getElementById('statsText').innerText = `Hiển thị ${start + 1} - ${Math.min(end, filteredData.length)} trên tổng số ${filteredData.length} giao dịch`;

      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      const totalPages = Math.ceil(filteredData.length / pageSize);
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      if (currentPage > totalPages) currentPage = totalPages;
      renderTable();
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    function filterData() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      filteredData = allTransactions.filter(tx => 
        tx.content.toLowerCase().includes(keyword) || tx.date.includes(keyword)
      );
      currentPage = 1; // Reset về trang 1 khi tìm kiếm
      renderTable();
    }

    // Chạy lần đầu
    renderTable();
  </script>
</body>
</html>
