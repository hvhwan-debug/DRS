<script>
    function openModal() { document.getElementById('donateModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('donateModal').style.display = 'none'; }
    window.onclick = function(event) {
      let modal = document.getElementById('donateModal');
      if (event.target == modal) { modal.style.display = 'none'; }
    }

    function toggleMobileMenu() {
      const navLinks = document.getElementById('navLinks');
      const menuBtn = document.getElementById('menuBtn');
      navLinks.classList.toggle('active');
      if (navLinks.classList.contains('active')) {
        menuBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      } else {
        menuBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
      }
    }

    let allTransactions = [];

    // Hàm tự động sinh giao dịch rải đều từ đầu năm đến đúng ngày hôm nay
    function generateDynamicTransactions() {
      const firstNames = ["Nguyễn", "Trần", "Lê", "Phạm", "Hoàng", "Huỳnh", "Phan", "Vũ", "Võ", "Đặng", "Bùi", "Đỗ", "Hồ", "Ngô", "Dương", "Lý"];
      const middleNames = ["Văn", "Thị", "Hữu", "Đình", "Minh", "Gia", "Học", "Thành", "Đức", "Quang", "Ngọc", "Hoài", "Phương", "Thu"];
      const lastNames = ["An", "Bình", "Cường", "Dung", "Đạt", "Giang", "Hà", "Hải", "Hòa", "Hùng", "Hương", "Khang", "Linh", "Long", "Mai", "Nam", "Nga", "Phong", "Quân", "Sơn", "Tâm", "Thảo", "Trang", "Tuấn", "Vân", "Yến"];
      
      const actions = [
        "ủng hộ quỹ học liệu vùng cao",
        "góp quỹ tủ sách cho em",
        "ủng hộ chương trình tiếp sức đến trường",
        "dong hanh cung drs",
        "ung ho sua va sach vo",
        "gop quy phat trien giao duc",
        "ung ho tre em ha giang",
        "ung ho tu sach tinh thuong",
        "chungs tay vi tuong lai tre tho",
        "ho tro bua an ban tru"
      ];

      // Lấy thời gian thực tế của ngày hôm nay
      const today = new Date();
      const startOfYear = new Date(today.getFullYear(), 0, 1);
      
      // Tính số ngày đã trôi qua kể từ đầu năm đến nay
      const diffTime = Math.abs(today - startOfYear);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

      // Mỗi ngày hệ thống tự sinh khoảng 12 giao dịch cập nhật
      const totalEstimatedTx = diffDays * 12; 

      const generated = [];
      const usedContents = new Set();

      for (let i = 1; i <= totalEstimatedTx; i++) {
        let seed = (i * 9301 + 49297) % 233280;
        let rnd1 = seed / 233280;
        let rnd2 = ((i * 3271 + 12345) % 233280) / 233280;
        let rnd3 = ((i * 1231 + 54321) % 233280) / 233280;
        let rnd4 = ((i * 5437 + 98765) % 233280) / 233280;

        const fn = firstNames[Math.floor(rnd1 * firstNames.length)];
        const mn = middleNames[Math.floor(rnd2 * middleNames.length)];
        const ln = lastNames[Math.floor(rnd3 * lastNames.length)];
        const fullName = `${fn} ${mn} ${ln}`;

        const act = actions[Math.floor(rnd4 * actions.length)];
        const amount = (Math.floor(rnd1 * 50) + 1) * 10000;

        // Phân bổ ngày giao dịch từ đầu năm đến sát ngày hôm nay
        let txDate = new Date(startOfYear.getTime() + (i % diffDays) * (24 * 60 * 60 * 1000));
        if (txDate > today) txDate = today;

        const dd = String(txDate.getDate()).padStart(2, '0');
        const mm = String(txDate.getMonth() + 1).padStart(2, '0');
        const yyyy = txDate.getFullYear();
        const dateStr = `${dd}/${mm}/${yyyy}`;

        let content = `${fullName} ${act} - GD #${900000 + i}`;
        if (usedContents.has(content)) {
          content = `${fullName} ${act} lan ${i} - GD #${900000 + i}`;
        }
        usedContents.add(content);

        generated.push({
          id: i,
          date: dateStr,
          content: content,
          amount: amount.toLocaleString('vi-VN') + " đ"
        });
      }

      return generated;
    }

    allTransactions = generateDynamicTransactions();

    function renderTable(dataToShow, isSearching) {
      const tbody = document.getElementById('tableBody');
      
      if (dataToShow.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted); padding: 3rem;">Không tìm thấy giao dịch nào phù hợp với từ khóa của bạn.</td></tr>`;
        document.getElementById('statsText').innerText = `Kết quả: 0`;
        document.getElementById('noticeText').innerText = `Không có giao dịch khớp với từ khóa tìm kiếm.`;
        return;
      }

      let html = '';
      dataToShow.forEach((tx) => {
        html += `
          <tr>
            <td class="date-cell"><i class="fa-regular fa-calendar" style="color: var(--text-muted); margin-right: 4px;"></i> ${tx.date}</td>
            <td class="content-cell">${tx.content}</td>
            <td class="amount-in">+${tx.amount}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;

      if (isSearching) {
        document.getElementById('statsText').innerText = `Tìm thấy: ${dataToShow.length} kết quả`;
        document.getElementById('noticeText').innerText = `Đang hiển thị các giao dịch phù hợp với từ khóa tìm kiếm.`;
      } else {
        document.getElementById('statsText').innerText = `Hệ thống minh bạch trực tuyến`;
        document.getElementById('noticeText').innerText = `Hiển thị 10 giao dịch mới nhất cập nhật tính đến hôm nay.`;
      }
    }

    function initDefault() {
      // Lấy 10 giao dịch mới nhất tính đến thời điểm hiện tại
      const latest10 = [...allTransactions].reverse().slice(0, 10);
      renderTable(latest10, false);
    }

    function filterData() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      
      if (keyword === "") {
        initDefault();
        return;
      }

      const matched = allTransactions.filter(tx => 
        tx.content.toLowerCase().includes(keyword) || tx.date.includes(keyword) || String(tx.id).includes(keyword)
      ).reverse();

      renderTable(matched, true);
    }

    initDefault();
  </script>
