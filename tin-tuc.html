<script>
    function openModal() { document.getElementById('donateModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('donateModal').style.display = 'none'; }
    window.onclick = function(event) {
      let modal = document.getElementById('donateModal');
      if (event.target == modal) { modal.style.display = 'none'; }
    }

    function toggleMobileMenu() {
      const navLinks = document.getElementById('navLinks');
      const menuBtn = document.getElementById('menuBtn');
      navLinks.classList.toggle('active');
      if (navLinks.classList.contains('active')) {
        menuBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      } else {
        menuBtn.innerHTML = '<i class="fa-solid fa-bars"></i>';
      }
    }

    const fallbackNews = [
      { filename: "giao-duc-vung-cao.md", title: "Giáo dục vùng cao: Khi một cơ hội đến trường có thể mở ra một tương lai khác", date: "Tháng 09 / 2026", description: "Khoảng cách địa lý và hoàn cảnh khó khăn có thể biến việc đến trường thành một thử thách...", thumbnail: "https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600&auto=format&fit=crop&q=80" },
      { filename: "minh-bach-trong-tu-thien.md", title: "Minh bạch trong từ thiện: Đừng chỉ nói về lòng tốt, hãy nói về cách sử dụng nguồn lực", date: "Tháng 09 / 2026", description: "Trong hoạt động từ thiện, lòng tốt là điểm khởi đầu, nhưng minh bạch mới là nền tảng để duy trì niềm tin.", thumbnail: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=600&auto=format&fit=crop&q=80" },
      { filename: "thien-nguyen-ha-giang.md", title: "Sắp diễn ra chương trình thiện nguyện vì trẻ em đến trường tại Hà Giang", date: "Tháng 11 / 2026", description: "Một chương trình thiện nguyện hướng tới trẻ em vùng cao Hà Giang dự kiến sẽ được tổ chức trong thời gian tới.", thumbnail: "https://images.unsplash.com/photo-1578592829571-d8fb2f9d2d65?w=600&auto=format&fit=crop&q=80" }
    ];

    let allPosts = [];
    let currentPage = 1;
    const itemsPerPage = 9;

    // Hàm chuyển đổi chuỗi ngày tháng (ví dụ: "Tháng 11 / 2026") thành số để sắp xếp chuẩn xác
    function parseDateString(dateStr) {
      if (!dateStr) return 0;
      let match = dateStr.match(/Tháng\s*(\d+)\s*\/\s*(\d+)/i);
      if (match) {
        let month = parseInt(match[1], 10);
        let year = parseInt(match[2], 10);
        return year * 100 + month; // Ví dụ: Tháng 11/2026 -> 202611 lớn hơn Tháng 9/2026 -> 202609
      }
      return 0;
    }

    async function fetchGitHubNews() {
      const repo = 'hvhwan-debug/DRS';
      const apiURL = `https://api.github.com/repos/${repo}/contents/content/posts`;

      const grid = document.getElementById('newsGrid');
      grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; color: #0284c7; margin-bottom: 0.5rem;"></i><br>Đang đồng bộ kho tin tức...</div>`;

      try {
        const response = await fetch(apiURL);
        if (response.ok) {
          const files = await response.json();
          const mdFiles = files.filter(f => f.name.endsWith('.md'));
          
          if (mdFiles.length > 0) {
            for (const file of mdFiles) {
              try {
                const fileRes = await fetch(file.download_url);
                const text = await fileRes.text();
                const parts = text.split('---');
                let title = file.name.replace('.md', '').replace(/-/g, ' ');
                let date = 'Tháng 2026';
                let desc = 'Cập nhật thông tin chi tiết từ ban điều phối dự án...';
                let thumbnail = 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=600&auto=format&fit=crop&q=80';

                if (parts.length >= 3) {
                  const yamlMeta = parts[1];
                  const titleMatch = yamlMeta.match(/title:\s*"?(.*?)"?$/m);
                  const dateMatch = yamlMeta.match(/date:\s*"?(.*?)"?$/m);
                  const descMatch = yamlMeta.match(/description:\s*"?(.*?)"?$/m);
                  const thumbMatch = yamlMeta.match(/thumbnail:\s*"?(.*?)"?$/m);

                  if (titleMatch) title = titleMatch[1].replace(/["']/g, '');
                  if (dateMatch) date = dateMatch[1].replace(/["']/g, '');
                  if (descMatch) desc = descMatch[1].replace(/["']/g, '');
                  if (thumbMatch) thumbnail = thumbMatch[1].replace(/["']/g, '');
                }
                allPosts.push({ filename: file.name, title, date, description: desc, thumbnail });
              } catch (err) {
                console.log("Lỗi đọc file: ", file.name);
              }
            }
          }
        }
      } catch (e) {
        console.log("Lỗi kết nối API GitHub, dùng dữ liệu dự phòng");
      }

      if (allPosts.length === 0) {
        allPosts = fallbackNews;
      }

      // SẮP XẾP TỰ ĐỘNG: Bài có tháng/năm mới nhất sẽ nằm ở vị trí đầu tiên lên đầu trang
      allPosts.sort((a, b) => parseDateString(b.date) - parseDateString(a.date));

      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const grid = document.getElementById('newsGrid');
      const paginationBox = document.getElementById('paginationBox');

      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedItems = allPosts.slice(start, end);

      if (paginatedItems.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">Không có tin tức nào.</div>`;
        paginationBox.innerHTML = '';
        return;
      }

      let html = '';
      paginatedItems.forEach(post => {
        let detailLink = `chi-tiet.html?post=${post.filename}`;

        html += `
          <div class="news-card">
            <div class="news-img-box">
              <img src="${post.thumbnail}" alt="${post.title}">
            </div>
            <div class="news-content">
              <span class="news-date"><i class="fa-regular fa-calendar"></i> ${post.date}</span>
              <h3>${post.title}</h3>
              <p>${post.description}</p>
              <a href="${detailLink}" class="news-link">Đọc chi tiết <i class="fa-solid fa-arrow-right"></i></a>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;

      const totalPages = Math.ceil(allPosts.length / itemsPerPage);
      if (totalPages <= 1) {
        paginationBox.innerHTML = '';
        return;
      }

      let pagHTML = '';
      pagHTML += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="renderPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
      
      for (let i = 1; i <= totalPages; i++) {
        pagHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }

      pagHTML += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="renderPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
      paginationBox.innerHTML = pagHTML;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    fetchGitHubNews();
  </script>
