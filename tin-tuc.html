    let currentPage = 1;
    const itemsPerPage = 9;

    function renderPage(page) {
      currentPage = page;
      const grid = document.getElementById('newsGrid');
      const paginationBox = document.getElementById('paginationBox');

      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedItems = allPosts.slice(start, end);

      if (paginatedItems.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">Không có tin tức nào.</div>`;
        paginationBox.innerHTML = '';
        return;
      }

      let html = '';
      paginatedItems.forEach(post => {
        let detailLink = `chi-tiet.html?post=${post.filename}`;

        html += `
          <div class="news-card">
            <div class="news-img-box">
              <img src="${post.thumbnail}" alt="${post.title}">
            </div>
            <div class="news-content">
              <span class="news-date"><i class="fa-regular fa-calendar"></i> ${post.date}</span>
              <h3>${post.title}</h3>
              <p>${post.description}</p>
              <a href="${detailLink}" class="news-link">Đọc chi tiết <i class="fa-solid fa-arrow-right"></i></a>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;

      const totalPages = Math.ceil(allPosts.length / itemsPerPage);
      if (totalPages <= 1) {
        paginationBox.innerHTML = '';
        return;
      }

      let pagHTML = '';
      pagHTML += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="renderPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
      
      for (let i = 1; i <= totalPages; i++) {
        pagHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }

      pagHTML += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="renderPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
      paginationBox.innerHTML = pagHTML;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Hiển thị ngay lập tức toàn bộ danh sách bài viết một cách mượt mà
