<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lạc đường rồi! - Wisdom Vietnam Network</title>
  <!-- Favicon chuẩn trực tuyến -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%230284c7%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z%22></path><path d=%22M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z%22></path></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --blue-grad-primary: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%);
      --blue-grad-btn: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      --blue-grad-btn-hover: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      background: #ffffff;
      padding: 3.5rem 2.5rem;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
      max-width: 520px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    /* Hiệu ứng hoạt hình dễ thương cho icon */
    .cute-illustration {
      font-size: 4.5rem;
      color: #0284c7;
      margin-bottom: 1rem;
      animation: bounceFloat 2s ease-in-out infinite;
    }
    @keyframes bounceFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .error-code {
      font-size: 4.5rem;
      font-weight: 900;
      background: var(--blue-grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.75rem; color: #0f172a; }
    p { font-size: 0.98rem; color: #475569; margin-bottom: 2rem; line-height: 1.6; }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--blue-grad-btn); color: #ffffff;
      padding: 0.8rem 1.8rem; border-radius: 12px; font-weight: 700;
      text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25); transition: all 0.2s; font-size: 0.95rem;
    }
    .btn:hover { background: var(--blue-grad-btn-hover); transform: translateY(-2px); }
    .btn-outline {
      background: #f0f9ff; color: #0284c7; border: 1.5px solid #bae6fd;
      box-shadow: none;
    }
    .btn-outline:hover { background: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

  <div class="error-card">
    <!-- Hình ảnh icon hoạt hình dễ thương biểu trưng cho việc tìm kiếm tri thức -->
    <div class="cute-illustration">
      <i class="fa-solid fa-map-location-dot"></i>
    </div>
    <div class="error-code">404</div>
    <h1>Úm ba la... Trang này đi lạc mất rồi!</h1>
    <p>Có vẻ như đường dẫn bạn vừa bấm không tồn tại hoặc đã được chuyển đi nơi khác. Mời bạn ghé thăm lại trang chủ để tiếp tục hành trình nhé!</p>
    
    <div class="btn-group">
      <a href="index.html" class="btn">
        <i class="fa-solid fa-house"></i> Về Trang Chủ Thôi
      </a>
      <a href="hoat-dong.html" class="btn btn-outline">
        <i class="fa-solid fa-compass"></i> Xem Hoạt Động
      </a>
    </div>
  </div>

</body>
</html>
