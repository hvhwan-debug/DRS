<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM Học Sinh · Quản trị Tri thức Việt</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=20260927b">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  // Chặn sớm: chưa có phiên quản trị thì về trang đăng nhập trước khi vẽ giao diện.
  if (!localStorage.getItem('wvn_admin_token')) window.location.replace('admin-dang-nhap.html');
</script>
<style>
:root {
  --ink: #0f172a;
  --ink-2: #334155;
  --muted: #64748b;
  --line: #e2e8f0;
  --paper: #f8fafc;
  --surface: #ffffff;
  --brand: #0369a1;
  --brand-2: #0284c7;
  --brand-soft: #e0f2fe;
  --green: #2f7a4f;  --green-soft: #e7f4ec;
  --amber: #a15c07;  --amber-soft: #fdf1dc;
  --red: #b42318;    --red-soft: #fdecea;
  --violet: #5b4bb7; --violet-soft: #efedfb;
  --radius-s: 6px; --radius-m: 10px; --radius-l: 16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Khung ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0284c7 100%); color: #fff; }
.topbar-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1.25rem; }
/* Logo W + chữ tên phân hệ */
.brand { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: #fff; white-space: nowrap; padding-right: 1rem; margin-right: 0.2rem; border-right: 1px solid rgba(255,255,255,0.1); }
.brand .mark { width: 38px; height: auto; flex-shrink: 0; filter: drop-shadow(0 3px 10px rgba(0,150,255,0.45)); transition: transform .25s ease, filter .25s ease; }
.brand:hover .mark { transform: translateY(-1px) scale(1.04); filter: drop-shadow(0 5px 14px rgba(0,170,255,0.6)); }
.brand .word { display: flex; flex-direction: column; line-height: 1.1; }
.brand .word b { font-size: 1.08rem; font-weight: 800; letter-spacing: -0.3px; color: #fff; }
.brand .word b em { font-style: normal; font-weight: 800; background: linear-gradient(90deg, #38d2ff, #8fe46a); -webkit-background-clip: text; background-clip: text; color: transparent; margin-left: 0.25rem; }
.brand .word small { font-size: 0.58rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.6; padding-top: 1px; color: #8fa6cc; }
.search { flex: 1; max-width: 460px; margin-left: auto; position: relative; }
.search input { width: 100%; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); color: #fff; border-radius: 999px; padding: 0.5rem 0.9rem 0.5rem 2.2rem; }
.search input::placeholder { color: #9fb4d6; }
.search i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #9fb4d6; font-size: 0.85rem; }
.top-actions { display: flex; align-items: center; gap: 0.5rem; }
.who { font-size: 0.8rem; color: #c7d5ea; white-space: nowrap; }
.top-link { color: #c7d5ea; text-decoration: none; font-size: 0.82rem; padding: 0.4rem 0.7rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); white-space: nowrap; }
.top-link:hover { color: #fff; border-color: rgba(255,255,255,0.35); }

.views { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 52px; z-index: 20; }
.views-inner { max-width: 1400px; margin: 0 auto; display: flex; gap: 0.25rem; padding: 0 1.25rem; overflow-x: auto; }
.view-btn { background: none; border: none; padding: 0.85rem 0.9rem 0.75rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.view-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-2); }
.view-btn .count { font-weight: 600; font-size: 0.75rem; margin-left: 0.35rem; color: var(--muted); }
.view-btn .count.alert { color: var(--red); }

main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
.view { display: none; }
.view.active { display: block; }

.btn { display: inline-flex; align-items: center; gap: 0.45rem; border-radius: var(--radius-s); padding: 0.5rem 0.9rem; font-weight: 600; font-size: 0.88rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: #c3cfdd; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #075985; border-color: #075985; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); background: var(--paper); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* ---------- Tổng quan ---------- */
.overview-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.overview-head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.4px; }
.overview-head p { color: var(--muted); font-size: 0.9rem; }

.pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); margin-bottom: 1.5rem; }
.pulse > div { padding: 1rem 1.2rem; border-left: 1px solid var(--line); }
.pulse > div:first-child { border-left: none; }
.pulse b { display: block; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
.pulse small { color: var(--muted); font-size: 0.82rem; }
.pulse .warn b { color: var(--red); }

/* Dải hành trình: thành phần nổi bật nhất của CRM, dùng ở tổng quan và trong hồ sơ */
.journey { display: flex; gap: 3px; margin-bottom: 1.5rem; }
.journey-step { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); padding: 0.85rem 1rem 0.8rem; text-align: left; position: relative; }
.journey-step:first-child { border-radius: var(--radius-l) 0 0 var(--radius-l); }
.journey-step:last-child { border-radius: 0 var(--radius-l) var(--radius-l) 0; }
.journey-step::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); opacity: 0.85; }
.journey-step:first-child::before { border-top-left-radius: var(--radius-l); }
.journey-step:last-child::before { border-top-right-radius: var(--radius-l); }
.journey-step b { display: block; font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
.journey-step span { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.journey-step:hover { background: var(--paper); }

.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.25rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--line); gap: 0.5rem; }
.panel-head h2 { font-size: 0.98rem; font-weight: 700; }
.panel-head .hint { font-size: 0.8rem; color: var(--muted); }
.panel-body { padding: 0.35rem 0; }
.row-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.65rem 1.1rem; width: 100%; background: none; border: none; text-align: left; border-bottom: 1px solid #eef2f7; }
.row-item:last-child { border-bottom: none; }
.row-item:hover { background: var(--paper); }
.row-main { flex: 1; min-width: 0; }
.row-main strong { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { color: var(--muted); font-size: 0.8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 1.6rem 1.1rem; color: var(--muted); font-size: 0.88rem; }
.empty strong { color: var(--ink); display: block; margin-bottom: 0.2rem; }

.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; background: var(--brand-soft); color: var(--brand); }

/* Nhãn */
.chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.74rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.stage { border: none; background: var(--cs); color: var(--c); }
.chip.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.chip.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.flags { display: flex; gap: 0.3rem; flex-wrap: wrap; }

/* ---------- Danh sách ---------- */
.toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
.toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 0.45rem 0.6rem; font-size: 0.86rem; }
.toolbar .spacer { flex: 1; }
.toolbar .result { font-size: 0.84rem; color: var(--muted); }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { text-align: left; font-size: 0.78rem; font-weight: 600; color: var(--muted); padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--line); background: #fafcfe; white-space: nowrap; }
th button { background: none; border: none; font-weight: 600; color: inherit; display: inline-flex; gap: 0.3rem; align-items: center; }
td { padding: 0.65rem 0.9rem; border-bottom: 1px solid #eef2f7; vertical-align: middle; font-size: 0.88rem; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--paper); }
tbody tr:last-child td { border-bottom: none; }
.name-cell { display: flex; align-items: center; gap: 0.7rem; }
.name-cell strong { font-weight: 600; display: block; }
.name-cell small { color: var(--muted); font-size: 0.78rem; }
.overdue { color: var(--red); font-weight: 600; }
.soon { color: var(--amber); font-weight: 600; }

/* ---------- Theo giai đoạn ---------- */
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 0.8rem; overflow-x: auto; padding-bottom: 0.5rem; }
.column { background: #edf2f8; border-radius: var(--radius-l); display: flex; flex-direction: column; min-height: 320px; }
.column-head { padding: 0.8rem 0.9rem 0.6rem; display: flex; align-items: center; gap: 0.5rem; }
.column-head::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.column-head strong { font-size: 0.88rem; }
.column-head span { margin-left: auto; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.column-body { padding: 0 0.55rem 0.6rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; border-radius: var(--radius-l); transition: background 0.15s; }
.column.drop .column-body { background: rgba(2,132,199,0.08); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.65rem 0.75rem; text-align: left; width: 100%; }
.card:hover { border-color: #b9c8da; }
.card.dragging { opacity: 0.45; }
.card strong { display: block; font-weight: 600; font-size: 0.9rem; }
.card small { display: block; color: var(--muted); font-size: 0.77rem; margin: 0.1rem 0 0.4rem; }

/* ---------- Lịch chăm sóc ---------- */
.agenda { display: grid; gap: 1.25rem; }
.agenda-group h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; display: flex; gap: 0.5rem; align-items: center; }
.agenda-group h3 span { color: var(--muted); font-weight: 500; }

/* ---------- Ngăn hồ sơ ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,30,61,0.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 50; transform: translateX(100%); transition: transform 0.25s ease, visibility 0.25s; visibility: hidden; display: flex; flex-direction: column; }
.drawer.open { transform: none; visibility: visible; box-shadow: -12px 0 40px rgba(15,30,61,0.15); }
.drawer-head { padding: 1.1rem 1.3rem 0.9rem; border-bottom: 1px solid var(--line); }
.drawer-title { display: flex; align-items: flex-start; gap: 0.85rem; }
.drawer-title .avatar { width: 46px; height: 46px; font-size: 1rem; }
.drawer-title h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.3px; line-height: 1.25; }
.drawer-title p { color: var(--muted); font-size: 0.84rem; }
.drawer-close { margin-left: auto; background: none; border: none; width: 36px; height: 36px; border-radius: 50%; color: var(--muted); font-size: 1.1rem; }
.drawer-close:hover { background: var(--paper); color: var(--ink); }

.rail { display: flex; margin-top: 1rem; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.rail button { flex: 1; min-width: 0; background: none; border: none; border-left: 1px solid var(--line); padding: 0.45rem 0.3rem; font-size: 0.76rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail button:first-child { border-left: none; }
.rail button:hover { color: var(--ink); background: var(--paper); }
.rail button.passed { color: var(--c); background: var(--cs); }
.rail button.current { color: #fff; background: var(--c); }

.drawer-tabs { display: flex; gap: 0.2rem; padding: 0 1.3rem; border-bottom: 1px solid var(--line); }
.drawer-tabs button { background: none; border: none; padding: 0.7rem 0.7rem 0.6rem; font-weight: 600; font-size: 0.86rem; color: var(--muted); border-bottom: 2px solid transparent; }
.drawer-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-2); }
.drawer-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.3rem 2rem; }
.drawer-pane { display: none; }
.drawer-pane.active { display: block; }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.2rem 1.2rem; margin-bottom: 1.2rem; }
.facts div { padding: 0.45rem 0; border-bottom: 1px dashed #e6ecf3; min-width: 0; }
.facts dt { font-size: 0.75rem; color: var(--muted); }
.facts dd { font-weight: 500; overflow-wrap: anywhere; }
.facts a { color: var(--brand); text-decoration: none; }

.log-form { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.85rem; margin-bottom: 1.3rem; background: #fafcfe; }
.type-pills { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.type-pills label { cursor: pointer; }
.type-pills input { position: absolute; opacity: 0; pointer-events: none; }
.type-pills span { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; padding: 0.3rem 0.65rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.type-pills input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
.type-pills input:focus-visible + span { outline: 2px solid var(--brand-2); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
.field label { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.5rem 0.65rem; background: var(--surface); width: 100%; }
.field textarea { resize: vertical; min-height: 72px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(2,132,199,0.14); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; }
.form-grid .full { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.8rem; align-items: center; }
.form-actions .note { margin-right: auto; font-size: 0.78rem; color: var(--muted); }
.fieldset-title { font-size: 0.85rem; font-weight: 700; margin: 1.3rem 0 0.6rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.fieldset-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }

.timeline { list-style: none; position: relative; }
.timeline::before { content: ""; position: absolute; left: 15px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding: 0 0 1.1rem 2.6rem; }
.timeline .dot { position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; color: var(--ink-2); font-size: 0.78rem; }
.timeline .meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.timeline .meta b { color: var(--ink); font-weight: 600; }
.timeline p { margin-top: 0.2rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.timeline .outcome { margin-top: 0.35rem; font-size: 0.84rem; color: var(--green); }
.timeline .del { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0.3rem; border-radius: 4px; }
.timeline .del:hover { color: var(--red); background: var(--red-soft); }

.stat-blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; margin-bottom: 1rem; }
.stat-block { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.8rem 0.9rem; }
.stat-block h4 { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-bottom: 0.3rem; display: flex; gap: 0.4rem; align-items: center; }
.stat-block b { font-size: 1.2rem; font-weight: 800; display: block; }
.stat-block small { font-size: 0.78rem; color: var(--muted); display: block; }
.locked { color: var(--muted); font-size: 0.8rem; }
.callout { background: var(--brand-soft); color: #0b4a6f; border-radius: var(--radius-m); padding: 0.75rem 0.9rem; font-size: 0.85rem; }

/* Lựa chọn 1 chạm */
.opts { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.opt { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 0.38rem 0.8rem; font-size: 0.84rem; font-weight: 500; line-height: 1.2; }
.opt:hover { border-color: #b9c8da; color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.opt.add { border-style: dashed; color: var(--muted); }
.opt-input { border: 1px solid var(--line); border-radius: 999px; padding: 0.36rem 0.8rem; font-size: 0.84rem; min-width: 150px; }
.opt-input:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(2,132,199,0.14); }
.q { margin-bottom: 1rem; }
.q > .q-label { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.4rem; display: flex; gap: 0.5rem; align-items: baseline; }
.q-label .src { font-weight: 500; color: var(--green); font-size: 0.74rem; }
.save-state { font-size: 0.78rem; color: var(--muted); display: inline-flex; align-items: center; gap: 0.35rem; }
.save-state.saving { color: var(--brand); }
.save-state.err { color: var(--red); }
.quicklog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem; margin-bottom: 1rem; }
.quicklog button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-m); padding: 0.6rem 0.7rem; font-size: 0.84rem; display: flex; gap: 0.55rem; align-items: center; }
.quicklog button:hover { border-color: var(--brand-2); background: var(--brand-soft); }
.quicklog i { color: var(--brand); width: 1rem; text-align: center; }
.quicklog small { display: block; color: var(--muted); font-size: 0.74rem; }
details.more > summary { cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--brand); margin-bottom: 0.7rem; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }

/* Gọi điện / Zalo */
.contact { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
.contact a { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; padding: 0.5rem 0.9rem; border-radius: 999px; font-weight: 600; font-size: 0.86rem; text-decoration: none; border: 1px solid transparent; white-space: nowrap; }
/* Nút liên hệ trong hồ sơ: một hàng thẳng dưới tên, không bị rơi dòng */
.d-contact { padding-left: calc(46px + 0.85rem); }
.d-contact .contact { flex-wrap: nowrap; }
.d-contact .contact .sms, .d-contact .contact .mail { padding-left: 0.8rem; padding-right: 0.8rem; }
@media (max-width: 560px) {
  .d-contact { padding-left: 0; }
  .d-contact .contact { display: grid; grid-template-columns: 1fr 1fr; }
}

/* ---------- Thông báo & trạng thái tải ---------- */

<script>
(function () {
  'use strict';

  const token = localStorage.getItem('wvn_admin_token');

  const STAGES = [
    { key: 'tiem-nang',  label: 'Tiềm năng',  c: '#5b4bb7', cs: '#efedfb' },
    { key: 'hoc-thu',    label: 'Học thử',    c: '#0284c7', cs: '#e6f3fb' },
    { key: 'dang-hoc',   label: 'Đang học',   c: '#2f7a4f', cs: '#e7f4ec' },
    { key: 'tam-nghi',   label: 'Tạm nghỉ',   c: '#a15c07', cs: '#fdf1dc' },
    { key: 'da-nghi',    label: 'Đã nghỉ',    c: '#8a94a6', cs: '#eef1f5' },
    { key: 'hoan-thanh', label: 'Hoàn thành', c: '#0f1e3d', cs: '#e3e8f0' }
  ];
  const STAGE = Object.fromEntries(STAGES.map(s => [s.key, s]));
  const DEFAULT_STAGE = 'dang-hoc';

  const TYPES = [
    { key: 'goi-dien', label: 'Gọi điện', icon: 'fa-phone' },
    { key: 'zalo', label: 'Zalo', icon: 'fa-comment-dots' },
    { key: 'sms', label: 'SMS', icon: 'fa-comment-sms' },
    { key: 'gap-mat', label: 'Gặp trực tiếp', icon: 'fa-handshake' },
    { key: 'email', label: 'Email', icon: 'fa-envelope' },
    { key: 'tham-nha', label: 'Thăm nhà', icon: 'fa-house' },
    { key: 'phan-hoi-hoc-tap', label: 'Phản hồi học tập', icon: 'fa-book-open' },
    { key: 'khac', label: 'Khác', icon: 'fa-note-sticky' }
  ];
  const TYPE = Object.fromEntries(TYPES.map(t => [t.key, t]));
  const PRIORITY = { thuong: 'Bình thường', cao: 'Cao', khan: 'Khẩn' };

  let students = [];
  let access = { grades: false, tuition: false, attendance: false };
  let me = { displayName: '' };
  let suggestions = { caretakers: [], schools: [], tags: [] };
  let state = { view: 'overview', q: '', stage: '', program: '', flag: '', sort: 'name', dir: 1, openId: null, pane: 'care' };

  // ---------- Tiện ích ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAY = 86400000;
  function todayStr() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function addDays(str, n) { const d = new Date(str + 'T00:00:00'); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function fmtDate(v) { if (!v) return ''; const d = new Date(v.length === 10 ? v + 'T00:00:00' : v); return isNaN(d) ? '' : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
  function relDays(v) {
    if (!v) return '';
    const d = new Date(v.length === 10 ? v + 'T00:00:00' : v); const t = new Date(todayStr() + 'T00:00:00');
    const n = Math.round((d - t) / DAY);
    if (n === 0) return 'hôm nay'; if (n === 1) return 'ngày mai'; if (n === -1) return 'hôm qua';
    return n > 0 ? `${n} ngày nữa` : `${-n} ngày trước`;
  }
  function money(n) { return (Number(n) || 0).toLocaleString('vi-VN') + ' đ'; }
  function initials(name) { const p = String(name || '?').trim().split(/\s+/); return ((p.length > 1 ? p[p.length - 2][0] : '') + p[p.length - 1][0]).toUpperCase(); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase(); }
  function toast(msg, isError) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isError ? ' error' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', isError ? 6000 : 2800); }

  async function api(path, options = {}, attempt = 0) {
    const canRetry = (!options.method || options.method === 'GET') && attempt < 2;
    let res;
    try { res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}), 'X-Admin-Token': token } }); }
    catch (e) { if (canRetry) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, options, attempt + 1); } throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
    const data = await res.json().catch(() => ({}));
    if (res.status >= 500 && (!data.message || data.retryable) && canRetry) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, options, attempt + 1); }
    if (res.status === 401) { localStorage.removeItem('wvn_admin_token'); window.location.replace('admin-dang-nhap.html'); throw new Error('Phiên đăng nhập đã hết hạn.'); }
    if (!res.ok || !data.success) throw new Error(data.message || 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
    return data;
  }

  // ---------- Suy luận trạng thái từng học sinh ----------
  function profileOf(s) { return s.profile || { stage: DEFAULT_STAGE, priority: 'thuong', tags: [] }; }
  // Giá trị hiển thị: ưu tiên dữ liệu đã nhập trong CRM, nếu trống thì lấy từ hồ sơ thành viên
  // hoặc đơn đăng ký, để không phải gõ lại những gì phụ huynh đã khai.
  // Ô "trường/lớp" trong form đăng ký thường chỉ ghi lớp ("Lớp 3", "Mầm non 4 tuổi"...) -> không
  // coi đó là tên trường, mà dùng làm gợi ý Lớp / khối.
  const looksLikeClass = v => /^\s*(l[oớ]p|kh[oố]i|m[aầ]m non|m[aẫ]u gi[aá]o|nh[aà] tr[eẻ]|mn\b|\d+\s*tu[oổ]i)/i.test(String(v || '')) && !/tr[uư][oờ]ng/i.test(String(v || ''));
  function eff(s) {
    const p = profileOf(s), par = s.parent || {}, reg = s.registration || {};
    const pSchool = looksLikeClass(p.school) ? '' : (p.school || '');
    const rSchool = looksLikeClass(reg.school) ? '' : (reg.school || '');
    return {
      guardianName: p.guardianName || par.name || '',
      guardianPhone: p.guardianPhone || par.phone || '',
      address: p.address || reg.address || par.address || '',
      school: pSchool || rSchool,
      gradeHint: !p.gradeLevel ? ([p.school, reg.school].find(looksLikeClass) || '') : '',
      nameFrom: !p.guardianName && par.name ? 'lấy từ hồ sơ phụ huynh' : '',
      phoneFrom: !p.guardianPhone && par.phone ? 'lấy từ hồ sơ phụ huynh' : '',
      schoolFrom: !pSchool && rSchool ? 'lấy từ đơn đăng ký' : '',
      addressFrom: !p.address && (reg.address || par.address) ? 'lấy từ đơn đăng ký' : ''
    };
  }
  // Chuẩn hoá số điện thoại Việt Nam về dạng 0xxxxxxxxx (dùng cho cả gọi điện và Zalo).
  function vnPhone(raw) {
    let d = String(raw || '').replace(/\D/g, '');
    if (d.startsWith('84') && d.length >= 11) d = '0' + d.slice(2);
    return d.length >= 9 ? d : '';
  }
  function contactButtons(s, size) {
    const ph = vnPhone(eff(s).guardianPhone);
    if (!ph) return size === 'mini' ? '' : `<div class="contact"><a class="nophone" href="#" data-goto-profile="1"><i class="fa-solid fa-plus" aria-hidden="true"></i> Thêm số điện thoại phụ huynh</a>${s.parentEmail ? `<a class="mail" href="#" data-compose="email" data-id="${esc(s.id)}"><i class="fa-regular fa-envelope" aria-hidden="true"></i> Email</a>` : ''}</div>`;
    const call = `<a class="call" href="tel:${ph}" data-contact="call" data-id="${esc(s.id)}" title="Gọi ${esc(ph)}" aria-label="Gọi ${esc(ph)}"><i class="fa-solid fa-phone" aria-hidden="true"></i>${size === 'mini' ? '' : ' Gọi ' + esc(ph)}</a>`;
    const zalo = `<a class="zalo" href="https://zalo.me/${ph}" target="_blank" rel="noopener" data-contact="zalo" data-id="${esc(s.id)}" data-phone="${ph}" title="Nhắn Zalo ${esc(ph)}" aria-label="Nhắn Zalo ${esc(ph)}">${size === 'mini' ? 'Zalo' : '<span class="zalo-mark">Zalo</span> Nhắn Zalo'}</a>`;
    if (size === 'mini') return `<span class="mini-contact">${call}${zalo}</span>`;
    const mail = s.parentEmail ? `<a class="mail" href="#" data-compose="email" data-id="${esc(s.id)}"><i class="fa-regular fa-envelope" aria-hidden="true"></i> Email</a>` : '';
    const sms = `<a class="sms" href="#" data-compose="sms" data-id="${esc(s.id)}"><i class="fa-solid fa-comment-sms" aria-hidden="true"></i> SMS</a>`;
    return `<div class="contact">${call}${zalo}${sms}${mail}</div>`;
  }
  // ----- Mẫu tin nhắn: {PH} người giám hộ, {HS} học sinh, {CT} chương trình, {NGUOIGUI} người gửi -----
  const MSG_TEMPLATES = [
    { key: 'lich', label: 'Nhắc lịch học',
      subject: 'Nhắc lịch học của con {HS}',
      email: 'Kính gửi {PH},\n\nTrung tâm xin nhắc lịch học sắp tới của con {HS} tại lớp {CT}. Gia đình vui lòng cho con đến đúng giờ và mang đủ đồ dùng học tập.\n\nNếu con cần nghỉ hoặc đổi lịch, gia đình trả lời email này hoặc nhắn cho trung tâm để được sắp xếp buổi học bù.\n\nTrân trọng.',
      sms: 'MLTTVN: Kinh gui {PH}, nhac lich hoc sap toi cua con {HS} lop {CT}. Can doi lich xin nhan lai so nay. Cam on!' },
    { key: 'hocphi', label: 'Nhắc học phí',
      subject: 'Thông báo học phí của con {HS}',

  }

  // ----- Bộ lựa chọn 1 chạm dùng chung -----
  const GRADE_LEVELS = ['Mầm non 3 tuổi', 'Mầm non 4 tuổi', 'Mầm non 5 tuổi', 'Lớp 1', 'Lớp 2', 'Lớp 3', 'Lớp 4', 'Lớp 5'];

  const PRESET_TAGS = ['Học bổng', 'Anh chị em cùng học', 'Cần kèm thêm', 'Học cuối tuần', 'Hoàn cảnh khó khăn', 'Năng khiếu'];
  const FOLLOW_TODO = ['Nhắc lịch học', 'Nhắc học phí', 'Báo kết quả học tập', 'Mời học thử', 'Hỏi thăm tình hình', 'Tư vấn lên lớp'];
  const FOLLOW_DAYS = [[1, 'Ngày mai'], [3, '3 ngày'], [7, '1 tuần'], [14, '2 tuần'], [30, '1 tháng']];

  function optGroup(field, values, current, opts) {
    opts = opts || {};
    const cur = Array.isArray(current) ? current : [current];
    return `<div class="opts" role="group">${values.map(v => {
      const val = Array.isArray(v) ? v[0] : v, label = Array.isArray(v) ? v[1] : v;
      return `<button type="button" class="opt" data-field="${field}" data-value="${esc(val)}" ${opts.multi ? 'data-multi="1"' : ''} aria-pressed="${cur.includes(String(val))}">${esc(label)}</button>`;
    }).join('')}${opts.other ? `<input class="opt-input" data-field="${field}" ${opts.multi ? 'data-multi="1"' : ''} placeholder="${esc(opts.other)}" ${!opts.multi && current && !values.map(v => Array.isArray(v) ? String(v[0]) : v).includes(current) ? `value="${esc(current)}"` : ''}>` : ''}</div>`;
  }
  function uniq(arr) { return Array.from(new Set(arr.filter(Boolean))); }

  function renderCare(s) {
    const p = profileOf(s), e = eff(s); const today = todayStr();
    const phone = e.guardianPhone ? e.guardianPhone.replace(/[^0-9+]/g, '') : '';
    const nextVal = p.nextFollowUp && p.nextFollowUp >= today ? p.nextFollowUp : '';
    $('pane-care').innerHTML = `
      <dl class="facts">
        <div><dt>Người giám hộ</dt><dd>${esc(e.guardianName || '—')}${p.guardianRelation ? ` (${esc(p.guardianRelation)})` : ''}</dd></div>
        <div><dt>Điện thoại</dt><dd>${phone ? `${esc(e.guardianPhone)}${contactButtons(s, 'mini')}` : '<span class="locked">Chưa có, thêm ở tab Hồ sơ</span>'}</dd></div>
        <div><dt>Email phụ huynh</dt><dd><a href="mailto:${esc(s.parentEmail)}">${esc(s.parentEmail)}</a></dd></div>
        <div><dt>Hẹn liên hệ</dt><dd class="${p.nextFollowUp && p.nextFollowUp < today ? 'overdue' : ''}">${p.nextFollowUp ? `${esc(fmtDate(p.nextFollowUp))} (${esc(relDays(p.nextFollowUp))})${p.followUpNote ? ' · ' + esc(p.followUpNote) : ''}` : '—'}</dd></div>
      </dl>
      ${flagsOf(s).length ? `<div style="margin:-0.4rem 0 1rem;">${flagChips(s)}</div>` : ''}

      ${composeHtml(s)}
      ${state.contacted && state.contacted.id === s.id ? `<div class="after-contact">
        <p><i class="fa-solid fa-${state.contacted.via === 'zalo' ? 'comment-dots' : state.contacted.via === 'sms' ? 'comment-sms' : 'phone'}" aria-hidden="true"></i> Vừa ${state.contacted.via === 'zalo' ? 'nhắn Zalo' : state.contacted.via === 'sms' ? 'mở tin nhắn SMS' : 'gọi'} cho phụ huynh. Kết quả thế nào?</p>
        <div class="opts">
          <button type="button" class="opt" data-aftercontact="ok">${state.contacted.via === 'sms' || (state.contacted.via === 'zalo' && state.contacted.text) ? 'Đã gửi tin' : 'Đã trao đổi xong'}</button>
          ${state.contacted.text ? '' : `<button type="button" class="opt" data-aftercontact="noanswer">${state.contacted.via === 'zalo' ? 'Chưa trả lời' : 'Không nghe máy'}</button>`}
          <button type="button" class="opt" data-aftercontact="detail">Ghi chi tiết</button>
          <button type="button" class="opt" data-aftercontact="skip">Bỏ qua</button>
        </div></div>` : ''}
      <div class="q-label" style="font-size:0.85rem;font-weight:700;margin-bottom:0.5rem;">Ghi nhanh 1 chạm</div>
      <div class="quicklog">
        <button type="button" data-quicklog="noanswer"><i class="fa-solid fa-phone-slash" aria-hidden="true"></i><span>Gọi không nghe máy<small>Tự hẹn gọi lại ngày mai</small></span></button>
        <button type="button" data-quicklog="schedule"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i><span>Đã nhắc lịch học<small>Hẹn lại sau 1 tuần</small></span></button>
        <button type="button" data-quicklog="tuition"><i class="fa-solid fa-coins" aria-hidden="true"></i><span>Đã nhắc học phí<small>Hẹn kiểm tra sau 3 ngày</small></span></button>
        <button type="button" data-quicklog="progress"><i class="fa-solid fa-star" aria-hidden="true"></i><span>Đã báo tiến bộ cho phụ huynh<small>Hẹn lại sau 2 tuần</small></span></button>
      </div>

      <details class="more" ${s.interactions.length ? '' : 'open'}>
        <summary><i class="fa-solid fa-pen" aria-hidden="true"></i> Ghi chi tiết cuộc trao đổi</summary>
        <form class="log-form" id="logForm">
          <div class="type-pills" role="radiogroup" aria-label="Hình thức">
            ${TYPES.map((t, i) => `<label><input type="radio" name="type" value="${t.key}" ${i === 0 ? 'checked' : ''}><span><i class="fa-solid ${t.icon}" aria-hidden="true"></i>${esc(t.label)}</span></label>`).join('')}
          </div>
          <div class="field"><label for="logContent">Nội dung trao đổi</label>
            <div class="opts" style="margin-bottom:0.45rem;">${['Phụ huynh hài lòng', 'Con tiến bộ rõ', 'Con cần luyện thêm ở nhà', 'Gia đình muốn học thêm lớp', 'Gia đình xin nghỉ tạm', 'Hỏi về học phí'].map(t => `<button type="button" class="opt" data-append="${esc(t)}">${esc(t)}</button>`).join('')}</div>
            <textarea id="logContent" name="content" maxlength="2000" placeholder="Chạm các gợi ý phía trên hoặc gõ thêm chi tiết"></textarea></div>
          <div class="q" style="margin-top:0.7rem;"><div class="q-label">Hẹn liên hệ tiếp</div>
            <div class="opts">${FOLLOW_DAYS.map(([d, l]) => `<button type="button" class="opt" data-lognext="${addDays(today, d)}" aria-pressed="${nextVal === addDays(today, d)}">${l}</button>`).join('')}<button type="button" class="opt" data-lognext="" aria-pressed="${!nextVal}">Không hẹn</button></div>
            <input type="hidden" id="logNext" name="nextFollowUp" value="${esc(nextVal)}"></div>
          <div class="form-actions" style="margin-top:0.4rem;">
            <label class="note" style="display:flex;align-items:center;gap:0.4rem;">Ngày <input id="logDate" name="happenedAt" type="date" value="${today}" max="${today}" style="border:1px solid var(--line);border-radius:6px;padding:0.2rem 0.4rem;"></label>
            <button class="btn btn-primary" type="submit"><i class="fa-solid fa-check" aria-hidden="true"></i> Lưu ghi nhận</button>
          </div>
        </form>
      </details>

      <h3 style="font-size:0.9rem;margin:0.4rem 0 0.8rem;">Lịch sử chăm sóc <span class="locked" style="font-weight:500;">${s.interactions.length || ''}</span></h3>
      ${s.interactions.length ? `<ul class="timeline">${s.interactions.map(i => {
        const t = TYPE[i.type] || TYPE.khac;
        return `<li><span class="dot"><i class="fa-solid ${t.icon}" aria-hidden="true"></i></span>
          <div class="meta"><b>${esc(t.label)}</b><span>${esc(fmtDate(i.happenedAt))}</span>${i.createdBy ? `<span>bởi ${esc(i.createdBy)}</span>` : ''}
          <button class="del" data-del="${esc(i.id)}" aria-label="Xoá ghi nhận này"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button></div>
          <p>${esc(i.content)}</p>${i.outcome ? `<div class="outcome">${esc(i.outcome)}</div>` : ''}</li>`;
      }).join('')}</ul>` : '<div class="empty" style="padding:0.5rem 0;">Chưa có ghi nhận nào. Chạm một nút "Ghi nhanh" ở trên sau mỗi lần liên hệ.</div>'}`;
  }

  function renderProfile(s) {
    const p = profileOf(s), e = eff(s), today = todayStr();
    const src = t => t ? `<span class="src"><i class="fa-solid fa-link" aria-hidden="true"></i> ${esc(t)}</span>` : '';
    const caretakers = uniq([me.displayName].concat(suggestions.caretakers || [], p.caretaker ? [p.caretaker] : []));
    const schools = uniq((e.school ? [e.school] : []).concat(suggestions.schools || [])).slice(0, 8);
    const tags = uniq(PRESET_TAGS.concat(suggestions.tags || [], p.tags || []));
    const nextSel = FOLLOW_DAYS.map(([d]) => addDays(today, d)).includes(p.nextFollowUp) ? p.nextFollowUp : null;
    $('pane-profile').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:0.5rem;">
        <p class="locked" style="margin:0;">Chạm để chọn. Mọi thay đổi được <b>tự động lưu</b>.</p>
        <span class="save-state" id="saveState">${p.updatedAt ? `<i class="fa-solid fa-check" aria-hidden="true"></i> Đã lưu ${esc(relDays(p.updatedAt))}${p.updatedBy ? ' bởi ' + esc(p.updatedBy) : ''}` : ''}</span>
      </div>

      <div class="fieldset-title">Học sinh</div>
      <div class="q"><div class="q-label">Lớp / khối ${src(e.gradeHint ? 'lấy từ đơn đăng ký' : '')}</div>${optGroup('gradeLevel', GRADE_LEVELS, p.gradeLevel || e.gradeHint || '', { other: 'Khác…' })}</div>
      <div class="q"><div class="q-label">Trường đang học ${src(e.schoolFrom)}</div>${optGroup('school', schools, e.school, { other: schools.length ? 'Trường khác…' : 'Nhập tên trường' })}</div>
      <div class="q"><div class="q-label">Địa chỉ ${src(e.addressFrom)}</div><input class="opt-input" style="width:100%;border-radius:8px;" data-field="address" value="${esc(e.address)}" maxlength="200"></div>

      <div class="fieldset-title">Người giám hộ</div>
      <div class="form-grid">
        <div class="field"><label>Họ tên ${src(e.nameFrom)}</label><input data-field="guardianName" value="${esc(e.guardianName)}" maxlength="80"></div>
        <div class="field"><label>Số điện thoại ${src(e.phoneFrom)}</label><input data-field="guardianPhone" type="tel" inputmode="tel" value="${esc(e.guardianPhone)}" maxlength="20"></div>
      </div>
      <div class="q" style="margin-top:0.8rem;"><div class="q-label">Quan hệ với học sinh</div>${optGroup('guardianRelation', RELATIONS, p.guardianRelation || '')}</div>
      <p class="locked" style="margin-bottom:0.5rem;">Tài khoản phụ huynh: ${esc(s.parentEmail)}</p>

      <div class="fieldset-title">Chăm sóc</div>
      <div class="q"><div class="q-label">Mức ưu tiên</div>${optGroup('priority', Object.entries(PRIORITY), p.priority || 'thuong')}</div>
      <div class="q"><div class="q-label">Người phụ trách</div>${optGroup('caretaker', caretakers, p.caretaker || '', { other: 'Người khác…' })}</div>
      <div class="q"><div class="q-label">Hẹn liên hệ tiếp</div>
        <div class="opts">${FOLLOW_DAYS.map(([d, l]) => `<button type="button" class="opt" data-field="nextFollowUp" data-value="${addDays(today, d)}" aria-pressed="${nextSel === addDays(today, d)}">${l}</button>`).join('')}
          <button type="button" class="opt" data-field="nextFollowUp" data-value="" aria-pressed="${!p.nextFollowUp}">Không hẹn</button>
          <input type="date" class="opt-input" data-field="nextFollowUp" value="${esc(nextSel ? '' : (p.nextFollowUp || ''))}" aria-label="Chọn ngày khác" style="min-width:0;">
        </div></div>
      <div class="q"><div class="q-label">Việc cần làm khi liên hệ</div>${optGroup('followUpNote', FOLLOW_TODO, p.followUpNote || '', { other: 'Việc khác…' })}</div>
      <div class="q"><div class="q-label">Biết đến trung tâm qua</div>${optGroup('source', SOURCES, p.source || '')}</div>
      <div class="q"><div class="q-label">Nhãn (chọn nhiều)</div>${optGroup('tags', tags, p.tags || [], { multi: true, other: '+ Nhãn mới' })}</div>
      ${s.note ? `<div class="fieldset-title">Ghi chú từ hồ sơ gốc</div><p class="locked" style="white-space:pre-wrap;">${esc(s.note)}</p>` : ''}`;
  }

  function renderStudy(s) {
    const lock = what => `<span class="locked"><i class="fa-solid fa-lock" aria-hidden="true"></i> Tài khoản chưa được cấp quyền ${what}</span>`;
    const g = s.grades, t = s.tuition, a = s.attendance;
    const avg = g && g.scored ? (g.total / g.scored).toFixed(1) : null;
    const totalAtt = a ? a.present + a.absent + a.late : 0;
    $('pane-study').innerHTML = `
      <div class="stat-blocks">
        <div class="stat-block"><h4><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i> Bảng điểm</h4>
          ${!access.grades ? lock('Bảng Điểm') : g ? `<b>${avg != null ? avg : '—'}</b><small>Điểm trung bình · ${g.count} lần đánh giá</small>` : '<small>Chưa có điểm</small>'}</div>
        <div class="stat-block"><h4><i class="fa-solid fa-clipboard-check" aria-hidden="true"></i> Chuyên cần</h4>
          ${!access.attendance ? lock('Điểm Danh') : a && totalAtt ? `<b>${Math.round(a.present / totalAtt * 100)}%</b><small>Có mặt ${a.present}/${totalAtt} buổi · vắng ${a.absent30} buổi trong 30 ngày</small>` : '<small>Chưa có dữ liệu điểm danh</small>'}</div>
        <div class="stat-block"><h4><i class="fa-solid fa-coins" aria-hidden="true"></i> Học phí</h4>
          ${!access.tuition ? lock('Học Phí') : t ? `<b>${money(t.paid)}</b><small>${t.count} lần ghi nhận${t.pending ? ` · <span class="soon">${t.pending} chờ xác nhận</span>` : ''}${t.lastPeriod ? ' · gần nhất: ' + esc(t.lastPeriod) : ''}</small>` : '<small>Chưa có ghi nhận học phí</small>'}</div>
      </div>
      ${access.grades && g && g.last ? `<div class="panel"><div class="panel-head"><h2>Đánh giá gần nhất</h2><span class="hint">${esc(fmtDate(g.last.recordedAt))}</span></div>
        <div style="padding:0.9rem 1.1rem;"><p><b>${esc(g.last.term || 'Không ghi kỳ')}</b>${g.last.score != null && g.last.score !== '' ? ` · ${esc(g.last.score)} điểm` : ''}</p>${g.last.comment ? `<p class="locked" style="margin-top:0.3rem;white-space:pre-wrap;">${esc(g.last.comment)}</p>` : ''}</div></div>` : ''}
      <p class="locked" style="margin-top:1rem;">Chi tiết điểm, điểm danh và học phí vẫn nhập ở các mục tương ứng trong <a href="/admin" style="color:var(--brand);">trang quản trị</a>; CRM chỉ tổng hợp lại để xem nhanh.</p>`;
  }

  // ---------- Ghi dữ liệu ----------
  function profilePayload(s, overrides) {
    const p = profileOf(s), e = eff(s);
    return {
      studentId: s.id, stage: stageOf(s), priority: p.priority || 'thuong',
      gradeLevel: p.gradeLevel || e.gradeHint || '', school: e.school, address: e.address,
      guardianName: e.guardianName, guardianPhone: e.guardianPhone, guardianRelation: p.guardianRelation || '',
      source: p.source || '', tags: p.tags || [], nextFollowUp: p.nextFollowUp || '', followUpNote: p.followUpNote || '',
      caretaker: p.caretaker || '', ...overrides
    };
  }
  function setSaveState(text, cls) { const el = $('saveState'); if (el) { el.className = 'save-state ' + (cls || ''); el.innerHTML = text; } }

  // Lưu ngay (dùng cho đổi giai đoạn) — vẽ lại toàn bộ.
  async function saveProfile(s, overrides, successMsg) {
    const payload = profilePayload(s, overrides);
    const before = s.profile;
    s.profile = { ...profileOf(s), ...payload };
    renderAll();
    try {
      const r = await api('/api/portal-crm-save-profile', { method: 'POST', body: JSON.stringify(payload) });
      s.profile.updatedAt = r.updatedAt; s.profile.updatedBy = r.updatedBy;
      renderAll(); if (successMsg) toast(successMsg);
    } catch (e) { s.profile = before; renderAll(); toast(e.message, true); }
  }

  // Tự động lưu khi chạm lựa chọn / rời ô nhập — gom nhiều thay đổi liên tiếp thành 1 lần gửi,
  // và KHÔNG vẽ lại ô đang nhập để không mất con trỏ.
  const pendingSave = {};
  function autoSave(s) {
    setSaveState('<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Đang lưu…', 'saving');
    clearTimeout(pendingSave[s.id]);
    pendingSave[s.id] = setTimeout(async () => {
      try {
        const r = await api('/api/portal-crm-save-profile', { method: 'POST', body: JSON.stringify(profilePayload(s)) });
        s.profile.updatedAt = r.updatedAt; s.profile.updatedBy = r.updatedBy;
        if (state.openId === s.id) setSaveState('<i class="fa-solid fa-check" aria-hidden="true"></i> Đã lưu', '');
        renderOverview(); renderList(); renderBoard(); renderAgenda();
        if (state.openId === s.id && state.pane !== 'care') renderCare(s);
      } catch (e) { setSaveState('<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> ' + esc(e.message), 'err'); }
    }, 600);
  }
  function setField(s, field, value, multi) {
    const p = { ...profileOf(s) };
    if (multi) {
      const set = new Set(p[field] || []);
      if (set.has(value)) set.delete(value); else set.add(value);
      p[field] = Array.from(set);
    } else {
      p[field] = value;
    }
    s.profile = p;
    autoSave(s);
  }
  function setStage(id, stage) {
    const s = findStudent(id); if (!s || stageOf(s) === stage) return;
    saveProfile(s, { stage }, `Đã chuyển ${s.studentName} sang "${STAGE[stage].label}".`);
  }

  // ----- Soạn email / SMS -----
  function applyTemplate(s, key) {
    const t = MSG_TEMPLATES.find(x => x.key === key) || MSG_TEMPLATES[0]; const c = state.compose;
    c.tpl = t.key;
    if (c.mode === 'email') { c.subject = fillTemplate(t.subject, s); c.body = fillTemplate(t.email, s); }
    else c.body = stripVN(fillTemplate(t.sms, s)); // mẫu SMS không dấu -> 1 tin 160 ký tự thay vì 70
  }
  function syncCompose() {
    const c = state.compose; if (!c) return;
    const sub = $('cSubject'), body = $('cBody');
    if (sub) c.subject = sub.value; if (body) c.body = body.value;
  }
  async function sendEmail(btn) {
    syncCompose(); const c = state.compose; if (!c) return;
    const s = findStudent(c.id);
    if (!c.subject.trim() || !c.body.trim()) { toast('Nhập tiêu đề và nội dung email.', true); return; }
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Đang gửi…';
    try {
      const r = await api('/api/portal-crm-send-email', { method: 'POST', body: JSON.stringify({ studentId: s.id, subject: c.subject.trim(), message: c.body.trim(), nextFollowUp: c.follow ? addDays(todayStr(), c.follow) : '' }) });
      s.interactions = [r.interaction].concat(s.interactions);
      s.profile = { ...profileOf(s), nextFollowUp: c.follow ? addDays(todayStr(), c.follow) : '', followUpNote: c.follow ? 'Kiểm tra phản hồi email' : '' };
      state.compose = null; renderAll(); toast(`Đã gửi email tới ${r.to}.`);
    } catch (err) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Gửi email'; toast(err.message, true); }
  }

  // Ghi nhận 1 chạm
  const QUICK_LOGS = {
    noanswer: { type: 'goi-dien', content: 'Gọi điện nhưng phụ huynh không nghe máy.', days: 1, todo: 'Gọi lại' },
    schedule: { type: 'goi-dien', content: 'Đã nhắc phụ huynh lịch học sắp tới.', days: 7, todo: 'Hỏi thăm tình hình' },
    tuition: { type: 'goi-dien', content: 'Đã nhắc phụ huynh về học phí kỳ này.', days: 3, todo: 'Kiểm tra học phí' },
    progress: { type: 'zalo', content: 'Đã báo phụ huynh về tiến bộ của con.', days: 14, todo: 'Báo kết quả học tập' }
  };
  async function logInteraction(s, payload, btn) {
    if (btn) btn.disabled = true;
    try {
      const r = await api('/api/portal-crm-add-interaction', { method: 'POST', body: JSON.stringify({ studentId: s.id, ...payload }) });
      s.interactions = [r.interaction].concat(s.interactions).sort((a, b) => new Date(b.happenedAt) - new Date(a.happenedAt));
      if ('nextFollowUp' in payload) s.profile = { ...profileOf(s), nextFollowUp: payload.nextFollowUp, followUpNote: payload.nextFollowUp ? (payload.followUpNote || '') : '' };
      renderAll(); toast('Đã ghi nhận' + (payload.nextFollowUp ? `, hẹn liên hệ ${relDays(payload.nextFollowUp)}.` : '.'));
    } catch (err) { if (btn) btn.disabled = false; toast(err.message, true); }
  }

  // ---------- Xuất CSV ----------
  async function exportCsv() {
    if (window.WVN_EXPORT_ALLOWED !== true) { toast('Chỉ Quản trị viên chính được xuất dữ liệu ra Excel.', true); return; }
    const rows = sortedFiltered();
    if (!rows.length) { toast('Không có học sinh nào để xuất.', true); return; }
    const btn = $('exportBtn'); const label = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Đang tạo file…';
    const flagsText = st => flagsOf(st).map(f => f.label).join(', ');
    const filterDesc = [state.stage && STAGE[state.stage].label, state.program, state.q && `tìm "${state.q}"`].filter(Boolean).join(' · ');
    try {
      const name = await WVNExcel.download({
        filename: `crm-hoc-sinh-${todayStr()}`,
        sheetName: 'Học sinh',
        title: 'Danh sách học sinh · CRM',
        subtitle: (filterDesc ? 'Lọc: ' + filterDesc + ' · ' : '') + (me.displayName ? 'Người xuất: ' + me.displayName : ''),
        columns: [
          { label: 'Học sinh', get: st => st.studentName },
          { label: 'Ngày sinh', type: 'date', get: st => st.dob },
          { label: 'Lớp / khối', get: st => profileOf(st).gradeLevel || eff(st).gradeHint },
          { label: 'Chương trình', get: st => st.programs.join(', ') },
          { label: 'Giai đoạn', get: st => STAGE[stageOf(st)].label, style: (v, st) => { const x = STAGE[stageOf(st)]; return { fill: x.cs, color: x.c, bold: true }; } },
          { label: 'Người giám hộ', get: st => eff(st).guardianName },
          { label: 'Quan hệ', get: st => profileOf(st).guardianRelation || '' },
          { label: 'Điện thoại', type: 'phone', get: st => eff(st).guardianPhone },
          { label: 'Email phụ huynh', get: st => st.parentEmail },
          { label: 'Trường', get: st => eff(st).school },
          { label: 'Người phụ trách', get: st => profileOf(st).caretaker || '' },
          { label: 'Ưu tiên', get: st => PRIORITY[profileOf(st).priority || 'thuong'], style: (v, st) => profileOf(st).priority === 'khan' ? { color: '#b42318', bold: true } : profileOf(st).priority === 'cao' ? { color: '#a15c07', bold: true } : null },
          { label: 'Liên hệ gần nhất', type: 'date', get: st => lastContact(st) ? lastContact(st).slice(0, 10) : '' },
          { label: 'Hẹn liên hệ', type: 'date', get: st => profileOf(st).nextFollowUp, style: v => v && v < todayStr() ? { color: '#b42318', bold: true } : null },
          { label: 'Việc cần làm', get: st => profileOf(st).followUpNote || '' },
          { label: 'Nhãn', get: st => (profileOf(st).tags || []).join(', ') },
          { label: 'Cần chú ý', get: flagsText, style: v => v ? { color: '#b42318' } : null, wrap: true }
        ],
        rows
      });
      toast(`Đã tải ${name} (${rows.length} học sinh).`);
    } catch (e) { toast(e.message, true); }
    finally { btn.disabled = false; btn.innerHTML = label; }
  }

  // ---------- Sự kiện ----------
  function setView(v, opts) {
    state.view = v;
    if (opts && 'stage' in opts) { state.stage = opts.stage; $('fStage').value = opts.stage; }
    if (opts && 'flag' in opts) { state.flag = opts.flag; $('fFlag').value = opts.flag; }
    document.querySelectorAll('.view-btn').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
    document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
    renderAll();
    window.scrollTo({ top: 0 });
  }

  document.addEventListener('click', e => {
    const t = e.target;
    const contact = t.closest('a[data-contact]');
    if (contact) {
      e.stopPropagation();
      const s = findStudent(contact.dataset.id); if (!s) return;
      state.contacted = { id: s.id, via: contact.dataset.contact, at: Date.now() };
      if (contact.dataset.contact === 'zalo') {
        // Zalo mở trong tab/ứng dụng mới; sao chép sẵn số để dán nếu Zalo trên máy tính yêu cầu tìm kiếm
        try { navigator.clipboard && navigator.clipboard.writeText(contact.dataset.phone).catch(() => {}); } catch (err) {}
        toast(`Đang mở Zalo với ${contact.dataset.phone} (đã sao chép số).`);
      } else {
        toast(`Đang gọi ${contact.getAttribute('href').slice(4)}…`);
      }
      // Mở sẵn hồ sơ ở tab Chăm sóc để ghi nhận ngay sau khi gọi/nhắn xong
      setTimeout(() => { if (state.openId !== s.id) openDrawer(s.id); state.pane = 'care'; renderDrawer(); }, 300);
      return; // không chặn mặc định: trình duyệt tự mở cuộc gọi / Zalo
    }
    const cp = t.closest('[data-compose]');
    if (cp) {
      e.preventDefault();
      const s = findStudent(cp.dataset.id); if (!s) return;
      state.compose = { id: s.id, mode: cp.dataset.compose, tpl: '', subject: '', body: '', follow: cp.dataset.compose === 'email' ? 7 : 0 };
      const first = MSG_TEMPLATES[0]; applyTemplate(s, first.key);
      if (state.openId !== s.id) openDrawer(s.id);
      state.pane = 'care'; renderDrawer();
      setTimeout(() => { const box = $('composeBox'); if (box) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 60);
      return;
    }
    if (t.closest('[data-compose-close]')) { state.compose = null; return renderDrawer(); }
    const tp = t.closest('[data-tpl]'); if (tp && state.compose) { syncCompose(); applyTemplate(findStudent(state.compose.id), tp.dataset.tpl); return renderDrawer(); }
    const cf = t.closest('[data-cfollow]'); if (cf && state.compose) { syncCompose(); state.compose.follow = +cf.dataset.cfollow; return renderDrawer(); }
    if (t.closest('[data-strip]') && state.compose) { syncCompose(); state.compose.body = stripVN(state.compose.body); return renderDrawer(); }
    if (t.closest('#cSend')) return sendEmail(t.closest('#cSend'));
    if (t.closest('#cZalo') && state.compose) {
      syncCompose(); const c = state.compose; const s = findStudent(c.id); const ph = vnPhone(eff(s).guardianPhone);
      if (!c.body.trim()) { toast('Nhập nội dung tin nhắn trước.', true); return; }
      try { navigator.clipboard && navigator.clipboard.writeText(c.body).catch(() => {}); } catch (err) {}
      window.open('https://zalo.me/' + ph, '_blank', 'noopener');
      state.contacted = { id: s.id, via: 'zalo', text: c.body, follow: c.follow }; state.compose = null;
      toast('Đã sao chép tin nhắn. Dán (Cmd+V hoặc giữ để dán) vào khung chat Zalo.');
      return renderDrawer();
    }
    if (t.closest('#cSms') && state.compose) {
      syncCompose(); const c = state.compose;
      if (!c.body.trim()) { e.preventDefault(); toast('Nhập nội dung tin nhắn trước.', true); return; }
      const s = findStudent(c.id);
      t.closest('#cSms').href = `sms:${vnPhone(eff(s).guardianPhone)}?&body=${encodeURIComponent(c.body)}`;
      state.contacted = { id: s.id, via: 'sms', text: c.body, follow: c.follow }; state.compose = null;
      setTimeout(renderDrawer, 400);
      return; // để trình duyệt mở ứng dụng Tin nhắn
    }
    const gp = t.closest('[data-goto-profile]'); if (gp) { e.preventDefault(); state.pane = 'profile'; renderDrawer(); setTimeout(() => { const el = document.querySelector('#pane-profile [data-field="guardianPhone"]'); if (el) el.focus(); }, 50); return; }
    const ac = t.closest('[data-aftercontact]');
    if (ac && state.openId && state.contacted) {
      const s = findStudent(state.openId); const via = state.contacted.via; const kind = ac.dataset.aftercontact;
      const contactedText = state.contacted.text || ''; const contactedFollow = state.contacted.follow || 0;
      state.contacted = null;
      if (kind === 'skip') return renderDrawer();
      if (kind === 'detail') { renderDrawer(); const d = document.querySelector('#pane-care details.more'); if (d) { d.open = true; const r = d.querySelector(`input[name=type][value="${via === 'zalo' ? 'zalo' : 'goi-dien'}"]`); if (r) r.checked = true; $('logContent').focus(); } return; }
      const ok = kind === 'ok';
      const sent = contactedText;
      if (sent) {
        const fd = contactedFollow;
        return logInteraction(s, {
          type: via === 'zalo' ? 'zalo' : 'sms',
          content: `Đã nhắn ${via === 'zalo' ? 'Zalo' : 'SMS'}: "${sent.length > 160 ? sent.slice(0, 157) + '…' : sent}"`,
          happenedAt: todayStr(),
          nextFollowUp: fd ? addDays(todayStr(), fd) : '',
          followUpNote: fd ? 'Kiểm tra phản hồi tin nhắn' : ''
        }, ac);
      }
      return logInteraction(s, {
        type: via === 'zalo' ? 'zalo' : 'goi-dien',
        content: ok ? (via === 'zalo' ? 'Đã nhắn Zalo và trao đổi với phụ huynh.' : 'Đã gọi điện trao đổi với phụ huynh.') : (via === 'zalo' ? 'Đã nhắn Zalo, phụ huynh chưa trả lời.' : 'Gọi điện nhưng phụ huynh không nghe máy.'),
        happenedAt: todayStr(),
        nextFollowUp: addDays(todayStr(), ok ? 14 : 1),
        followUpNote: ok ? 'Hỏi thăm tình hình' : (via === 'zalo' ? 'Kiểm tra tin nhắn Zalo' : 'Gọi lại')
      }, ac);
    }
    const del = t.closest('[data-del]');
    if (del) { e.stopPropagation(); return deleteInteraction(del.dataset.del); }
    const stageBtn = t.closest('[data-set-stage]'); if (stageBtn) return setStage(state.openId, stageBtn.dataset.setStage);
    const opt = t.closest('button.opt[data-field]');
    if (opt && state.openId) {
      const s = findStudent(state.openId); const multi = !!opt.dataset.multi;
      if (!multi) opt.parentElement.querySelectorAll('button.opt').forEach(b => b.setAttribute('aria-pressed', b === opt));
      else opt.setAttribute('aria-pressed', opt.getAttribute('aria-pressed') !== 'true');
      const other = opt.parentElement.querySelector('.opt-input'); if (other && !multi) other.value = '';
      return setField(s, opt.dataset.field, opt.dataset.value, multi);
    }
    const ap = t.closest('[data-append]'); if (ap) { const ta = $('logContent'); ta.value = (ta.value.trim() ? ta.value.trim().replace(/[.]?$/, '. ') : '') + ap.dataset.append + '.'; ta.focus(); return; }
    const ln = t.closest('[data-lognext]'); if (ln) { $('logNext').value = ln.dataset.lognext; ln.parentElement.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b === ln)); return; }
    const ql = t.closest('[data-quicklog]');
    if (ql && state.openId) {
      const q = QUICK_LOGS[ql.dataset.quicklog]; const s = findStudent(state.openId);
      return logInteraction(s, { type: q.type, content: q.content, happenedAt: todayStr(), nextFollowUp: addDays(todayStr(), q.days), followUpNote: q.todo }, ql);
    }
    const sf = t.closest('[data-stage-filter]'); if (sf) return setView('list', { stage: sf.dataset.stageFilter, flag: '' });
    const go = t.closest('[data-goto]'); if (go) return setView(go.dataset.goto, go.dataset.flag ? { flag: go.dataset.flag } : undefined);
    const open = t.closest('[data-open]'); if (open) return openDrawer(open.dataset.open);
    const vb = t.closest('.view-btn'); if (vb) return setView(vb.dataset.view);
    const tab = t.closest('.drawer-tabs button'); if (tab) { state.pane = tab.dataset.pane; return renderDrawer(); }
    const sort = t.closest('[data-sort]'); if (sort) { state.dir = state.sort === sort.dataset.sort ? -state.dir : 1; state.sort = sort.dataset.sort; return renderList(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.openId) closeDrawer();
    if (e.key === 'Enter' && e.target.matches('tr[data-open]')) openDrawer(e.target.dataset.open);
    if (e.key === '/' && !e.target.matches('input, textarea, select')) { e.preventDefault(); $('globalSearch').focus(); }
  });
  $('pane-care').addEventListener('input', e => {
    if (e.target.id !== 'cBody' || !state.compose || state.compose.mode !== 'sms') return;
    const v = e.target.value; const sg = smsSegments(v); const el = $('cCount');
    if (el) el.textContent = `${v.length} ký tự · ${sg.n} tin${sg.unicode ? ' (có dấu, tốn gấp đôi)' : ''}`;
  });
  $('pane-profile').addEventListener('change', e => {
    const el = e.target.closest('input[data-field]'); if (!el || !state.openId) return;
    const s = findStudent(state.openId); const v = el.value.trim();
    if (el.dataset.multi) { if (!v) return; el.value = ''; setField(s, el.dataset.field, v, true); renderProfile(s); return; }
    if (el.dataset.field === 'guardianPhone' && v && !/^[0-9+\s().-]{8,20}$/.test(v)) { setSaveState('Số điện thoại chưa đúng, kiểm tra lại', 'err'); return; }
    el.closest('.opts') && el.closest('.opts').querySelectorAll('button.opt').forEach(b => b.setAttribute('aria-pressed', 'false'));
    setField(s, el.dataset.field, v, false);
  });
  $('pane-profile').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[data-field]')) { e.preventDefault(); e.target.blur(); } });
  $('drawerClose').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  $('exportBtn').addEventListener('click', exportCsv);

  let qTimer;
  $('globalSearch').addEventListener('input', e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value.trim(); if (state.q && state.view === 'overview') setView('list'); else renderAll(); }, 150);
  });
  ['fStage', 'fProgram', 'fFlag'].forEach(id => $(id).addEventListener('change', e => {
    state[{ fStage: 'stage', fProgram: 'program', fFlag: 'flag' }[id]] = e.target.value; renderAll();
  }));

  document.addEventListener('submit', async e => {
    e.preventDefault();
    const s = findStudent(state.openId); if (!s || e.target.id !== 'logForm') return;
    const fd = new FormData(e.target);
    const content = String(fd.get('content') || '').trim();
    if (!content) { toast('Chạm một gợi ý hoặc gõ nội dung trao đổi trước khi lưu.', true); return; }
    await logInteraction(s, { type: fd.get('type'), content, happenedAt: fd.get('happenedAt'), nextFollowUp: fd.get('nextFollowUp') || '', followUpNote: profileOf(s).followUpNote || '' }, e.target.querySelector('[type=submit]'));
  });

  async function deleteInteraction(id) {
    const s = findStudent(state.openId); if (!s) return;
    if (!confirm('Xoá ghi nhận chăm sóc này? Thao tác không hoàn tác được.')) return;
    const before = s.interactions;
    s.interactions = s.interactions.filter(i => i.id !== id); renderAll();
    try { await api('/api/portal-crm-delete-interaction', { method: 'POST', body: JSON.stringify({ studentId: s.id, id }) }); toast('Đã xoá ghi nhận.'); }
    catch (err) { s.interactions = before; renderAll(); toast(err.message, true); }
  }

  // Kéo thả trên bảng giai đoạn
  let dragId = null;
  $('board').addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  $('board').addEventListener('dragend', e => { const c = e.target.closest('.card'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.column.drop').forEach(x => x.classList.remove('drop')); });
  $('board').addEventListener('dragover', e => { const col = e.target.closest('.column'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.column.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
  $('board').addEventListener('drop', e => { const col = e.target.closest('.column'); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; setStage(id, col.dataset.stage); });

  // ---------- Khởi động ----------
  async function load() {
    try {
      const [data, who] = await Promise.all([api('/api/portal-crm-data'), api('/api/portal-admin-whoami').catch(() => null)]);
      students = data.students || []; access = data.access || access; suggestions = data.suggestions || suggestions;
      if (who) { me = who; $('whoLabel').textContent = who.displayName || ''; }
      window.WVN_EXPORT_ALLOWED = !!(who && who.role === 'super');
      $('exportBtn').hidden = !window.WVN_EXPORT_ALLOWED;
      $('fStage').innerHTML = '<option value="">Mọi giai đoạn</option>' + STAGES.map(s => `<option value="${s.key}">${esc(s.label)}</option>`).join('');
      $('fProgram').innerHTML = '<option value="">Mọi chương trình</option>' + programsAll().map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
      $('loadingBox').remove();
      document.querySelectorAll('.view').forEach(v => v.hidden = false);
      if (!students.length) {
        $('view-overview').innerHTML = `<div class="panel"><div class="empty" style="padding:2.5rem 1.5rem;"><strong>Chưa có học sinh nào trong hệ thống.</strong>Thêm học sinh ở mục Học Sinh trong <a href="/admin" style="color:var(--brand);">trang quản trị</a>, rồi quay lại đây để chăm sóc.</div></div>`;
        renderList(); renderBoard(); renderAgenda();
        return;
      }
      renderAll();
      const deep = new URLSearchParams(location.search).get('hs'); if (deep) openDrawer(deep);
    } catch (e) {
      const box = $('loadingBox');
      const noPerm = /quyền/i.test(e.message);
      box.innerHTML = `<div class="error-box">${noPerm ? '<strong>Tài khoản của bạn chưa được cấp quyền Học Sinh.</strong><br>Nhờ Quản Trị Viên Chính cấp quyền ở mục Tài Khoản Quản Trị, sau đó tải lại trang này.' : esc(e.message)}</div>
        <p style="margin-top:1rem;"><button class="btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Tải lại</button></p>`;
    }
  }
  load();
})();
</script>
</body>
</html>
