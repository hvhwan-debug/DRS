<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM Học Sinh · Quản trị Mạng Lưới Tri Thức Việt Nam</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=20260927b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  // Chặn sớm: chưa có phiên quản trị thì về trang đăng nhập trước khi vẽ giao diện.
  if (!localStorage.getItem('wvn_admin_token')) window.location.replace('admin-dang-nhap.html');
</script>
<style>
:root {
  --ink: #0f1e3d;
  --ink-2: #334766;
  --muted: #64748b;
  --line: #dfe6ef;
  --paper: #f5f8fc;
  --surface: #ffffff;
  --brand: #0369a1;
  --brand-2: #0284c7;
  --brand-soft: #e6f3fb;
  --green: #2f7a4f;  --green-soft: #e7f4ec;
  --amber: #a15c07;  --amber-soft: #fdf1dc;
  --red: #b42318;    --red-soft: #fdecea;
  --violet: #5b4bb7; --violet-soft: #efedfb;
  --radius-s: 6px; --radius-m: 10px; --radius-l: 16px;
  --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--paper); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Khung ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: var(--ink); color: #fff; }
.topbar-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1.25rem; }
.brand { display: flex; align-items: baseline; gap: 0.6rem; text-decoration: none; color: #fff; white-space: nowrap; }
.brand strong { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.2px; }
.brand span { font-size: 0.8rem; color: #9fb4d6; }
.search { flex: 1; max-width: 460px; margin-left: auto; position: relative; }
.search input { width: 100%; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14); color: #fff; border-radius: 999px; padding: 0.5rem 0.9rem 0.5rem 2.2rem; }
.search input::placeholder { color: #9fb4d6; }
.search i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #9fb4d6; font-size: 0.85rem; }
.top-actions { display: flex; align-items: center; gap: 0.5rem; }
.who { font-size: 0.8rem; color: #c7d5ea; white-space: nowrap; }
.top-link { color: #c7d5ea; text-decoration: none; font-size: 0.82rem; padding: 0.4rem 0.7rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.16); white-space: nowrap; }
.top-link:hover { color: #fff; border-color: rgba(255,255,255,0.35); }

.views { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 52px; z-index: 20; }
.views-inner { max-width: 1400px; margin: 0 auto; display: flex; gap: 0.25rem; padding: 0 1.25rem; overflow-x: auto; }
.view-btn { background: none; border: none; padding: 0.85rem 0.9rem 0.75rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.view-btn[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-2); }
.view-btn .count { font-weight: 600; font-size: 0.75rem; margin-left: 0.35rem; color: var(--muted); }
.view-btn .count.alert { color: var(--red); }

main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
.view { display: none; }
.view.active { display: block; }

.btn { display: inline-flex; align-items: center; gap: 0.45rem; border-radius: var(--radius-s); padding: 0.5rem 0.9rem; font-weight: 600; font-size: 0.88rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: #c3cfdd; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #075985; border-color: #075985; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--ink); background: var(--paper); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* ---------- Tổng quan ---------- */
.overview-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.overview-head h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.4px; }
.overview-head p { color: var(--muted); font-size: 0.9rem; }

.pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); margin-bottom: 1.5rem; }
.pulse > div { padding: 1rem 1.2rem; border-left: 1px solid var(--line); }
.pulse > div:first-child { border-left: none; }
.pulse b { display: block; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
.pulse small { color: var(--muted); font-size: 0.82rem; }
.pulse .warn b { color: var(--red); }

/* Dải hành trình: thành phần nổi bật nhất của CRM, dùng ở tổng quan và trong hồ sơ */
.journey { display: flex; gap: 3px; margin-bottom: 1.5rem; }
.journey-step { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); padding: 0.85rem 1rem 0.8rem; text-align: left; position: relative; }
.journey-step:first-child { border-radius: var(--radius-l) 0 0 var(--radius-l); }
.journey-step:last-child { border-radius: 0 var(--radius-l) var(--radius-l) 0; }
.journey-step::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); opacity: 0.85; }
.journey-step:first-child::before { border-top-left-radius: var(--radius-l); }
.journey-step:last-child::before { border-top-right-radius: var(--radius-l); }
.journey-step b { display: block; font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
.journey-step span { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.journey-step:hover { background: var(--paper); }

.grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.25rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); overflow: hidden; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--line); gap: 0.5rem; }
.panel-head h2 { font-size: 0.98rem; font-weight: 700; }
.panel-head .hint { font-size: 0.8rem; color: var(--muted); }
.panel-body { padding: 0.35rem 0; }
.row-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.65rem 1.1rem; width: 100%; background: none; border: none; text-align: left; border-bottom: 1px solid #eef2f7; }
.row-item:last-child { border-bottom: none; }
.row-item:hover { background: var(--paper); }
.row-main { flex: 1; min-width: 0; }
.row-main strong { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small { color: var(--muted); font-size: 0.8rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 1.6rem 1.1rem; color: var(--muted); font-size: 0.88rem; }
.empty strong { color: var(--ink); display: block; margin-bottom: 0.2rem; }

.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; background: var(--brand-soft); color: var(--brand); }

/* Nhãn */
.chip { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.74rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; background: var(--paper); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.stage { border: none; background: var(--cs); color: var(--c); }
.chip.red { background: var(--red-soft); color: var(--red); border-color: transparent; }
.chip.amber { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.green { background: var(--green-soft); color: var(--green); border-color: transparent; }
.flags { display: flex; gap: 0.3rem; flex-wrap: wrap; }

/* ---------- Danh sách ---------- */
.toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
.toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 0.45rem 0.6rem; font-size: 0.86rem; }
.toolbar .spacer { flex: 1; }
.toolbar .result { font-size: 0.84rem; color: var(--muted); }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 880px; }
th { text-align: left; font-size: 0.78rem; font-weight: 600; color: var(--muted); padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--line); background: #fafcfe; white-space: nowrap; }
th button { background: none; border: none; font-weight: 600; color: inherit; display: inline-flex; gap: 0.3rem; align-items: center; }
td { padding: 0.65rem 0.9rem; border-bottom: 1px solid #eef2f7; vertical-align: middle; font-size: 0.88rem; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--paper); }
tbody tr:last-child td { border-bottom: none; }
.name-cell { display: flex; align-items: center; gap: 0.7rem; }
.name-cell strong { font-weight: 600; display: block; }
.name-cell small { color: var(--muted); font-size: 0.78rem; }
.overdue { color: var(--red); font-weight: 600; }
.soon { color: var(--amber); font-weight: 600; }

/* ---------- Theo giai đoạn ---------- */
.board { display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr)); gap: 0.8rem; overflow-x: auto; padding-bottom: 0.5rem; }
.column { background: #edf2f8; border-radius: var(--radius-l); display: flex; flex-direction: column; min-height: 320px; }
.column-head { padding: 0.8rem 0.9rem 0.6rem; display: flex; align-items: center; gap: 0.5rem; }
.column-head::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.column-head strong { font-size: 0.88rem; }
.column-head span { margin-left: auto; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.column-body { padding: 0 0.55rem 0.6rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; border-radius: var(--radius-l); transition: background 0.15s; }
.column.drop .column-body { background: rgba(2,132,199,0.08); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.65rem 0.75rem; text-align: left; width: 100%; }
.card:hover { border-color: #b9c8da; }
.card.dragging { opacity: 0.45; }
.card strong { display: block; font-weight: 600; font-size: 0.9rem; }
.card small { display: block; color: var(--muted); font-size: 0.77rem; margin: 0.1rem 0 0.4rem; }

/* ---------- Lịch chăm sóc ---------- */
.agenda { display: grid; gap: 1.25rem; }
.agenda-group h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; display: flex; gap: 0.5rem; align-items: center; }
.agenda-group h3 span { color: var(--muted); font-weight: 500; }

/* ---------- Ngăn hồ sơ ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,30,61,0.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--surface); z-index: 50; transform: translateX(100%); transition: transform 0.25s ease, visibility 0.25s; visibility: hidden; display: flex; flex-direction: column; }
.drawer.open { transform: none; visibility: visible; box-shadow: -12px 0 40px rgba(15,30,61,0.15); }
.drawer-head { padding: 1.1rem 1.3rem 0.9rem; border-bottom: 1px solid var(--line); }
.drawer-title { display: flex; align-items: flex-start; gap: 0.85rem; }
.drawer-title .avatar { width: 46px; height: 46px; font-size: 1rem; }
.drawer-title h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.3px; line-height: 1.25; }
.drawer-title p { color: var(--muted); font-size: 0.84rem; }
.drawer-close { margin-left: auto; background: none; border: none; width: 36px; height: 36px; border-radius: 50%; color: var(--muted); font-size: 1.1rem; }
.drawer-close:hover { background: var(--paper); color: var(--ink); }

.rail { display: flex; margin-top: 1rem; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.rail button { flex: 1; min-width: 0; background: none; border: none; border-left: 1px solid var(--line); padding: 0.45rem 0.3rem; font-size: 0.76rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail button:first-child { border-left: none; }
.rail button:hover { color: var(--ink); background: var(--paper); }
.rail button.passed { color: var(--c); background: var(--cs); }
.rail button.current { color: #fff; background: var(--c); }

.drawer-tabs { display: flex; gap: 0.2rem; padding: 0 1.3rem; border-bottom: 1px solid var(--line); }
.drawer-tabs button { background: none; border: none; padding: 0.7rem 0.7rem 0.6rem; font-weight: 600; font-size: 0.86rem; color: var(--muted); border-bottom: 2px solid transparent; }
.drawer-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-2); }
.drawer-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.3rem 2rem; }
.drawer-pane { display: none; }
.drawer-pane.active { display: block; }

.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.2rem 1.2rem; margin-bottom: 1.2rem; }
.facts div { padding: 0.45rem 0; border-bottom: 1px dashed #e6ecf3; min-width: 0; }
.facts dt { font-size: 0.75rem; color: var(--muted); }
.facts dd { font-weight: 500; overflow-wrap: anywhere; }
.facts a { color: var(--brand); text-decoration: none; }

.log-form { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.85rem; margin-bottom: 1.3rem; background: #fafcfe; }
.type-pills { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.type-pills label { cursor: pointer; }
.type-pills input { position: absolute; opacity: 0; pointer-events: none; }
.type-pills span { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; padding: 0.3rem 0.65rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.type-pills input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
.type-pills input:focus-visible + span { outline: 2px solid var(--brand-2); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 0.25rem; min-width: 0; }
.field label { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 0.5rem 0.65rem; background: var(--surface); width: 100%; }
.field textarea { resize: vertical; min-height: 72px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(2,132,199,0.14); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; }
.form-grid .full { grid-column: 1 / -1; }
.form-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.8rem; align-items: center; }
.form-actions .note { margin-right: auto; font-size: 0.78rem; color: var(--muted); }
.fieldset-title { font-size: 0.85rem; font-weight: 700; margin: 1.3rem 0 0.6rem; padding-top: 1rem; border-top: 1px solid var(--line); }
.fieldset-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }

.timeline { list-style: none; position: relative; }
.timeline::before { content: ""; position: absolute; left: 15px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding: 0 0 1.1rem 2.6rem; }
.timeline .dot { position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; color: var(--ink-2); font-size: 0.78rem; }
.timeline .meta { font-size: 0.78rem; color: var(--muted); display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.timeline .meta b { color: var(--ink); font-weight: 600; }
.timeline p { margin-top: 0.2rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.timeline .outcome { margin-top: 0.35rem; font-size: 0.84rem; color: var(--green); }
.timeline .del { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 0.78rem; padding: 0.1rem 0.3rem; border-radius: 4px; }
.timeline .del:hover { color: var(--red); background: var(--red-soft); }

.stat-blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; margin-bottom: 1rem; }
.stat-block { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0.8rem 0.9rem; }
.stat-block h4 { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-bottom: 0.3rem; display: flex; gap: 0.4rem; align-items: center; }
.stat-block b { font-size: 1.2rem; font-weight: 800; display: block; }
.stat-block small { font-size: 0.78rem; color: var(--muted); display: block; }
.locked { color: var(--muted); font-size: 0.8rem; }
.callout { background: var(--brand-soft); color: #0b4a6f; border-radius: var(--radius-m); padding: 0.75rem 0.9rem; font-size: 0.85rem; }

/* ---------- Thông báo & trạng thái tải ---------- */
.toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 0.65rem 1rem; border-radius: var(--radius-m); font-size: 0.88rem; opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 60; max-width: calc(100% - 2rem); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--red); }
.loading { padding: 4rem 1rem; text-align: center; color: var(--muted); }
.loading i { font-size: 1.4rem; color: var(--brand-2); display: block; margin-bottom: 0.6rem; }
.error-box { background: var(--red-soft); color: var(--red); border-radius: var(--radius-m); padding: 1rem 1.1rem; }

@media (max-width: 1100px) {
  .grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topbar-inner { flex-wrap: wrap; }
  .search { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }
  .who { display: none; }
  .views { position: static; }
  .row-item { flex-wrap: wrap; }
  .row-item .row-main { flex-basis: calc(100% - 48px); }
  .row-item > .flags, .row-item > .chip { margin-left: 46px; }
  .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pulse > div:nth-child(3) { border-left: none; }
  .pulse > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .journey { overflow-x: auto; }
  .journey-step { min-width: 110px; }
  .form-grid, .facts { grid-template-columns: 1fr; }
  .stat-blocks { grid-template-columns: 1fr; }
  .rail { overflow-x: auto; border-radius: var(--radius-m); }
  .rail button { min-width: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/admin"><strong>CRM Học Sinh</strong><span>Mạng Lưới Tri Thức Việt Nam</span></a>
    <div class="search">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <label class="sr-only" for="globalSearch">Tìm học sinh</label>
      <input id="globalSearch" type="search" placeholder="Tìm theo tên học sinh, phụ huynh, email, số điện thoại…" autocomplete="off">
    </div>
    <div class="top-actions">
      <span class="who" id="whoLabel"></span>
      <a class="top-link" href="/admin"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Trang quản trị</a>
    </div>
  </div>
</header>

<nav class="views" aria-label="Chế độ xem">
  <div class="views-inner" role="tablist">
    <button class="view-btn" role="tab" aria-selected="true" data-view="overview">Tổng quan</button>
    <button class="view-btn" role="tab" aria-selected="false" data-view="list">Danh sách<span class="count" id="countList"></span></button>
    <button class="view-btn" role="tab" aria-selected="false" data-view="board">Theo giai đoạn</button>
    <button class="view-btn" role="tab" aria-selected="false" data-view="agenda">Lịch chăm sóc<span class="count" id="countAgenda"></span></button>
  </div>
</nav>

<main id="app">
  <div class="loading" id="loadingBox"><i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>Đang tải dữ liệu học sinh…</div>

  <section class="view active" id="view-overview" hidden></section>

  <section class="view" id="view-list" hidden>
    <div class="toolbar">
      <label class="sr-only" for="fStage">Giai đoạn</label>
      <select id="fStage"><option value="">Mọi giai đoạn</option></select>
      <label class="sr-only" for="fProgram">Chương trình</label>
      <select id="fProgram"><option value="">Mọi chương trình</option></select>
      <label class="sr-only" for="fFlag">Cần chú ý</label>
      <select id="fFlag">
        <option value="">Tất cả học sinh</option>
        <option value="attention">Chỉ học sinh cần chú ý</option>
        <option value="overdue">Quá hạn liên hệ</option>
        <option value="nocontact">Chưa liên hệ hơn 30 ngày</option>
        <option value="absent">Vắng nhiều (30 ngày qua)</option>
        <option value="tuition">Học phí chờ xác nhận</option>
      </select>
      <span class="spacer"></span>
      <span class="result" id="listResult"></span>
      <button class="btn" id="exportBtn"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> Xuất CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><button data-sort="name">Học sinh <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th>Chương trình</th>
            <th><button data-sort="stage">Giai đoạn <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th>Người giám hộ</th>
            <th><button data-sort="last">Liên hệ gần nhất <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th><button data-sort="next">Hẹn liên hệ <i class="fa-solid fa-sort" aria-hidden="true"></i></button></th>
            <th>Cần chú ý</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </section>

  <section class="view" id="view-board" hidden>
    <p class="callout" style="margin-bottom:1rem;">Kéo thẻ học sinh sang cột khác để chuyển giai đoạn. Trên điện thoại, mở hồ sơ và chọn giai đoạn ở thanh hành trình.</p>
    <div class="board" id="board"></div>
  </section>

  <section class="view" id="view-agenda" hidden>
    <div class="agenda" id="agenda"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dName" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">
      <div class="avatar" id="dAvatar"></div>
      <div style="min-width:0;">
        <h2 id="dName"></h2>
        <p id="dSub"></p>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Đóng hồ sơ"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="rail" id="dRail" role="group" aria-label="Giai đoạn chăm sóc"></div>
  </div>
  <div class="drawer-tabs" role="tablist">
    <button role="tab" aria-selected="true" data-pane="care">Chăm sóc</button>
    <button role="tab" aria-selected="false" data-pane="profile">Hồ sơ</button>
    <button role="tab" aria-selected="false" data-pane="study">Học tập</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-pane active" id="pane-care"></div>
    <div class="drawer-pane" id="pane-profile"></div>
    <div class="drawer-pane" id="pane-study"></div>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  const token = localStorage.getItem('wvn_admin_token');

  const STAGES = [
    { key: 'tiem-nang',  label: 'Tiềm năng',  c: '#5b4bb7', cs: '#efedfb' },
    { key: 'hoc-thu',    label: 'Học thử',    c: '#0284c7', cs: '#e6f3fb' },
    { key: 'dang-hoc',   label: 'Đang học',   c: '#2f7a4f', cs: '#e7f4ec' },
    { key: 'tam-nghi',   label: 'Tạm nghỉ',   c: '#a15c07', cs: '#fdf1dc' },
    { key: 'da-nghi',    label: 'Đã nghỉ',    c: '#8a94a6', cs: '#eef1f5' },
    { key: 'hoan-thanh', label: 'Hoàn thành', c: '#0f1e3d', cs: '#e3e8f0' }
  ];
  const STAGE = Object.fromEntries(STAGES.map(s => [s.key, s]));
  const DEFAULT_STAGE = 'dang-hoc';

  const TYPES = [
    { key: 'goi-dien', label: 'Gọi điện', icon: 'fa-phone' },
    { key: 'zalo', label: 'Zalo', icon: 'fa-comment-dots' },
    { key: 'gap-mat', label: 'Gặp trực tiếp', icon: 'fa-handshake' },
    { key: 'email', label: 'Email', icon: 'fa-envelope' },
    { key: 'tham-nha', label: 'Thăm nhà', icon: 'fa-house' },
    { key: 'phan-hoi-hoc-tap', label: 'Phản hồi học tập', icon: 'fa-book-open' },
    { key: 'khac', label: 'Khác', icon: 'fa-note-sticky' }
  ];
  const TYPE = Object.fromEntries(TYPES.map(t => [t.key, t]));
  const PRIORITY = { thuong: 'Bình thường', cao: 'Cao', khan: 'Khẩn' };

  let students = [];
  let access = { grades: false, tuition: false, attendance: false };
  let me = { displayName: '' };
  let state = { view: 'overview', q: '', stage: '', program: '', flag: '', sort: 'name', dir: 1, openId: null, pane: 'care' };

  // ---------- Tiện ích ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAY = 86400000;
  function todayStr() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function addDays(str, n) { const d = new Date(str + 'T00:00:00'); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  function fmtDate(v) { if (!v) return ''; const d = new Date(v.length === 10 ? v + 'T00:00:00' : v); return isNaN(d) ? '' : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
  function relDays(v) {
    if (!v) return '';
    const d = new Date(v.length === 10 ? v + 'T00:00:00' : v); const t = new Date(todayStr() + 'T00:00:00');
    const n = Math.round((d - t) / DAY);
    if (n === 0) return 'hôm nay'; if (n === 1) return 'ngày mai'; if (n === -1) return 'hôm qua';
    return n > 0 ? `${n} ngày nữa` : `${-n} ngày trước`;
  }
  function money(n) { return (Number(n) || 0).toLocaleString('vi-VN') + ' đ'; }
  function initials(name) { const p = String(name || '?').trim().split(/\s+/); return ((p.length > 1 ? p[p.length - 2][0] : '') + p[p.length - 1][0]).toUpperCase(); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase(); }
  function toast(msg, isError) { const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isError ? ' error' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'toast', isError ? 6000 : 2800); }

  async function api(path, options = {}, attempt = 0) {
    const canRetry = (!options.method || options.method === 'GET') && attempt < 2;
    let res;
    try { res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}), 'X-Admin-Token': token } }); }
    catch (e) { if (canRetry) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, options, attempt + 1); } throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
    const data = await res.json().catch(() => ({}));
    if (res.status >= 500 && (!data.message || data.retryable) && canRetry) { await new Promise(r => setTimeout(r, 800 * (attempt + 1))); return api(path, options, attempt + 1); }
    if (res.status === 401) { localStorage.removeItem('wvn_admin_token'); window.location.replace('admin-dang-nhap.html'); throw new Error('Phiên đăng nhập đã hết hạn.'); }
    if (!res.ok || !data.success) throw new Error(data.message || 'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
    return data;
  }

  // ---------- Suy luận trạng thái từng học sinh ----------
  function profileOf(s) { return s.profile || { stage: DEFAULT_STAGE, priority: 'thuong', tags: [] }; }
  function stageOf(s) { return STAGE[profileOf(s).stage] ? profileOf(s).stage : DEFAULT_STAGE; }
  function lastContact(s) { return s.interactions && s.interactions.length ? s.interactions[0].happenedAt : null; }
  function flagsOf(s) {
    const f = [];
    const p = profileOf(s); const today = todayStr(); const stage = stageOf(s);
    const active = stage === 'dang-hoc' || stage === 'hoc-thu' || stage === 'tiem-nang';
    if (p.nextFollowUp && p.nextFollowUp < today && active) f.push({ key: 'overdue', label: 'Quá hạn liên hệ', cls: 'red' });
    const last = lastContact(s);
    if (active && (!last || Date.now() - new Date(last).getTime() > 30 * DAY)) f.push({ key: 'nocontact', label: last ? 'Lâu chưa liên hệ' : 'Chưa từng liên hệ', cls: 'amber' });
    if (s.attendance && s.attendance.absent30 >= 3) f.push({ key: 'absent', label: `Vắng ${s.attendance.absent30} buổi`, cls: 'red' });
    if (s.tuition && s.tuition.pending > 0) f.push({ key: 'tuition', label: 'Học phí chờ xác nhận', cls: 'amber' });
    if (p.priority === 'khan') f.push({ key: 'priority', label: 'Ưu tiên khẩn', cls: 'red' });
    return f;
  }
  function programsAll() { return Array.from(new Set(students.flatMap(s => s.programs))).sort((a, b) => a.localeCompare(b, 'vi')); }

  function matches(s) {
    if (state.q) {
      const hay = norm([s.studentName, s.parentEmail, profileOf(s).guardianName, profileOf(s).guardianPhone, profileOf(s).school, (profileOf(s).tags || []).join(' ')].join(' '));
      if (!norm(state.q).split(/\s+/).every(w => hay.includes(w))) return false;
    }
    if (state.stage && stageOf(s) !== state.stage) return false;
    if (state.program && !s.programs.includes(state.program)) return false;
    if (state.flag) {
      const f = flagsOf(s);
      if (state.flag === 'attention' ? !f.length : !f.some(x => x.key === state.flag)) return false;
    }
    return true;
  }

  // ---------- Vẽ các thành phần nhỏ ----------
  const stageChip = key => { const st = STAGE[key]; return `<span class="chip stage" style="--c:${st.c};--cs:${st.cs}">${esc(st.label)}</span>`; };
  const flagChips = s => { const f = flagsOf(s); return f.length ? `<span class="flags">${f.map(x => `<span class="chip ${x.cls}">${esc(x.label)}</span>`).join('')}</span>` : ''; };
  function rowItem(s, sub, right) {
    return `<button class="row-item" data-open="${esc(s.id)}"><span class="avatar">${esc(initials(s.studentName))}</span><span class="row-main"><strong>${esc(s.studentName)}</strong><small>${sub}</small></span>${right || ''}</button>`;
  }

  // ---------- Tổng quan ----------
  function renderOverview() {
    const today = todayStr();
    const active = students.filter(s => stageOf(s) === 'dang-hoc');
    const due = students.filter(s => { const n = profileOf(s).nextFollowUp; return n && n <= addDays(today, 7) && !['da-nghi', 'hoan-thanh'].includes(stageOf(s)); });
    const attention = students.filter(s => flagsOf(s).length);
    const monthAgo = Date.now() - 30 * DAY;
    const touched = students.filter(s => { const l = lastContact(s); return l && new Date(l).getTime() >= monthAgo; });

    const byStage = Object.fromEntries(STAGES.map(st => [st.key, 0]));
    students.forEach(s => byStage[stageOf(s)]++);

    const recent = students.flatMap(s => (s.interactions || []).map(i => ({ s, i }))).sort((a, b) => new Date(b.i.happenedAt) - new Date(a.i.happenedAt)).slice(0, 8);
    const attentionTop = attention.sort((a, b) => flagsOf(b).length - flagsOf(a).length).slice(0, 8);
    const hour = new Date().getHours();
    const greet = hour < 11 ? 'Chào buổi sáng' : hour < 14 ? 'Chào buổi trưa' : hour < 18 ? 'Chào buổi chiều' : 'Chào buổi tối';

    $('view-overview').innerHTML = `
      <div class="overview-head">
        <div><h1>${greet}${me.displayName ? ', ' + esc(me.displayName) : ''}</h1>
        <p>${due.length ? `Có ${due.length} học sinh cần liên hệ trong 7 ngày tới.` : 'Không có lịch liên hệ nào trong 7 ngày tới.'}</p></div>
        <button class="btn" data-goto="agenda"><i class="fa-regular fa-calendar" aria-hidden="true"></i> Mở lịch chăm sóc</button>
      </div>
      <div class="pulse">
        <div><b>${students.length}</b><small>Học sinh trong hệ thống</small></div>
        <div><b>${active.length}</b><small>Đang theo học</small></div>
        <div class="${attention.length ? 'warn' : ''}"><b>${attention.length}</b><small>Cần chú ý</small></div>
        <div><b>${students.length ? Math.round(touched.length / students.length * 100) : 0}%</b><small>Được liên hệ trong 30 ngày</small></div>
      </div>
      <div class="journey" role="group" aria-label="Học sinh theo giai đoạn">
        ${STAGES.map(st => `<button class="journey-step" style="--c:${st.c}" data-stage-filter="${st.key}"><b>${byStage[st.key]}</b><span>${esc(st.label)}</span></button>`).join('')}
      </div>
      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h2>Cần chú ý</h2><span class="hint">${attention.length ? `${attention.length} học sinh` : ''}</span></div>
          <div class="panel-body">${attentionTop.length ? attentionTop.map(s => rowItem(s, esc(s.programs.join(', ') || s.parentEmail), flagChips(s))).join('') + (attention.length > 8 ? `<button class="row-item" data-goto="list" data-flag="attention" style="justify-content:center;color:var(--brand);font-weight:600;">Xem tất cả ${attention.length} học sinh</button>` : '') : '<div class="empty"><strong>Mọi học sinh đều ổn.</strong>Không có ai quá hạn liên hệ, vắng nhiều hay còn học phí chờ xác nhận.</div>'}</div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Chăm sóc gần đây</h2></div>
          <div class="panel-body">${recent.length ? recent.map(({ s, i }) => rowItem(s, `${esc(TYPE[i.type] ? TYPE[i.type].label : 'Khác')} · ${esc(relDays(i.happenedAt))}${i.createdBy ? ' · ' + esc(i.createdBy) : ''}`)).join('') : '<div class="empty"><strong>Chưa có ghi nhận chăm sóc nào.</strong>Mở hồ sơ một học sinh và ghi lại cuộc gọi hoặc buổi gặp phụ huynh đầu tiên.</div>'}</div>
        </div>
      </div>`;
  }

  // ---------- Danh sách ----------
  function sortedFiltered() {
    const list = students.filter(matches);
    const order = Object.fromEntries(STAGES.map((s, i) => [s.key, i]));
    const k = state.sort, d = state.dir;
    list.sort((a, b) => {
      let x, y;
      if (k === 'stage') { x = order[stageOf(a)]; y = order[stageOf(b)]; }
      else if (k === 'last') { x = lastContact(a) || ''; y = lastContact(b) || ''; }
      else if (k === 'next') { x = profileOf(a).nextFollowUp || '9999'; y = profileOf(b).nextFollowUp || '9999'; }
      else return a.studentName.localeCompare(b.studentName, 'vi') * d;
      return (x < y ? -1 : x > y ? 1 : a.studentName.localeCompare(b.studentName, 'vi')) * d;
    });
    return list;
  }
  function renderList() {
    const list = sortedFiltered();
    const today = todayStr();
    $('listResult').textContent = `${list.length} / ${students.length} học sinh`;
    $('listBody').innerHTML = list.length ? list.map(s => {
      const p = profileOf(s); const last = lastContact(s); const next = p.nextFollowUp;
      const nextCls = next && next < today ? 'overdue' : next && next <= addDays(today, 3) ? 'soon' : '';
      return `<tr data-open="${esc(s.id)}" tabindex="0">
        <td><div class="name-cell"><span class="avatar">${esc(initials(s.studentName))}</span><div><strong>${esc(s.studentName)}</strong><small>${esc([p.gradeLevel, s.dob ? 'SN ' + fmtDate(s.dob) : ''].filter(Boolean).join(' · ') || s.parentEmail)}</small></div></div></td>
        <td>${esc(s.programs.join(', ')) || '<span class="locked">Chưa gán</span>'}</td>
        <td>${stageChip(stageOf(s))}</td>
        <td>${esc(p.guardianName || '')}${p.guardianPhone ? `<br><small class="locked">${esc(p.guardianPhone)}</small>` : (p.guardianName ? '' : `<small class="locked">${esc(s.parentEmail)}</small>`)}</td>
        <td>${last ? `${esc(fmtDate(last))}<br><small class="locked">${esc(relDays(last))}</small>` : '<span class="locked">Chưa có</span>'}</td>
        <td>${next ? `<span class="${nextCls}">${esc(fmtDate(next))}</span><br><small class="locked">${esc(relDays(next))}</small>` : '<span class="locked">—</span>'}</td>
        <td>${flagChips(s)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="7"><div class="empty"><strong>Không có học sinh nào khớp bộ lọc.</strong>Thử bỏ bớt điều kiện lọc hoặc xoá ô tìm kiếm.</div></td></tr>`;
  }

  // ---------- Theo giai đoạn ----------
  function renderBoard() {
    const list = students.filter(matches);
    $('board').innerHTML = STAGES.map(st => {
      const items = list.filter(s => stageOf(s) === st.key);
      return `<div class="column" data-stage="${st.key}" style="--c:${st.c}">
        <div class="column-head"><strong>${esc(st.label)}</strong><span>${items.length}</span></div>
        <div class="column-body">${items.map(s => `<button class="card" draggable="true" data-open="${esc(s.id)}" data-id="${esc(s.id)}"><strong>${esc(s.studentName)}</strong><small>${esc(s.programs.join(', ') || s.parentEmail)}</small>${flagChips(s)}</button>`).join('') || '<div class="empty" style="padding:0.8rem 0.4rem;font-size:0.8rem;">Chưa có học sinh.</div>'}</div>
      </div>`;
    }).join('');
  }

  // ---------- Lịch chăm sóc ----------
  function renderAgenda() {
    const today = todayStr();
    const withNext = students.filter(s => profileOf(s).nextFollowUp && !['da-nghi', 'hoan-thanh'].includes(stageOf(s)) && matches(s))
      .sort((a, b) => profileOf(a).nextFollowUp.localeCompare(profileOf(b).nextFollowUp));
    const groups = [
      { title: 'Quá hạn', list: withNext.filter(s => profileOf(s).nextFollowUp < today) },
      { title: 'Hôm nay', list: withNext.filter(s => profileOf(s).nextFollowUp === today) },
      { title: '7 ngày tới', list: withNext.filter(s => profileOf(s).nextFollowUp > today && profileOf(s).nextFollowUp <= addDays(today, 7)) },
      { title: 'Sau đó', list: withNext.filter(s => profileOf(s).nextFollowUp > addDays(today, 7)) }
    ];
    const never = students.filter(s => ['dang-hoc', 'hoc-thu', 'tiem-nang'].includes(stageOf(s)) && !profileOf(s).nextFollowUp && matches(s));
    $('agenda').innerHTML = groups.filter(g => g.list.length).map(g => `
      <div class="agenda-group"><h3>${esc(g.title)} <span>${g.list.length}</span></h3>
        <div class="panel"><div class="panel-body">${g.list.map(s => rowItem(s, `${esc(fmtDate(profileOf(s).nextFollowUp))} · ${esc(relDays(profileOf(s).nextFollowUp))}${profileOf(s).followUpNote ? ' · ' + esc(profileOf(s).followUpNote) : ''}`, stageChip(stageOf(s)))).join('')}</div></div>
      </div>`).join('') + (never.length ? `
      <div class="agenda-group"><h3>Chưa có lịch hẹn <span>${never.length}</span></h3>
        <div class="panel"><div class="panel-body">${never.slice(0, 30).map(s => rowItem(s, esc(s.programs.join(', ') || s.parentEmail), stageChip(stageOf(s)))).join('')}${never.length > 30 ? `<div class="empty">Và ${never.length - 30} học sinh khác. Dùng ô tìm kiếm để thu hẹp.</div>` : ''}</div></div>
      </div>` : '') || '<div class="panel"><div class="empty"><strong>Chưa có lịch liên hệ nào.</strong>Khi ghi nhận chăm sóc, hãy đặt ngày hẹn liên hệ tiếp theo để học sinh xuất hiện ở đây.</div></div>';
    const overdue = groups[0].list.length + groups[1].list.length;
    $('countAgenda').textContent = overdue ? overdue : '';
    $('countAgenda').className = 'count' + (groups[0].list.length ? ' alert' : '');
  }

  function renderAll() {
    $('countList').textContent = students.length;
    renderOverview(); renderList(); renderBoard(); renderAgenda();
    if (state.openId) renderDrawer();
  }

  // ---------- Ngăn hồ sơ ----------
  const findStudent = id => students.find(s => s.id === id);
  let lastFocus = null;
  function openDrawer(id) {
    if (!findStudent(id)) return;
    lastFocus = document.activeElement;
    state.openId = id; state.pane = 'care';
    renderDrawer();
    $('drawer').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false'); $('scrim').classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('drawerClose').focus(), 50);
  }
  function closeDrawer() {
    state.openId = null;
    $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('open');
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function renderDrawer() {
    const s = findStudent(state.openId); if (!s) return closeDrawer();

      const cls = i === curIdx ? 'current' : (i < curIdx && curIdx <= 2 && i <= 2 ? 'passed' : '');

          ${f('followUpNote', 'Việc cần làm khi liên hệ', p.followUpNote, 'maxlength="300"')}
          <div class="field full"><label for="tags">Nhãn (phân cách bằng dấu phẩy)</label><input id="tags" name="tags" value="${esc((p.tags || []).join(', '))}" placeholder="Ví dụ: cần kèm thêm, anh chị em cùng học, học bổng"></div>
        </div>

        <div class="form-actions">
          <span class="note">${p.updatedAt ? `Cập nhật ${esc(relDays(p.updatedAt))}${p.updatedBy ? ' bởi ' + esc(p.updatedBy) : ''}` : 'Chưa có hồ sơ chăm sóc.'}</span>

  function renderStudy(s) {
    const lock = what => `<span class="locked"><i class="fa-solid fa-lock" aria-hidden="true"></i> Tài khoản chưa được cấp quyền ${what}</span>`;
    const g = s.grades, t = s.tuition, a = s.attendance;
    const avg = g && g.scored ? (g.total / g.scored).toFixed(1) : null;
    const totalAtt = a ? a.present + a.absent + a.late : 0;
    $('pane-study').innerHTML = `
      <div class="stat-blocks">
        <div class="stat-block"><h4><i class="fa-solid fa-graduation-cap" aria-hidden="true"></i> Bảng điểm</h4>
          ${!access.grades ? lock('Bảng Điểm') : g ? `<b>${avg != null ? avg : '—'}</b><small>Điểm trung bình · ${g.count} lần đánh giá</small>` : '<small>Chưa có điểm</small>'}</div>
        <div class="stat-block"><h4><i class="fa-solid fa-clipboard-check" aria-hidden="true"></i> Chuyên cần</h4>
          ${!access.attendance ? lock('Điểm Danh') : a && totalAtt ? `<b>${Math.round(a.present / totalAtt * 100)}%</b><small>Có mặt ${a.present}/${totalAtt} buổi · vắng ${a.absent30} buổi trong 30 ngày</small>` : '<small>Chưa có dữ liệu điểm danh</small>'}</div>
        <div class="stat-block"><h4><i class="fa-solid fa-coins" aria-hidden="true"></i> Học phí</h4>
          ${!access.tuition ? lock('Học Phí') : t ? `<b>${money(t.paid)}</b><small>${t.count} lần ghi nhận${t.pending ? ` · <span class="soon">${t.pending} chờ xác nhận</span>` : ''}${t.lastPeriod ? ' · gần nhất: ' + esc(t.lastPeriod) : ''}</small>` : '<small>Chưa có ghi nhận học phí</small>'}</div>
      </div>
      ${access.grades && g && g.last ? `<div class="panel"><div class="panel-head"><h2>Đánh giá gần nhất</h2><span class="hint">${esc(fmtDate(g.last.recordedAt))}</span></div>
        <div style="padding:0.9rem 1.1rem;"><p><b>${esc(g.last.term || 'Không ghi kỳ')}</b>${g.last.score != null && g.last.score !== '' ? ` · ${esc(g.last.score)} điểm` : ''}</p>${g.last.comment ? `<p class="locked" style="margin-top:0.3rem;white-space:pre-wrap;">${esc(g.last.comment)}</p>` : ''}</div></div>` : ''}
      <p class="locked" style="margin-top:1rem;">Chi tiết điểm, điểm danh và học phí vẫn nhập ở các mục tương ứng trong <a href="/admin" style="color:var(--brand);">trang quản trị</a>; CRM chỉ tổng hợp lại để xem nhanh.</p>`;

  // ---------- Ghi dữ liệu ----------
  function profilePayload(s, overrides) {
    const p = profileOf(s);
    return {
      studentId: s.id, stage: stageOf(s), priority: p.priority || 'thuong',
      gradeLevel: p.gradeLevel || '', school: p.school || '', address: p.address || '',
      guardianName: p.guardianName || '', guardianPhone: p.guardianPhone || '', guardianRelation: p.guardianRelation || '',
      source: p.source || '', tags: p.tags || [], nextFollowUp: p.nextFollowUp || '', followUpNote: p.followUpNote || '',
      caretaker: p.caretaker || '', ...overrides
    };
  }
  async function saveProfile(s, overrides, successMsg) {
    const payload = profilePayload(s, overrides);
    const before = s.profile;
    s.profile = { ...profileOf(s), ...payload, tags: Array.isArray(payload.tags) ? payload.tags : String(payload.tags).split(',').map(x => x.trim()).filter(Boolean) };
    renderAll();
    try {
      const r = await api('/api/portal-crm-save-profile', { method: 'POST', body: JSON.stringify(payload) });
      s.profile.updatedAt = r.updatedAt; s.profile.updatedBy = r.updatedBy;
      renderAll(); toast(successMsg || 'Đã lưu hồ sơ.');
    } catch (e) { s.profile = before; renderAll(); toast(e.message, true); }
  }
  function setStage(id, stage) {
    const s = findStudent(id); if (!s || stageOf(s) === stage) return;
    saveProfile(s, { stage }, `Đã chuyển ${s.studentName} sang "${STAGE[stage].label}".`);
  }

  // ---------- Xuất CSV ----------
  function exportCsv() {
    const rows = sortedFiltered();
    const head = ['Học sinh', 'Ngày sinh', 'Chương trình', 'Giai đoạn', 'Ưu tiên', 'Lớp', 'Trường', 'Người giám hộ', 'Quan hệ', 'Điện thoại', 'Email phụ huynh', 'Người phụ trách', 'Liên hệ gần nhất', 'Hẹn liên hệ', 'Nhãn', 'Cần chú ý'];
    const cell = v => { const x = String(v == null ? '' : v); return /[",\n;]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
    const lines = [head.join(',')].concat(rows.map(s => { const p = profileOf(s); return [
      s.studentName, fmtDate(s.dob), s.programs.join(' | '), STAGE[stageOf(s)].label, PRIORITY[p.priority || 'thuong'], p.gradeLevel, p.school,
      p.guardianName, p.guardianRelation, p.guardianPhone, s.parentEmail, p.caretaker, fmtDate(lastContact(s)), fmtDate(p.nextFollowUp),
      (p.tags || []).join(' | '), flagsOf(s).map(f => f.label).join(' | ')
    ].map(cell).join(','); }));
    const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `crm-hoc-sinh-${todayStr()}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(`Đã xuất ${rows.length} học sinh.`);
  }

  // ---------- Sự kiện ----------
  function setView(v, opts) {
    state.view = v;
    if (opts && 'stage' in opts) { state.stage = opts.stage; $('fStage').value = opts.stage; }
    if (opts && 'flag' in opts) { state.flag = opts.flag; $('fFlag').value = opts.flag; }
    document.querySelectorAll('.view-btn').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v));
    document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
    renderAll();
    window.scrollTo({ top: 0 });
  }

  document.addEventListener('click', e => {
    const t = e.target;
    const del = t.closest('[data-del]');
    if (del) { e.stopPropagation(); return deleteInteraction(del.dataset.del); }
    const stageBtn = t.closest('[data-set-stage]'); if (stageBtn) return setStage(state.openId, stageBtn.dataset.setStage);
    const quick = t.closest('[data-quick]'); if (quick) { $('logNext').value = addDays(todayStr(), +quick.dataset.quick); return; }
    const sf = t.closest('[data-stage-filter]'); if (sf) return setView('list', { stage: sf.dataset.stageFilter, flag: '' });
    const go = t.closest('[data-goto]'); if (go) return setView(go.dataset.goto, go.dataset.flag ? { flag: go.dataset.flag } : undefined);
    const open = t.closest('[data-open]'); if (open) return openDrawer(open.dataset.open);
    const vb = t.closest('.view-btn'); if (vb) return setView(vb.dataset.view);
    const tab = t.closest('.drawer-tabs button'); if (tab) { state.pane = tab.dataset.pane; return renderDrawer(); }
    const sort = t.closest('[data-sort]'); if (sort) { state.dir = state.sort === sort.dataset.sort ? -state.dir : 1; state.sort = sort.dataset.sort; return renderList(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.openId) closeDrawer();
    if (e.key === 'Enter' && e.target.matches('tr[data-open]')) openDrawer(e.target.dataset.open);
    if (e.key === '/' && !e.target.matches('input, textarea, select')) { e.preventDefault(); $('globalSearch').focus(); }
  });
  $('drawerClose').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  $('exportBtn').addEventListener('click', exportCsv);

  let qTimer;
  $('globalSearch').addEventListener('input', e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value.trim(); if (state.q && state.view === 'overview') setView('list'); else renderAll(); }, 150);
  });
  ['fStage', 'fProgram', 'fFlag'].forEach(id => $(id).addEventListener('change', e => {
    state[{ fStage: 'stage', fProgram: 'program', fFlag: 'flag' }[id]] = e.target.value; renderAll();
  }));

  document.addEventListener('submit', async e => {
    e.preventDefault();
    const s = findStudent(state.openId); if (!s) return;
    const form = e.target; const btn = form.querySelector('[type=submit]');
    if (form.id === 'logForm') {
      const fd = new FormData(form);
      const payload = { studentId: s.id, type: fd.get('type'), content: String(fd.get('content') || '').trim(), happenedAt: fd.get('happenedAt'), outcome: fd.get('outcome'), nextFollowUp: fd.get('nextFollowUp') || '' };
      if (!payload.content) { toast('Nhập nội dung trao đổi trước khi lưu.', true); return; }
      btn.disabled = true;
      try {
        const r = await api('/api/portal-crm-add-interaction', { method: 'POST', body: JSON.stringify(payload) });
        s.interactions = [r.interaction].concat(s.interactions).sort((a, b) => new Date(b.happenedAt) - new Date(a.happenedAt));
        s.profile = { ...profileOf(s), nextFollowUp: payload.nextFollowUp, followUpNote: payload.nextFollowUp ? (payload.outcome || '') : '' };
        renderAll(); toast('Đã lưu ghi nhận chăm sóc.');
      } catch (err) { btn.disabled = false; toast(err.message, true); }
    }
    if (form.id === 'profileForm') {
      if (!form.reportValidity()) return;
      const fd = new FormData(form);
      const o = {}; for (const [k, v] of fd.entries()) o[k] = String(v).trim();
      o.tags = o.tags ? o.tags.split(',').map(x => x.trim()).filter(Boolean) : [];
      btn.disabled = true;
      await saveProfile(s, o, 'Đã lưu hồ sơ.');
    }
  });

  async function deleteInteraction(id) {
    const s = findStudent(state.openId); if (!s) return;
    if (!confirm('Xoá ghi nhận chăm sóc này? Thao tác không hoàn tác được.')) return;
    const before = s.interactions;
    s.interactions = s.interactions.filter(i => i.id !== id); renderAll();
    try { await api('/api/portal-crm-delete-interaction', { method: 'POST', body: JSON.stringify({ studentId: s.id, id }) }); toast('Đã xoá ghi nhận.'); }
    catch (err) { s.interactions = before; renderAll(); toast(err.message, true); }
  }

  // Kéo thả trên bảng giai đoạn
  let dragId = null;
  $('board').addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
  $('board').addEventListener('dragend', e => { const c = e.target.closest('.card'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.column.drop').forEach(x => x.classList.remove('drop')); });
  $('board').addEventListener('dragover', e => { const col = e.target.closest('.column'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.column.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
  $('board').addEventListener('drop', e => { const col = e.target.closest('.column'); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; setStage(id, col.dataset.stage); });

  // ---------- Khởi động ----------
  async function load() {
    try {
      const [data, who] = await Promise.all([api('/api/portal-crm-data'), api('/api/portal-admin-whoami').catch(() => null)]);
      students = data.students || []; access = data.access || access;
      if (who) { me = who; $('whoLabel').textContent = who.displayName || ''; }
      $('fStage').innerHTML = '<option value="">Mọi giai đoạn</option>' + STAGES.map(s => `<option value="${s.key}">${esc(s.label)}</option>`).join('');
      $('fProgram').innerHTML = '<option value="">Mọi chương trình</option>' + programsAll().map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
      $('loadingBox').remove();
      document.querySelectorAll('.view').forEach(v => v.hidden = false);
      if (!students.length) {
        $('view-overview').innerHTML = `<div class="panel"><div class="empty" style="padding:2.5rem 1.5rem;"><strong>Chưa có học sinh nào trong hệ thống.</strong>Thêm học sinh ở mục Học Sinh trong <a href="/admin" style="color:var(--brand);">trang quản trị</a>, rồi quay lại đây để chăm sóc.</div></div>`;
        renderList(); renderBoard(); renderAgenda();
        return;
      }
      renderAll();
      const deep = new URLSearchParams(location.search).get('hs'); if (deep) openDrawer(deep);
    } catch (e) {
      const box = $('loadingBox');
      const noPerm = /quyền/i.test(e.message);
      box.innerHTML = `<div class="error-box">${noPerm ? '<strong>Tài khoản của bạn chưa được cấp quyền Học Sinh.</strong><br>Nhờ Quản Trị Viên Chính cấp quyền ở mục Tài Khoản Quản Trị, sau đó tải lại trang này.' : esc(e.message)}</div>
        <p style="margin-top:1rem;"><button class="btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Tải lại</button></p>`;
    }
  }
  load();
})();
</script>
</body>
</html>
