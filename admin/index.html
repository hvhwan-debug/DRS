<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang Quản Trị Bài Viết - DR SOLUTIONS</title>
</head>
<body>
  <div id="token-login-box" style="position:fixed; inset:0; background:#f1f5f9; z-index:999999; display:flex; align-items:center; justify-content:center; font-family:system-ui, sans-serif;">
    <div style="background:#fff; padding:2rem; border-radius:10px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:90%; max-width:400px; text-align:center;">
      <h2 style="margin-top:0; color:#0f172a; font-size:1.25rem;">Đăng Nhập Quản Trị</h2>
      <p style="color:#64748b; font-size:0.9rem; margin-bottom:1.5rem;">Dán Personal Access Token (ghp_...) để vào viết bài:</p>
      <input type="password" id="token-input" placeholder="ghp_..." style="width:100%; padding:0.75rem; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; margin-bottom:1rem; font-size:0.95rem;">
      <button onclick="submitToken()" style="width:100%; padding:0.75rem; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size:0.95rem;">Vào Trang Quản Trị</button>
    </div>
  </div>

  <script>
    const savedAuth = localStorage.getItem('decap-cms-user');
    if (savedAuth && JSON.parse(savedAuth).token) {
      document.getElementById('token-login-box').style.display = 'none';
    }

    function submitToken() {
      const val = document.getElementById('token-input').value.trim();
      if (val) {
        localStorage.setItem('decap-cms-user', JSON.stringify({ token: val, backendName: 'github' }));
        document.getElementById('token-login-box').style.display = 'none';
        window.location.reload();
      }
    }
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
