name: Build Posts Index

# Tự động chạy mỗi khi có file trong content/posts/ được thêm/sửa/xóa,
# hoặc có thể chạy tay bằng nút "Run workflow" trong tab Actions trên GitHub.
on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate posts-index.json
        run: python3 .github/scripts/build_index.py

      - name: Commit and push if file changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts-index.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
          else
            git commit -m "Tự động cập nhật posts-index.json [skip ci]"
            git push
          fi
